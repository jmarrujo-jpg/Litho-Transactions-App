# Only needed if you deploy the Worker by connecting it to GitHub (Workers Builds).
# If you create the Worker the easy way — "Create Worker" -> Edit code -> paste worker.js -> Deploy —
# you don't need this file at all.
#
# The Worker's name in the Cloudflare dashboard must match "name" below, or wrangler will deploy
# to a Worker called "litho-api" instead. Change this to match your Worker if you named it something else.
name = "lithofloor"
main = "worker.js"
compatibility_date = "2024-11-06"

# Write lock: one Durable Object that makes sheet writes run one at a time (see worker.js).
# SQLite-backed Durable Objects work on the Workers Free plan.
[[durable_objects.bindings]]
name = "WRITE_LOCK"
class_name = "WriteLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WriteLock"]
