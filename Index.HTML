<style>
  :root {
    --ink: #131b2e;
    --muted: #6b7280;
    --line: #dfe3ea;
    --accent: #0f2350;      /* navy sampled from the logo */
    --accent-dark: #0a1836;
    --good: #0f7a3d;
    --bg: #eef1f6;
    --card: #ffffff;
    --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  #app { max-width: 900px; margin: 0 auto; padding: 16px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    border-bottom: 3px solid var(--accent); padding-bottom: 10px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo { height: 40px; width: auto; flex: 0 0 auto; display: block; }
  header h1 { font-size: 20px; margin: 0; color: var(--accent); letter-spacing: .2px; }
  .header-right { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .header-right a { color: var(--accent); cursor: pointer; text-decoration: none; }
  header button {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; cursor: pointer;
  }
  .tabbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabbar button {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--muted);
  }
  .tabbar button.active { background: var(--accent); color: white; border-color: var(--accent); }
  .searchrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .searchwrap { position: relative; flex: 1; min-width: 0; height: 48px; }
  .searchwrap input {
    width: 100%; height: 48px; padding: 0 14px 0 42px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
  }
  .searchwrap input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 35, 80, .16);
  }
  .searchwrap .mag {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; pointer-events: none;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
  }
  .queue-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; cursor: pointer;
  }
  .queue-item + .queue-item { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .ticket-id { font-weight: 700; font-size: 16px; }
  .sub { color: var(--muted); font-size: 13px; }
  .specs { color: var(--ink); font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .specs b { color: var(--muted); font-weight: 600; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .badge.notstarted { background: #eef2ff; color: #3730a3; }
  .badge.inprogress { background: #fff7e6; color: var(--warn); }
  .badge.wip { background: #eafaf0; color: var(--good); }
  .btn {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.success { background: var(--good); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 160px; margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field select, .field input, .field textarea {
    width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px;
  }
  .stat { text-align: center; }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .steel-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 13px; }
  .steel-meta div span { display: block; color: var(--muted); font-size: 11px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 10px 18px; border-radius: 8px; font-size: 14px;
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .gate { max-width: 380px; margin: 60px auto; text-align: center; }
  .gate h2 { margin-bottom: 4px; }
  .gate p { color: var(--muted); font-size: 14px; margin-top: 0; }
</style>

<script>
  var state = { view: 'queue', listView: 'queue', ticket: null };

  // Rate/pricing data is fetched once and cached in the browser so the Group -> Sub -> Item
  // dropdowns resolve instantly with no per-selection server round trip. Ticket data is
  // never cached here — it's always fetched fresh so operators see each other's changes.
  var rateData = { groups: [], tree: {} };

  function loadRateData() {
    google.script.run.withSuccessHandler(function (data) {
      if (data && data.groups) rateData = data;
    }).getRateTree();
  }

  // Runs cb once rate data is available (fetches it first if the boot load hasn't landed yet).
  function ensureRateData(cb) {
    if (rateData.groups && rateData.groups.length) { cb(); return; }
    google.script.run.withSuccessHandler(function (data) {
      if (data && data.groups) rateData = data;
      cb();
    }).withFailureHandler(function () { cb(); }).getRateTree();
  }

  function rateGroups() { return rateData.groups || []; }
  function rateSubs(group) { var n = rateData.tree[group]; return n ? n.subs : []; }
  function rateItems(group, sub) { var n = rateData.tree[group]; return n ? (n.items[sub || ''] || []) : []; }

  // ----- Coating Item <-> Chem Code pairing -----
  // Selecting an item fills its chem code; selecting a chem code narrows the item list
  // (auto-selecting when only one item matches). Blank codes show as "(no chem code)".
  var CHEM_NONE = '__NONE__'; // sentinel value for the blank-chem-code option

  function populateItemOptions(itemSelect, items) {
    itemSelect.innerHTML = '<option value="">--</option>';
    items.forEach(function (it) {
      var opt = document.createElement('option');
      opt.value = it.item;
      opt.textContent = it.item + ' (' + money(it.totalCost) + ')';
      opt.dataset.cost = it.totalCost;
      opt.dataset.chem = it.chemCode || '';
      itemSelect.appendChild(opt);
    });
  }

  function populateChemOptions(chemSelect, items) {
    if (!chemSelect) return;
    chemSelect.innerHTML = '<option value="">--</option>';
    var seen = {}, hasBlank = false;
    items.forEach(function (it) {
      var code = it.chemCode || '';
      if (!code) { hasBlank = true; return; }
      if (seen[code]) return;
      seen[code] = true;
      var opt = document.createElement('option');
      opt.value = code; opt.textContent = code;
      chemSelect.appendChild(opt);
    });
    if (hasBlank) {
      var opt = document.createElement('option');
      opt.value = CHEM_NONE; opt.textContent = '(no chem code)';
      chemSelect.appendChild(opt);
    }
  }

  // Populates both dropdowns for a group/sub and stashes the full item list for re-expansion.
  function fillItemChem(group, sub, itemSelect, chemSelect, costPreview) {
    var items = rateItems(group, sub);
    itemSelect._allItems = items;
    populateItemOptions(itemSelect, items);
    populateChemOptions(chemSelect, items);
    if (costPreview) costPreview.textContent = '';
  }

  function wireItemChem(itemSelect, chemSelect, costPreview, costMsgFn) {
    function updateCost() {
      if (!costPreview) return;
      var opt = itemSelect.options[itemSelect.selectedIndex];
      if (opt && opt.value && opt.dataset && opt.dataset.cost) {
        costPreview.textContent = costMsgFn ? costMsgFn(opt.dataset.cost) : '';
      } else {
        costPreview.textContent = '';
      }
    }
    itemSelect.onchange = function () {
      var opt = itemSelect.options[itemSelect.selectedIndex];
      if (chemSelect && opt) {
        var chem = opt.dataset ? (opt.dataset.chem || '') : '';
        chemSelect.value = opt.value ? (chem || CHEM_NONE) : '';
      }
      updateCost();
    };
    if (chemSelect) {
      chemSelect.onchange = function () {
        var all = itemSelect._allItems || [];
        var code = chemSelect.value, filtered;
        if (!code) filtered = all;
        else if (code === CHEM_NONE) filtered = all.filter(function (it) { return !(it.chemCode || ''); });
        else filtered = all.filter(function (it) { return (it.chemCode || '') === code; });
        populateItemOptions(itemSelect, filtered);
        if (filtered.length === 1) itemSelect.value = filtered[0].item;
        updateCost();
      };
    }
  }

  // ----- Can Fitting Size -> Size/Group (derived from the rate-table group names) -----
  // Group names encode diameter x heights, e.g. "603X408,409,410,700,812" (dia 603, heights
  // 408/409/410/700/812) or "401/404 X 700" (dia 401 or 404, height 700). "211 Diameter" is
  // diameter-only; "603 ENDS" / "401 & 404 ENDS" are ends.
  function parseGroupSpec(name) {
    var up = String(name).toUpperCase();
    if (up.indexOf('SPECIALTY') !== -1) return null;
    if (up.indexOf('END') !== -1) return { diameters: up.match(/\d+/g) || [], heights: [], ends: true };
    if (up.indexOf('DIAMETER') !== -1) return { diameters: up.match(/\d+/g) || [], heights: [], ends: false };
    var parts = up.split(/\s*X\s*/);
    if (parts.length >= 2) {
      return {
        diameters: parts[0].match(/\d+/g) || [],
        heights: parts.slice(1).join('X').match(/\d+/g) || [],
        ends: false
      };
    }
    return null;
  }

  function canSizeOptions() {
    var out = [];
    rateGroups().forEach(function (g) {
      var spec = parseGroupSpec(g);
      if (!spec) return;
      if (spec.ends) { out.push(spec.diameters.join('/') + ' ENDS'); return; }
      if (!spec.heights.length) { spec.diameters.forEach(function (d) { out.push(d); }); return; }
      spec.diameters.forEach(function (d) { spec.heights.forEach(function (h) { out.push(d + 'x' + h); }); });
    });
    return out;
  }

  function groupForCanSize(tag) {
    var up = String(tag).toUpperCase();
    var nums = up.match(/\d+/g) || [];
    if (!nums.length) return null;
    var isEnd = up.indexOf('END') !== -1;
    var dia = nums[0], height = nums[1];
    var groups = rateGroups();
    for (var i = 0; i < groups.length; i++) {
      var spec = parseGroupSpec(groups[i]);
      if (!spec || spec.ends !== isEnd) continue;
      if (spec.diameters.indexOf(dia) === -1) continue;
      if (spec.ends) return groups[i];
      if (!spec.heights.length) return groups[i];
      if (height && spec.heights.indexOf(height) !== -1) return groups[i];
    }
    return null;
  }

  function ticketRowHtml(t) {

    var right = t.status === 'WIP'

      '<span><b>W</b> ' + esc(t.width) + '</span>' +

  function renderAllRows(searchTerm) {
    var container = document.getElementById('allListContainer');
    if (!container) return;
    var term = (searchTerm || '').trim().toLowerCase();
    var rows = allCache.filter(function (t) {
      if (activeFilter === 'queue' && t.location !== 'queue') return false;
      if (activeFilter === 'wip' && t.location !== 'wip') return false;
      if (term && String(t.ticket).toLowerCase().indexOf(term) === -1) return false;
      return true;
    });

    if (!rows.length) {
      if (term) {
        var t = searchTerm.trim();
        container.innerHTML = '<div class="card empty">No tickets match "' + esc(searchTerm) + '".' +
          '<div style="margin-top:14px"><button class="btn" id="manualAddBtn">Start ticket "' + esc(t) + '" manually</button>' +
          '<div class="sub" style="margin-top:8px">Use this only if the ticket is on the floor but missing from Current Steel.</div></div></div>';
        var manualBtn = document.getElementById('manualAddBtn');
        manualBtn.onclick = function () {
          if (!t) return;
          manualBtn.disabled = true;
          google.script.run.withSuccessHandler(function () {
            toast('Started ticket ' + t + ' manually');
            openTicket(t);
          }).withFailureHandler(function (err) {
            toast('Error: ' + err.message);
            manualBtn.disabled = false;
          }).createManualTicket(t, '');
        };
      } else {
        container.innerHTML = '<div class="card empty">No tickets here yet.</div>';
      }
      return;
    }
    var html = '<div class="card">';
    rows.forEach(function (t) { html += ticketRowHtml(t); });
    html += '</div>';
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll('.queue-item'), function (el) {
      el.onclick = function () {
        var tk = el.getAttribute('data-ticket');
        if (el.getAttribute('data-loc') === 'wip') openWipTicket(tk); else openTicket(tk);
      };
    });

    }).withFailureHandler(function (err) {
      view.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getTicketDetail(state.ticket);
  }

  function renderDetailContent(view, detail) {
    var steel = detail.steel;
    var html = '';

    html += '<div class="card">';
    html += '<div class="ticket-id">' + esc(steel['Ticket']) + '</div>';
    html += '<div class="steel-meta">' +
      metaBox('Basis Weight', steel['BW']) + metaBox('Type', steel['TC']) +
      metaBox('Temper', steel['TM']) + metaBox('Length', steel['Length']) +
      metaBox('Width', steel['Width']) + metaBox('End Use', steel['End Use']) +
      '</div>';
    if (steel['Litho Notes']) {
      html += '<div class="sub" style="margin-bottom:12px">Litho Notes: ' + esc(steel['Litho Notes']) + '</div>';
    }

    html += '<div class="row">' +
      '<div class="stat"><div class="num">' + detail.passCount + '</div><div class="label">Passes logged</div></div>' +
      '<div class="stat"><div class="num">' + money(detail.runningTotal) + '</div><div class="label">Running litho cost</div></div>' +
      '<div class="stat"><div class="num">' + esc(detail.status) + '</div><div class="label">Status</div></div>' +
      '</div>';
    html += '</div>';

    if (detail.status === 'Not Started') {
      html += '<div class="card">' +
        operatorFieldHtml('startOperator') +
        '<button class="btn" id="startBtn">Start Job</button>' +
        '</div>';
    } else {
      html += '<div class="card">' +
        '<div class="row">' +
          selectField('groupSelect', 'Size / Group', rateGroups(), detail.suggestedGroup) +
          selectField('subSelect', 'Sub-Variant', [], null) +
          selectField('itemSelect', 'Coating Item', [], null) +
          selectField('chemSelect', 'Chem Code', [], null) +
        '</div>' +
        '<div class="row">' +
          operatorFieldHtml('passOperator') +
          '<div class="field"><label>Notes (optional)</label><input id="passNotes" placeholder="e.g. re-run, color match"></div>' +
        '</div>' +
        '<div id="itemCostPreview" class="sub" style="margin-bottom:10px"></div>' +
        '<button class="btn" id="logPassBtn">Log Pass</button>' +
        '</div>';

      html += '<div class="card">' +
        '<h3 style="margin-top:0;font-size:15px">Pass history</h3>' +
        renderHistoryTable(detail.transactions) +
        '</div>';

      var origQty = steel['QTY/LOAD'] || 0;
      var origWeight = steel['Weight'] || 0;

      html += '<div class="card">' +
        '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;margin-bottom:4px">' +
          '<input type="checkbox" id="splitToggle" style="width:18px;height:18px"> ' +
          'Only part of this pallet was used — split the remainder back to Current Steel' +
        '</label>' +
        '<div id="splitFields" style="display:none;margin-top:12px">' +
          '<div class="field"><label>Sheets run (of ' + esc(origQty) + ')</label>' +
            '<input type="number" id="sheetsUsedInput" value="' + esc(origQty) + '" min="0" max="' + esc(origQty) + '"></div>' +
          '<div class="sub" id="remainderPreview" style="margin-bottom:10px"></div>' +
        '</div>' +
        '<button class="btn success" id="completeBtn"' + (detail.passCount < 1 ? ' disabled' : '') + '>' +
        'Complete &amp; Send to WIP</button>' +
        (detail.passCount < 1 ? '<div class="sub" style="margin-top:8px">Log at least one pass first.</div>' : '') +
        '</div>';
    }

    view.innerHTML = html;
    wireDetailEvents(detail);
  }

  function metaBox(label, val) {
    return '<div><span>' + label + '</span>' + esc(val) + '</div>';
  }

  function selectField(id, label, options, preselect) {
    var html = '<div class="field"><label>' + label + '</label><select id="' + id + '"><option value="">--</option>';
    options.forEach(function (o) {
      var val = o || '(single)';
      var selected = (preselect && o === preselect) ? ' selected' : '';
      html += '<option value="' + esc(o) + '"' + selected + '>' + esc(val) + '</option>';
    });
    html += '</select></div>';
    return html;
  }

  function renderHistoryTable(rows) {
    if (!rows.length) return '<div class="sub">No passes logged yet.</div>';
    var html = '<table><thead><tr><th>#</th><th>Item</th><th>Group</th><th>Cost</th><th>Operator</th><th>Job</th><th>Running Total</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr><td>' + r.passNumber + '</td><td>' + esc(r.item) + '</td><td>' + esc(r.group) +
        (r.sub ? ' / ' + esc(r.sub) : '') + '</td><td>' + money(r.passTotal) + '</td><td>' + esc(r.operator) +
        '</td><td>' + esc(r.jobName) + '</td><td>' + money(r.runningTotal) + '</td></tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function wireDetailEvents(detail) {
    var startBtn = document.getElementById('startBtn');
    if (startBtn) {
      var startOperatorInput = document.getElementById('startOperator');
      startBtn.onclick = function () {
        var operator = startOperatorInput.value.trim();
        if (!operator) { toast('Enter an operator name'); return; }
        startBtn.disabled = true;
        google.script.run.withSuccessHandler(function () {
          toast('Job started');
          renderDetail();
        }).withFailureHandler(function (err) {
          toast('Error: ' + err.message);
          startBtn.disabled = false;
        }).startJob(state.ticket, operator);
      };
    }

    var groupSelect = document.getElementById('groupSelect');
    var subSelect = document.getElementById('subSelect');
    var itemSelect = document.getElementById('itemSelect');
    var chemSelect = document.getElementById('chemSelect');
    var costPreview = document.getElementById('itemCostPreview');

    if (itemSelect) wireItemChem(itemSelect, chemSelect, costPreview, function (c) {
      return 'This pass will add ' + money(c) + ' to the running total.';
    });

    if (groupSelect) {
      groupSelect.onchange = function () { refreshSubOptions(); };
      if (groupSelect.value) refreshSubOptions();
    }
    if (subSelect) subSelect.onchange = function () {
      fillItemChem(groupSelect.value, subSelect.value, itemSelect, chemSelect, costPreview);
    };

    function refreshSubOptions() {
      var group = groupSelect.value;
      subSelect.innerHTML = '<option value="">--</option>';
      if (itemSelect) itemSelect.innerHTML = '<option value="">--</option>';
      if (chemSelect) chemSelect.innerHTML = '<option value="">--</option>';
      costPreview.textContent = '';
      if (!group) return;
      var subs = rateSubs(group);
      subs.forEach(function (s) {
        var opt = document.createElement('option');
        opt.value = s || '';
        opt.textContent = s || '(single)';
        subSelect.appendChild(opt);
      });
      if (subs.length === 1) { subSelect.value = subs[0] || ''; fillItemChem(group, subSelect.value, itemSelect, chemSelect, costPreview); }
    }

    var passOperatorInput = document.getElementById('passOperator');
    var logPassBtn = document.getElementById('logPassBtn');
    if (logPassBtn) {
      logPassBtn.onclick = function () {
        var group = groupSelect.value, sub = subSelect.value, item = itemSelect.value;
        var operator = passOperatorInput.value.trim();
        var notes = document.getElementById('passNotes').value;
        if (!group || !item) { toast('Pick a group and coating item first'); return; }
        if (!operator) { toast('Enter an operator name'); return; }
        logPassBtn.disabled = true;
        google.script.run.withSuccessHandler(function () {
          toast('Pass logged');
          renderDetail();
        }).withFailureHandler(function (err) {
          toast('Error: ' + err.message);
          logPassBtn.disabled = false;
        }).logPass(state.ticket, group, sub, item, operator, notes);
      };
    }

    var splitToggle = document.getElementById('splitToggle');
    var splitFields = document.getElementById('splitFields');
    var sheetsUsedInput = document.getElementById('sheetsUsedInput');
    var remainderPreview = document.getElementById('remainderPreview');
    var origQtyForSplit = Number(detail.steel['QTY/LOAD']) || 0;
    var origWeightForSplit = Number(detail.steel['Weight']) || 0;
    var weightPerSheetForSplit = origQtyForSplit > 0 ? (origWeightForSplit / origQtyForSplit) : 0;

    if (splitToggle) {
      splitToggle.onchange = function () {
        splitFields.style.display = splitToggle.checked ? 'block' : 'none';
        updateRemainderPreview();
      };
    }
    if (sheetsUsedInput) sheetsUsedInput.oninput = updateRemainderPreview;

    function updateRemainderPreview() {
      if (!remainderPreview) return;
      var usedSheets = Number(sheetsUsedInput.value) || 0;
      var usedWeight = Math.round(usedSheets * weightPerSheetForSplit * 100) / 100;
      var remSheets = origQtyForSplit - usedSheets;
      var remWeight = Math.round((origWeightForSplit - usedWeight) * 100) / 100;
      if (remSheets > 0) {
        remainderPreview.textContent = 'Sent to WIP: ' + usedSheets + ' sheets (~' + usedWeight + ' lbs, estimated). ' +
          'Remainder returns to Current Steel as a new ticket: ' + remSheets + ' sheets (~' + remWeight + ' lbs, estimated).';
      } else {
        remainderPreview.textContent = 'No remainder — this will behave like a normal full completion.';
      }
    }
    updateRemainderPreview();

    var completeBtn = document.getElementById('completeBtn');
    if (completeBtn) {
      completeBtn.onclick = function () {
        var isSplit = splitToggle && splitToggle.checked;
        var sheetsUsed;
        if (isSplit) sheetsUsed = sheetsUsedInput.value;
        var confirmMsg = isSplit
          ? 'Send the used portion to WIP and return the remainder to Current Steel?'
          : 'Send this ticket to WIP? This closes out the litho job.';
        if (!confirm(confirmMsg)) return;
        completeBtn.disabled = true;
        google.script.run.withSuccessHandler(function (result) {
          var msg = 'Sent to WIP at ' + money(result.finalLithoCost);
          if (result.remainderTicket) msg += ' — remainder returned as ' + result.remainderTicket;
          toast(msg);
          document.getElementById('backBtn').click();
        }).withFailureHandler(function (err) {
          toast('Error: ' + err.message);
          completeBtn.disabled = false;
        }).completeJob(state.ticket, sheetsUsed);
      };
    }
  }

  // ---------------- Create Job (one ticket at a time) ----------------
  var currentJob = null; // { jobName, group, sub, item, operator, notes }
  var jobAddedTickets = []; // running list of what's been added so far, for display
  var jobPickedTicket = null; // ticket currently staged for "sheets run" entry

  function openCreateJob() {
    currentJob = null;
    jobAddedTickets = [];
    jobPickedTicket = null;
    state.view = 'createJob';
    enterDetailView();
    renderCreateJobSetup();

  // Step 1: describe the job (what's being done) before adding any tickets.
  function renderCreateJobSetup() {
    var view = document.getElementById('view');
    var html = '';

    html += '<div class="card">' +
      '<h3 style="margin-top:0">New Job</h3>' +
      '<div class="sub" style="margin-bottom:12px">Describe what\'s being done. Once set, you\'ll add tickets to it one at a time.</div>' +
      '<div class="field"><label>Job description</label><input id="jobName" placeholder="e.g. White coat run, 7/1 morning"></div>' +
      '<div class="field"><label>Can Fitting Size (sets the Size / Group)</label>' +
        '<select id="jobCanSize"><option value="">-- pick a can size --</option></select></div>' +
      '<div class="row">' +
        '<div class="field" id="jobGroupWrap"></div>' +
        '<div class="field" id="jobSubWrap"></div>' +
        '<div class="field" id="jobItemWrap"></div>' +
        '<div class="field" id="jobChemWrap"></div>' +
      '</div>' +
      '<div class="row">' +
        operatorFieldHtml('jobOperator') +
        '<div class="field"><label>Notes (optional)</label><input id="jobNotes" placeholder="e.g. re-run, color match"></div>' +
      '</div>' +
      '<div class="sub" id="jobCostPreview" style="margin-bottom:10px"></div>' +
      '<button class="btn" id="startJobSetupBtn">Start Adding Tickets</button>' +
      '</div>';

    view.innerHTML = html;

    document.getElementById('jobGroupWrap').innerHTML = '<label>Size / Group</label><select id="jobGroupSelect"><option value="">--</option></select>';
    document.getElementById('jobSubWrap').innerHTML = '<label>Sub-Variant</label><select id="jobSubSelect"><option value="">--</option></select>';
    document.getElementById('jobItemWrap').innerHTML = '<label>Coating Item</label><select id="jobItemSelect"><option value="">--</option></select>';
    document.getElementById('jobChemWrap').innerHTML = '<label>Chem Code</label><select id="jobChemSelect"><option value="">--</option></select>';

    var canSizeInput = document.getElementById('jobCanSize');
    var groupSelect = document.getElementById('jobGroupSelect');
    var subSelect = document.getElementById('jobSubSelect');
    var itemSelect = document.getElementById('jobItemSelect');
    var chemSelect = document.getElementById('jobChemSelect');
    var costPreview = document.getElementById('jobCostPreview');

    wireItemChem(itemSelect, chemSelect, costPreview, function (c) {
      return 'This pass adds ' + money(c) + ' per ticket added to this job.';
    });

    ensureRateData(function () {
      rateGroups().forEach(function (g) {
        var opt = document.createElement('option');
        opt.value = g; opt.textContent = g;
        groupSelect.appendChild(opt);
      });
      canSizeOptions().forEach(function (cs) {
        var opt = document.createElement('option');
        opt.value = cs; opt.textContent = cs;
        canSizeInput.appendChild(opt);
      });
    });

    // Picking a can size (e.g. 603x700) decides the Size/Group and drives the cascade.
    canSizeInput.onchange = function () {
      var g = groupForCanSize(canSizeInput.value);
      if (g && g !== groupSelect.value) { groupSelect.value = g; groupSelect.onchange(); }
    };

    groupSelect.onchange = function () {
      var group = groupSelect.value;
      subSelect.innerHTML = '<option value="">--</option>';
      itemSelect.innerHTML = '<option value="">--</option>';
      chemSelect.innerHTML = '<option value="">--</option>';
      costPreview.textContent = '';

      var subs = rateSubs(group);
      subs.forEach(function (s) {
        var opt = document.createElement('option');
        opt.value = s || ''; opt.textContent = s || '(single)';
        subSelect.appendChild(opt);
      });
      if (subs.length === 1) { subSelect.value = subs[0] || ''; subSelect.onchange(); }
    };

    subSelect.onchange = function () {
      fillItemChem(groupSelect.value, subSelect.value, itemSelect, chemSelect, costPreview);

    document.getElementById('startJobSetupBtn').onclick = function () {
      var jobName = document.getElementById('jobName').value.trim();

      var notes = document.getElementById('jobNotes').value;

      if (!group || !item) { toast('Pick a size/group and coating item'); return; }

      currentJob = { jobName: jobName, group: group, sub: sub, item: item, operator: operator, notes: notes };
      renderCreateJobAddTickets();
    };

  // Step 2: add tickets to the job one at a time, entering sheets run for each.
  function renderCreateJobAddTickets() {
    var view = document.getElementById('view');
    var html = '';

    html += '<div class="card">' +
      '<div class="sub">Job: <strong>' + esc(currentJob.jobName || '(untitled)') + '</strong> &middot; ' +
      esc(currentJob.group) + (currentJob.sub ? ' / ' + esc(currentJob.sub) : '') + ' &middot; ' + esc(currentJob.item) + '</div>' +
      '</div>';

    html += '<div class="card" id="jobPickedTicketCard" style="display:none"></div>';

    html += '<div class="card">' +
      '<h3 style="margin-top:0;font-size:15px">Find a ticket</h3>' +
      searchBarHtml('jobTicketSearch') +
      '<div id="jobQueuePicker" style="margin-top:10px"></div>' +
      '</div>';

    html += '<div class="card">' +
      '<h4 style="margin-bottom:6px;font-size:13px;color:var(--muted)">Tickets added to this job so far (<span id="jobAddedCount">0</span>)</h4>' +
      '<div id="jobAddedList" class="sub">None yet.</div>' +
      '</div>';

    html += '<div class="card">' +
      '<button class="btn success" id="sendJobWipBtn" style="width:100%;margin-bottom:10px">Send all added tickets to WIP</button>' +
      '<button class="btn secondary" id="finishJobBtn" style="width:100%">Done — leave in progress (add more coats later)</button>' +
      '<div class="sub" style="margin-top:8px">Send to WIP closes out the litho job. Leave in progress if these tickets still need more passes.</div>' +
      '</div>';

    view.innerHTML = html;

    var jobTicketSearch = document.getElementById('jobTicketSearch');
    jobTicketSearch.oninput = function () { renderJobQueuePicker(jobTicketSearch.value); };
    if (!queueCache.length) {
      google.script.run.withSuccessHandler(function (queue) {
        queueCache = queue;
        renderJobQueuePicker('');
      }).getQueue();
    } else {
      renderJobQueuePicker('');
    }

    renderJobAddedList();

    document.getElementById('finishJobBtn').onclick = function () {
      document.getElementById('backBtn').click();
    };

    document.getElementById('sendJobWipBtn').onclick = function () {
      var tickets = jobAddedTickets.map(function (r) { return r.ticket; });
      if (!tickets.length) { toast('Add at least one ticket first'); return; }
      if (!confirm('Send ' + tickets.length + ' ticket(s) to WIP? This closes out their litho jobs.')) return;
      var btn = document.getElementById('sendJobWipBtn');
      btn.disabled = true; btn.textContent = 'Sending&hellip;';
      google.script.run.withSuccessHandler(function (res) {
        var ok = (res || []).filter(function (r) { return r.ok; }).length;
        var failed = (res || []).filter(function (r) { return !r.ok; });
        var msg = ok + ' ticket(s) sent to WIP';
        if (failed.length) msg += ' — ' + failed.length + ' failed (' + failed.map(function (f) { return f.ticket; }).join(', ') + ')';
        toast(msg);
        document.getElementById('backBtn').click();
      }).withFailureHandler(function (err) {
        toast('Error: ' + err.message);
        btn.disabled = false; btn.textContent = 'Send all added tickets to WIP';
      }).completeJobs(tickets);
    };
  }

  function renderJobQueuePicker(searchTerm) {
    var container = document.getElementById('jobQueuePicker');
    if (!container) return;
    var term = (searchTerm || '').trim().toLowerCase();
    var rows = term ? queueCache.filter(function (q) { return String(q.ticket).toLowerCase().indexOf(term) !== -1; }) : queueCache.slice(0, 15);

    if (!rows.length) { container.innerHTML = '<div class="sub">No matches.</div>'; return; }
    var html = '';
    rows.forEach(function (q) {
      html += '<div class="queue-item" data-ticket="' + esc(q.ticket) + '" style="padding:6px 0">' +
        '<div style="min-width:0"><span class="ticket-id" style="font-size:14px">' + esc(q.ticket) + '</span> ' +
        '<span class="sub">' + esc(q.endUse) + ' &middot; ' + esc(q.qty || 0) + ' sheets</span>' +
        '<div class="specs"><span><b>BW</b> ' + esc(q.bw) + '</span><span><b>Type</b> ' + esc(q.type) +
        '</span><span><b>Temper</b> ' + esc(q.temper) + '</span></div></div>' +
        '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-pick="' + esc(q.ticket) + '">Select</button>' +
      '</div>';
    });
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll('[data-pick]'), function (btn) {
      btn.onclick = function () {
        var t = btn.getAttribute('data-pick');
        var entry = queueCache.filter(function (q) { return q.ticket === t; })[0];
        renderPickedTicketCard(t, entry);
      };
    });
  }

  function renderPickedTicketCard(ticket, entry) {
    var card = document.getElementById('jobPickedTicketCard');
    var origQty = entry ? Number(entry.qty) || 0 : 0;
    var origWeight = entry ? Number(entry.weight) || 0 : 0;
    var weightPerSheet = origQty > 0 ? (origWeight / origQty) : 0;

    card.style.display = 'block';
    var specsHtml = entry ? ('<div class="specs" style="margin-bottom:10px">' +
      '<span><b>BW</b> ' + esc(entry.bw) + '</span><span><b>Type</b> ' + esc(entry.type) + '</span>' +
      '<span><b>Temper</b> ' + esc(entry.temper) + '</span><span><b>L</b> ' + esc(entry.length) + '</span>' +
      '<span><b>W</b> ' + esc(entry.width) + '</span><span><b>End Use</b> ' + esc(entry.endUse) + '</span></div>') : '';
    card.innerHTML =
      '<div class="ticket-id">' + esc(ticket) + '</div>' +
      '<div class="sub" style="margin-bottom:6px">' + esc(origQty) + ' sheets on hand &middot; ~' + esc(origWeight) + ' lbs</div>' +
      specsHtml +
      '<div class="field"><label>Sheets run</label>' +
        '<input type="number" id="sheetsRunInput" value="' + esc(origQty) + '" min="1" max="' + esc(origQty || '') + '"></div>' +
      '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;margin-bottom:6px">' +
        '<input type="checkbox" id="partialSkidToggle" style="width:18px;height:18px"> ' +
        'This is a partial skid — return leftovers to Current Steel' +
      '</label>' +
      '<div class="sub" id="sheetsRunPreview" style="margin-bottom:10px"></div>' +
      '<div class="field"><label>Litho Notes (optional)</label>' +
        '<input id="lithoNoteInput" placeholder="Note kept with this ticket"></div>' +
      '<button class="btn" id="addTicketToJobBtn">Add to Job</button>';

    if (card.scrollIntoView) card.scrollIntoView({ block: 'start' });

    var sheetsRunInput = document.getElementById('sheetsRunInput');
    var preview = document.getElementById('sheetsRunPreview');
    var partialToggle = document.getElementById('partialSkidToggle');

    function updatePreview() {
      var sheets = Number(sheetsRunInput.value) || 0;
      var estWeight = Math.round(sheets * weightPerSheet * 100) / 100;
      var remSheets = origQty - sheets;
      if (remSheets <= 0) {
        preview.textContent = 'Full skid: ' + sheets + ' sheets (~' + estWeight + ' lbs, estimated).';
      } else if (partialToggle.checked) {
        var remWeight = Math.round((origWeight - estWeight) * 100) / 100;
        preview.textContent = 'Partial skid: ' + sheets + ' sheets run (~' + estWeight + ' lbs, estimated). ' +
          remSheets + ' sheets (~' + remWeight + ' lbs) returned to Current Steel as a new ticket.';
      } else {
        preview.textContent = sheets + ' sheets run. ' + remSheets +
          ' leftover sheets will be scrapped (not returned to Current Steel).';
      }
    }
    sheetsRunInput.oninput = updatePreview;
    partialToggle.onchange = updatePreview;
    updatePreview();

    document.getElementById('addTicketToJobBtn').onclick = function () {
      var sheetsRun = sheetsRunInput.value;
      var lithoNote = document.getElementById('lithoNoteInput').value;
      var isPartialSkid = partialToggle.checked;
      var btn = document.getElementById('addTicketToJobBtn');
      btn.disabled = true; btn.textContent = 'Adding&hellip;';
      google.script.run.withSuccessHandler(function (result) {
        jobAddedTickets.push(result);
        var msg = 'Added ' + result.ticket;
        if (result.isPartial && result.remainderTicket) msg += ' — remainder returned as ' + result.remainderTicket;
        else if (result.scrapSheets) msg += ' — ' + result.scrapSheets + ' sheets scrapped';
        else msg += ' to job';
        toast(msg);
        card.style.display = 'none';
        document.getElementById('jobTicketSearch').value = '';
        renderJobQueuePicker('');
        renderJobAddedList();
        // Refresh queue cache in the background so qty/status reflect the change next pick
        google.script.run.withSuccessHandler(function (queue) { queueCache = queue; }).getQueue();
      }).withFailureHandler(function (err) {
        toast('Error: ' + err.message);
        btn.disabled = false; btn.textContent = 'Add to Job';
      }).addTicketToJob(currentJob.jobName, currentJob.group, currentJob.sub, currentJob.item,
        currentJob.operator, currentJob.notes, ticket, sheetsRun, lithoNote, isPartialSkid);
    };
  }

  function renderJobAddedList() {
    var container = document.getElementById('jobAddedList');
    var countEl = document.getElementById('jobAddedCount');
    if (countEl) countEl.textContent = jobAddedTickets.length;
    if (!container) return;
    if (!jobAddedTickets.length) { container.innerHTML = 'None yet.'; return; }
    var html = '<table><thead><tr><th>Ticket</th><th>Sheets Run</th><th>Est. Weight</th><th>Remainder / Scrap</th></tr></thead><tbody>';
    jobAddedTickets.forEach(function (r) {
      var last = r.remainderTicket
        ? esc(r.remainderTicket) + ' (' + esc(r.remainderSheets) + ' sheets)'
        : (r.scrapSheets ? esc(r.scrapSheets) + ' scrapped' : '&mdash;');
      html += '<tr><td>' + esc(r.ticket) + '</td><td>' + esc(r.sheetsRun) + '</td><td>' + esc(r.estimatedWeightUsed) + ' lbs</td>' +
        '<td>' + last + '</td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  // ---------------- WIP ticket (opened from the combined list) ----------------
  function openWipTicket(ticket) {
    state.view = 'wipDetail'; state.ticket = ticket; state.listView = 'all';
    enterDetailView();
    renderWipDetail();
  }

  // ---------------- WIP detail view ----------------
  function renderWipDetail() {
    var view = document.getElementById('view');
    view.innerHTML = '<div class="loading">Loading ticket&hellip;</div>';
    google.script.run.withSuccessHandler(function (detail) {
      renderWipDetailContent(view, detail);
    }).withFailureHandler(function (err) {
      view.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getWipDetail(state.ticket);
  }

  function renderWipDetailContent(view, detail) {
    var steel = detail.steel;
    var html = '';

    html += '<div class="card">';
    html += '<div class="ticket-id">' + esc(steel['Ticket']) + ' <span class="badge wip">WIP</span></div>';
    html += '<div class="steel-meta">' +
      metaBox('Basis Weight', steel['BW']) + metaBox('Type', steel['TC']) +
      metaBox('Temper', steel['TM']) + metaBox('Length', steel['Length']) +
      metaBox('Width', steel['Width']) + metaBox('End Use', steel['End Use']) +
      '</div>';
    if (steel['Litho Notes']) {
      html += '<div class="sub">Litho Notes: ' + esc(steel['Litho Notes']) + '</div>';
    }
    html += '</div>';

    html += '<div class="card">' +
      '<h3 style="margin-top:0;font-size:15px">Litho cost</h3>' +
      '<div class="row">' +
        '<div class="field"><label>Current litho cost</label><input type="number" id="wipCostInput" value="' + esc(detail.litho) + '"></div>' +
        operatorFieldHtml('wipCostOperator') +
      '</div>' +
      '<div class="field"><label>Reason for change (optional)</label><input id="wipCostNotes" placeholder="e.g. correcting a typo"></div>' +
      '<button class="btn secondary" id="saveWipCostBtn">Save Litho Cost</button>' +
      '</div>';

    html += '<div class="card">' +
      '<h3 style="margin-top:0;font-size:15px">Pass history</h3>' +
      renderHistoryTable(detail.transactions) +
      '</div>';

    html += '<div class="card">' +
      '<h3 style="margin-top:0;font-size:15px">Add more coating</h3>' +
      '<div class="sub" style="margin-bottom:10px">Pulls this ticket back out of WIP into the Litho Queue so you can log another pass. Its current litho cost carries over as the starting point.</div>' +
      operatorFieldHtml('reopenOperator') +
      '<button class="btn" id="reopenBtn">Reopen to Add Coating</button>' +
      '</div>';

    view.innerHTML = html;
    wireWipDetailEvents(detail);
  }

  function wireWipDetailEvents(detail) {
    var saveWipCostBtn = document.getElementById('saveWipCostBtn');
    if (saveWipCostBtn) {
      saveWipCostBtn.onclick = function () {
        var newCost = document.getElementById('wipCostInput').value;
        var operator = document.getElementById('wipCostOperator').value.trim();
        var notes = document.getElementById('wipCostNotes').value;
        if (!operator) { toast('Enter an operator name'); return; }
        saveWipCostBtn.disabled = true;
        google.script.run.withSuccessHandler(function () {
          toast('Litho cost updated');
          renderWipDetail();
        }).withFailureHandler(function (err) {
          toast('Error: ' + err.message);
          saveWipCostBtn.disabled = false;
        }).updateWipLithoCost(state.ticket, newCost, operator, notes);
      };
    }

    var reopenBtn = document.getElementById('reopenBtn');
    if (reopenBtn) {
      reopenBtn.onclick = function () {
        var operator = document.getElementById('reopenOperator').value.trim();
        if (!operator) { toast('Enter an operator name'); return; }
        if (!confirm('Pull this ticket back into the Litho Queue to add another pass?')) return;
        reopenBtn.disabled = true;
        google.script.run.withSuccessHandler(function () {
          toast('Ticket reopened');
          state.view = 'detail'; state.listView = 'queue';
          renderDetail();
        }).withFailureHandler(function (err) {
          toast('Error: ' + err.message);
          reopenBtn.disabled = false;
        }).reopenFromWip(state.ticket, operator);
      };
    }
  }

  // boot
  boot();
</script>
