  // Enter a chosen department full-screen. Back from a section home returns to the chooser.
  function openMetalsSection(tab) {
    metalsTab = tab;
    showTabbar(false); showBack(true); setDept('Metals');
    if (tab === 'slitter') { state.view = 'slitterHome'; renderSlitterHome(); }
    else if (tab === 'used') { state.view = 'usedHome'; renderUsedHome(); }
    else { state.view = 'prodHome'; renderProductionHome(tab === 'press' ? 'Press' : 'Line'); }
  }

  // ----- Used in Production (quick direct mark) -----
  // A shortcut for marking skids Used without a run or slitter session. The operator builds a batch
  // list (scan/type a ticket or skid to add), then hits one button to mark them all Used. Only the
  // date is recorded — no operator, no machine — per the floor's request. Each marked skid gets a
  // 'USED IN PRODUCTION (DIRECT)' audit entry and shows up in the Reports "Used in Production
  // (direct)" section.
  var usedBatch = [];   // [{ skidId, ticket, mill }] pending this session
  var usedTab = 'skids'; // Used-in-Production sub-tab: 'skids' (quick mark) | 'coil' (Coil Line)

  // Used in Production is two sub-tabs: the quick skid mark, and Coil Line (cut a coil into skids).
  function renderUsedHome() {
    state.view = 'usedHome';
    var view = document.getElementById('view');
    if (!view) return;
    nextViewToken();
    var chips = [['skids', '✅ Mark Skids Used'], ['coil', '🧵 Coil Line']].map(function (c) {
      return '<button data-usedtab="' + c[0] + '"' + (usedTab === c[0] ? ' class="active"' : '') + '>' + esc(c[1]) + '</button>';
    }).join('');
    view.innerHTML = '<div class="tabbar">' + chips + '</div><div id="usedBody"></div>';
    Array.prototype.forEach.call(view.querySelectorAll('[data-usedtab]'), function (b) {
      b.onclick = function () { usedTab = b.getAttribute('data-usedtab'); renderUsedHome(); };
    });
    if (usedTab === 'coil') renderCoilLine(); else renderUsedSkids();
  }

  function renderUsedSkids() {
    var body = document.getElementById('usedBody');
    if (!body) return;
    body.innerHTML =
      '<div class="card">' +
        '<h3 style="margin-top:0">Used in Production</h3>' +
        '<div class="sub" style="margin-bottom:12px">Scan or type a ticket / skid number to add it to the list, then mark them all Used. Pick the date the steel was used — it defaults to the previous work day. A skid that&rsquo;s already Used can be added again for another occasion — it&rsquo;s flagged &ldquo;re-use&rdquo; and the extra use is recorded in its Comments.</div>' +
        '<div class="field"><label>Date used</label><input type="date" id="usedDate" value="' + esc(prevWorkdayStr()) + '" max="' + esc(todayStr()) + '"></div>' +
        '<div class="row" style="align-items:flex-end">' +
          '<div class="field" style="flex:1;margin:0"><label>Ticket / Skid #</label><input id="usedAddInput" placeholder="scan or type…" autocomplete="off"></div>' +
          '<button class="btn" id="usedAddBtn" style="margin-left:8px">+ Add</button>' +
        '</div>' +
        '<div id="usedPicker" style="margin-top:8px"></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3 style="margin-top:0;font-size:15px">On the list <span class="sub" id="usedCount"></span></h3>' +
        '<div id="usedListBox"></div>' +
        '<button class="btn success" id="usedMarkBtn" style="width:100%;margin-top:12px">Mark all Used</button>' +
      '</div>';

    var input = document.getElementById('usedAddInput');
    input.oninput = function () { renderUsedPicker(input.value); };
    input.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); usedQuickAdd(input.value); } };
    document.getElementById('usedAddBtn').onclick = function () { usedQuickAdd(input.value); };
    document.getElementById('usedMarkBtn').onclick = usedMarkAll;
    ensureAllCache(function () { renderUsedList(); renderUsedPicker(input.value); });
    renderUsedList();
  }

  // Add the single skid that exactly matches a typed ticket/skid (used by Enter / the +Add button).
  // If it's ambiguous or not an exact match, leave it to the picker list below.
  function usedQuickAdd(term) {
    term = (term || '').trim();
    if (!term) return;
    var lc = term.toLowerCase();
    var matches = usedEligible().filter(function (t) {
      return String(t.ticket).toLowerCase() === lc || String(t.skidId).toLowerCase() === lc;
    });
    if (matches.length === 1) { usedAdd(matches[0].skidId); return; }
    if (!matches.length) { toast('No available skid matches "' + term + '"'); return; }
    renderUsedPicker(term); // multiple — let them pick from the list
  }

  // Skids that can be marked Used here: real source skids that aren't cut pallets (those are output,
  // not consumed here) and aren't already on the batch list. Already-Used skids ARE allowed — some
  // skids get used on more than one occasion, so re-marking a Used skid logs another use (see the
  // "re-use" flag in the picker). Missing skids stay excluded.
  function usedEligible() {
    var onList = {};
    usedBatch.forEach(function (b) { onList[b.skidId] = true; });
    return allCache.filter(function (t) {
      if (t.cutType) return false;
      if (t.status === 'Missing') return false;
      if (onList[t.skidId]) return false;
      return true;
    });
  }

  function renderUsedPicker(term) {
    var c = document.getElementById('usedPicker');
    if (!c) return;
    term = (term || '').trim().toLowerCase();
    if (!term) { c.innerHTML = ''; return; }
    var rows = usedEligible().filter(function (t) {
      return String(t.ticket).toLowerCase().indexOf(term) !== -1 || String(t.skidId).toLowerCase().indexOf(term) !== -1;
    }).slice(0, 10);
    if (!rows.length) { c.innerHTML = '<div class="sub">No available skids match.</div>'; return; }
    var html = '';
    rows.forEach(function (t) {
      var reuse = t.status === 'Used';
      var meta = t.mill ? ' &middot; Mill ' + esc(t.mill) : '';
      meta += reuse
        ? ' &middot; <span style="color:#b26a00;font-weight:600">already Used → re-use</span>'
        : (t.status && t.status !== 'Current' ? ' &middot; ' + esc(t.status) : '');
      html += '<div class="queue-item" style="padding:6px 0"><div style="min-width:0">' +
        '<span class="ticket-id" style="font-size:15px">' + esc(t.ticket || '(no ticket)') + '</span> ' +
        '<span class="sub">' + esc(t.skidId) + meta + '</span></div>' +
        '<button class="btn ' + (reuse ? 'warn' : 'success') + '" style="padding:8px 14px" data-uadd="' + esc(t.skidId) + '">' + (reuse ? 'Re-use' : '+ Add') + '</button></div>';
    });
    c.innerHTML = html;
    Array.prototype.forEach.call(c.querySelectorAll('[data-uadd]'), function (b) {
      b.onclick = function () { usedAdd(b.getAttribute('data-uadd')); };
    });
  }

  function usedAdd(skidId) {
    var t = allCache.filter(function (x) { return x.skidId === skidId; })[0];
    if (!t) { toast('Skid not found'); return; }
    if (usedBatch.some(function (b) { return b.skidId === skidId; })) return;
    usedBatch.push({ skidId: t.skidId, ticket: t.ticket, mill: t.mill, status: t.status });
    var input = document.getElementById('usedAddInput');
    if (input) { input.value = ''; input.focus(); }
    renderUsedPicker('');
    renderUsedList();
  }

  function usedRemove(skidId) {
    usedBatch = usedBatch.filter(function (b) { return b.skidId !== skidId; });
    renderUsedList();
    var input = document.getElementById('usedAddInput');
    if (input) renderUsedPicker(input.value);
  }

  function renderUsedList() {
    var box = document.getElementById('usedListBox');
    var cnt = document.getElementById('usedCount');
    var btn = document.getElementById('usedMarkBtn');
    if (!box) return;
    if (cnt) cnt.textContent = usedBatch.length ? '(' + usedBatch.length + ')' : '';
    if (btn) { btn.disabled = !usedBatch.length; btn.textContent = usedBatch.length ? ('Mark ' + usedBatch.length + ' Used') : 'Mark all Used'; }
    if (!usedBatch.length) { box.innerHTML = '<div class="sub">Nothing added yet.</div>'; return; }
    var html = '';
    usedBatch.forEach(function (b) {
      var reuse = b.status === 'Used';
      html += '<div class="queue-item" style="padding:8px 0"><div style="min-width:0">' +
        '<span class="ticket-id" style="font-size:15px">' + esc(b.ticket || '(no ticket)') + '</span> ' +
        '<span class="sub">' + esc(b.skidId) + (b.mill ? ' &middot; Mill ' + esc(b.mill) : '') +
        (reuse ? ' &middot; <span style="color:#b26a00;font-weight:600">re-use</span>' : '') + '</span></div>' +
        '<button class="btn danger" style="padding:8px 12px" data-urem="' + esc(b.skidId) + '">Remove</button></div>';
    });
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('[data-urem]'), function (b) {
      b.onclick = function () { usedRemove(b.getAttribute('data-urem')); };
    });
  }

  function usedMarkAll() {
    if (!usedBatch.length) return;
    var ids = usedBatch.map(function (b) { return b.skidId; });
    var dateEl = document.getElementById('usedDate');
    var date = (dateEl && dateEl.value) ? dateEl.value : todayStr();
    var n = ids.length;
    var reuseN = usedBatch.filter(function (b) { return b.status === 'Used'; }).length;
    showConfirm('Mark ' + n + ' skid' + (n === 1 ? '' : 's') + ' Used in Production?',
      'This records them as Used on ' + date + '. It does not go through a line, press, or slitter.' +
        (reuseN ? ' ' + reuseN + ' ' + (reuseN === 1 ? 'is' : 'are') + ' already Used and will be recorded as a re-use (noted in Comments).' : ''),
      function () {
        var btn = document.getElementById('usedMarkBtn');
        if (btn) { btn.disabled = true; btn.textContent = 'Marking…'; }
        runMutation('markUsedDirect', [ids, date, newOpId()],
          function (res) {
            ids.forEach(function (id) { markCacheStatus(id, 'Used'); });
            usedBatch = [];
            var marked = (res && res.marked != null) ? res.marked : n;
            var reused = (res && res.reused) ? res.reused : 0;
            var skipped = (res && res.skipped) ? res.skipped : 0;
            showInfo('Marked Used',
              (marked ? marked + ' skid' + (marked === 1 ? '' : 's') + ' marked Used in Production.' : '') +
              (reused ? (marked ? ' ' : '') + reused + ' skid' + (reused === 1 ? '' : 's') + ' re-used (recorded in Comments).' : '') +
              (skipped ? ' ' + skipped + ' skipped (not found).' : '') || 'Nothing to mark.',
              function () { renderUsedHome(); });
          },
          function (err) {
            toast('Error: ' + err.message);
            var b2 = document.getElementById('usedMarkBtn');
            if (b2) { b2.disabled = false; renderUsedList(); }
          });
      });
  }

  // ----- Coil Line: cut a received coil (C/S = 'C') into child skids -----
  // Pick a coil, enter the weight + quantity of each skid it was cut into, and cut it. The coil is
  // marked Used; each new skid keeps the coil's Mill + specs (Mill is the link back to the coil) and
  // gets a ticket = the cut date + a running per-day sequence. Only ticket, weight and quantity change.
  var coilSel = null;                        // selected coil: { skidId, ticket, mill, weight, qty }
  var coilRows = [{ weight: '', qty: '' }];  // the cut skids being entered
  var coilLineNo = 1;                        // which coil line (1 or 2) — first digit of the ticket suffix

  // Preview the ticket shape for a cut date + coil line, e.g. 2026-08-01 / line 1 -> "080126-1XX".
  function fmtTicketPreview(ymd, line) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || '');
    if (!m) return '(date)-' + line + 'XX';
    return m[2] + m[3] + m[1].slice(2) + '-' + line + 'XX';
  }

  // Coils that can be cut: C/S = 'C', still active, not already a cut-child (Split Of) or a cut pallet.
  function coilEligible() {
    return allCache.filter(function (t) {
      if (String(t.cs || '').toUpperCase() !== 'C') return false;
      if (t.splitOf) return false;
      if (t.cutType) return false;
      if (['Used', 'Missing'].indexOf(t.status) !== -1) return false;
      return true;
    });
  }

  function renderCoilLine() {
    var body = document.getElementById('usedBody');
    if (!body) return;
    if (!coilSel) {
      body.innerHTML =
        '<div class="card">' +
          '<h3 style="margin-top:0">Coil Line</h3>' +
          '<div class="sub" style="margin-bottom:12px">Pick a coil to cut into skids. Each new skid keeps the coil’s Mill and specs — only the ticket (the cut date), weight and quantity change. The coil is marked Used.</div>' +
          '<div class="field"><label>Find a coil (ticket / skid / mill)</label><input id="coilSearch" placeholder="type to search…" autocomplete="off"></div>' +
          '<div id="coilPicker"></div>' +
        '</div>';
      var s = document.getElementById('coilSearch');
      s.oninput = function () { renderCoilPicker(s.value); };
      ensureAllCache(function () { renderCoilPicker(s.value); });
      renderCoilPicker('');
      return;
    }
    var c = coilSel;
    body.innerHTML =
      '<div class="card">' +
        '<h3 style="margin-top:0">Coil Line</h3>' +
        '<div class="queue-item" style="padding:6px 0"><div style="min-width:0">' +
          '<span class="ticket-id">' + esc(c.ticket || '(no ticket)') + '</span> ' +
          '<span class="sub">' + esc(c.skidId) + (c.mill ? ' &middot; Mill ' + esc(c.mill) : '') +
          (c.weight ? ' &middot; wt ' + esc(c.weight) : '') + (c.qty ? ' &middot; qty ' + esc(c.qty) : '') + '</span></div>' +
          '<button class="btn secondary" id="coilChangeBtn" style="padding:8px 14px">Change</button></div>' +
        '<div class="row">' +
          '<div class="field" style="flex:1;margin:10px 8px 0 0"><label>Date cut</label><input type="date" id="coilDate" value="' + esc(todayStr()) + '" max="' + esc(todayStr()) + '"></div>' +
          '<div class="field" style="flex:1;margin:10px 0 0"><label>Coil line</label><select id="coilLineNo">' +
            '<option value="1"' + (coilLineNo === 2 ? '' : ' selected') + '>Coil Line 1</option>' +
            '<option value="2"' + (coilLineNo === 2 ? ' selected' : '') + '>Coil Line 2</option>' +
          '</select></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h3 style="margin-top:0;font-size:15px">Cut skids — weight &amp; quantity of each</h3>' +
        '<div class="sub" style="margin-bottom:8px">Each row becomes a new skid. Its ticket is the cut date + coil line + count (e.g. MMDDYY-101). Everything else copies from the coil, but it becomes a sheet (C/S = S).</div>' +
        '<div id="coilRowsBox"></div>' +
        '<button class="btn secondary" id="coilAddRowBtn" style="width:100%;margin-top:8px">+ Add another skid</button>' +
        '<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px">' +
          '<input type="checkbox" id="coilKeepOpen" style="width:auto;margin:0"> There’s more to cut on this coil later (don’t mark it Used yet)' +
        '</label>' +
        '<button class="btn success" id="coilCutBtn" style="width:100%;margin-top:12px">Cut coil &amp; create skids</button>' +
      '</div>';
    document.getElementById('coilLineNo').onchange = function () { coilLineNo = Number(this.value) === 2 ? 2 : 1; };
    document.getElementById('coilChangeBtn').onclick = function () { coilSel = null; renderCoilLine(); };
    document.getElementById('coilAddRowBtn').onclick = function () { syncCoilRows(); coilRows.push({ weight: '', qty: '' }); renderCoilRows(); };
    document.getElementById('coilCutBtn').onclick = coilCutSubmit;
    renderCoilRows();
  }

  function renderCoilPicker(term) {
    var box = document.getElementById('coilPicker');
    if (!box) return;
    term = (term || '').trim().toLowerCase();
    var rows = coilEligible().filter(function (t) {
      if (!term) return true;
      return String(t.ticket).toLowerCase().indexOf(term) !== -1 || String(t.skidId).toLowerCase().indexOf(term) !== -1 || String(t.mill).toLowerCase().indexOf(term) !== -1;
    }).slice(0, 25);
    if (!rows.length) { box.innerHTML = '<div class="sub">' + (allCache.length ? ('No coils' + (term ? ' match.' : ' available.')) : 'Loading&hellip;') + '</div>'; return; }
    var html = '';
    rows.forEach(function (t) {
      var cut = allCache.filter(function (x) { return x.splitOf === t.skidId; }).length;   // skids already cut off it
      html += '<div class="queue-item" style="padding:6px 0"><div style="min-width:0">' +
        '<span class="ticket-id" style="font-size:15px">' + esc(t.ticket || '(no ticket)') + '</span> ' +
        (cut ? '<span class="pill" style="background:#b45309;color:#fff;font-size:11px;padding:2px 6px;border-radius:8px;margin-left:4px">' + cut + ' cut &middot; open</span> ' : '') +
        '<span class="sub">' + esc(t.skidId) + (t.mill ? ' &middot; Mill ' + esc(t.mill) : '') + (t.weight ? ' &middot; wt ' + esc(t.weight) : '') + '</span></div>' +
        '<button class="btn success" style="padding:8px 14px" data-coil="' + esc(t.skidId) + '">Select</button></div>';
    });
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('[data-coil]'), function (b) {
      b.onclick = function () {
        var t = allCache.filter(function (x) { return x.skidId === b.getAttribute('data-coil'); })[0];
        if (!t) return;
        coilSel = { skidId: t.skidId, ticket: t.ticket, mill: t.mill, weight: t.weight, qty: t.qty };
        coilRows = [{ weight: '', qty: '' }];
        renderCoilLine();
      };
    });
  }

  // Read the current weight/qty inputs back into coilRows (so add/remove doesn't lose typed values).
  function syncCoilRows() {
    var box = document.getElementById('coilRowsBox');
    if (!box) return;
    Array.prototype.forEach.call(box.querySelectorAll('[data-crow]'), function (rowEl) {
      var i = Number(rowEl.getAttribute('data-crow'));
      if (coilRows[i]) { coilRows[i].weight = rowEl.querySelector('.crWeight').value; coilRows[i].qty = rowEl.querySelector('.crQty').value; }
    });
  }

  function renderCoilRows() {
    var box = document.getElementById('coilRowsBox');
    if (!box) return;
    if (!coilRows.length) coilRows.push({ weight: '', qty: '' });
    var html = '';
    coilRows.forEach(function (r, i) {
      html += '<div class="row" data-crow="' + i + '" style="align-items:flex-end;margin-bottom:6px">' +
        '<div class="field" style="flex:1;margin:0"><label>Weight</label><input type="number" class="crWeight" value="' + esc(r.weight) + '" placeholder="lbs"></div>' +
        '<div class="field" style="flex:1;margin:0 8px"><label>Quantity</label><input type="number" class="crQty" value="' + esc(r.qty) + '" placeholder="sheets"></div>' +
        '<button class="btn danger" data-crdel="' + i + '" style="padding:10px 12px">&times;</button></div>';
    });
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('[data-crow]'), function (rowEl) {
      var i = Number(rowEl.getAttribute('data-crow'));
      rowEl.querySelector('.crWeight').oninput = function () { coilRows[i].weight = this.value; };
      rowEl.querySelector('.crQty').oninput = function () { coilRows[i].qty = this.value; };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-crdel]'), function (b) {
      b.onclick = function () { syncCoilRows(); coilRows.splice(Number(b.getAttribute('data-crdel')), 1); if (!coilRows.length) coilRows.push({ weight: '', qty: '' }); renderCoilRows(); };
    });
  }

  function coilCutSubmit() {
    syncCoilRows();
    var dateEl = document.getElementById('coilDate');
    var date = (dateEl && dateEl.value) ? dateEl.value : todayStr();
    var lineEl = document.getElementById('coilLineNo');
    var line = (lineEl && Number(lineEl.value) === 2) ? 2 : 1;
    coilLineNo = line;
    var keepEl = document.getElementById('coilKeepOpen');
    var finish = !(keepEl && keepEl.checked);   // unchecked => finished; checked => keep open for more
    var skids = coilRows.map(function (r) { return { weight: r.weight, qty: r.qty }; })
      .filter(function (r) { return String(r.weight).trim() !== '' || String(r.qty).trim() !== ''; });
    if (!skids.length) { toast('Add at least one skid with a weight or quantity'); return; }
    var c = coilSel;
    showConfirm('Cut coil ' + (c.ticket || c.skidId) + ' into ' + skids.length + ' skid' + (skids.length === 1 ? '' : 's') + ' on Coil Line ' + line + '?',
      (finish ? 'The coil is marked Used on ' + date + '.' : 'The coil stays available so you can cut more from it later.') +
      ' Each new skid becomes a sheet, keeps the coil’s Mill (' + (c.mill || '?') + ') and specs, with the weight & quantity you entered, and gets a ticket like ' + fmtTicketPreview(date, line) + '.',
      function () {
        var btn = document.getElementById('coilCutBtn');
        if (btn) { btn.disabled = true; btn.textContent = 'Cutting…'; }
        runMutation('cutCoil', [c.skidId, date, line, skids, finish, newOpId()],
          function (res) {
            var made = (res && res.created != null) ? res.created : skids.length;
            var list = (res && res.tickets) ? res.tickets.map(function (t) { return t.ticket; }).join(', ') : '';
            if (finish) markCacheStatus(c.skidId, 'Used');
            google.script.run.withSuccessHandler(function (all) { setCaches(all); }).getAllTickets();  // pull the new skids + coil state
            coilSel = null; coilRows = [{ weight: '', qty: '' }];
            showInfo('Coil cut', made + ' skid' + (made === 1 ? '' : 's') + ' created' + (list ? ' — tickets ' + list : '') + '. ' +
              (finish ? 'The coil is marked Used.' : 'The coil is still open — select it again to cut more.'),
              function () { renderCoilLine(); });
          },
          function (err) { toast('Error: ' + err.message); var b2 = document.getElementById('coilCutBtn'); if (b2) { b2.disabled = false; b2.textContent = 'Cut coil & create skids'; } });
      });
  }

  // ----- Log Work (Metal Lines / Press): start a run, resume open runs, or go to Review -----
  // machineType is 'Line' or 'Press' (fixed by the chosen section). Everything downstream (the
  // run, add/submit/review/finish) is shared; only the label and the open/review filters differ.
  function renderProductionHome(machineType) {
    state.view = 'prodHome';
    var view = document.getElementById('view');
    if (!view) return;
    var tok = nextViewToken();
    var label = machineType === 'Press' ? 'Press Department' : 'Metal Lines';
    view.innerHTML =
      '<div class="card">' +
        '<h3 style="margin-top:0">' + esc(label) + ' — Log Work</h3>' +
        '<div class="sub" style="margin-bottom:12px">Start a work session on a ' + esc(machineType.toLowerCase()) + ', then load the skids you run. Submit for review when the day is done.</div>' +
        '<div class="row">' +
          operatorFieldHtml('runOperator') +
          '<div class="field"><label>' + esc(machineType) + ' #</label><input type="number" id="runMachineNum" min="1" placeholder="e.g. 4"></div>' +
        '</div>' +
        '<div class="field"><label>Notes (optional)</label><input id="runNotes" placeholder="e.g. day shift"></div>' +
        '<button class="btn success" id="startRunBtn">+ Start Work</button>' +
      '</div>' +
      '<div class="card"><button class="btn secondary" id="reviewWorkBtn" style="width:100%">Review Work</button></div>' +
      '<div class="card"><h3 style="margin-top:0;font-size:15px">Open work sessions</h3>' +
        '<div id="openRunsList"><div class="loading">Loading&hellip;</div></div></div>';

    document.getElementById('reviewWorkBtn').onclick = openProductionReview;
    document.getElementById('startRunBtn').onclick = function () {
      var operator = document.getElementById('runOperator').value.trim();
      var numv = document.getElementById('runMachineNum').value.trim();
      var notes = document.getElementById('runNotes').value;
      if (!operator) { toast('Enter an operator name'); return; }
      if (!numv) { toast('Enter the ' + machineType.toLowerCase() + ' number'); return; }
      var machine = machineType + ' ' + numv;
      var btn = this; btn.disabled = true; btn.textContent = 'Starting…';
      runMutation('createRun', [machine, operator, notes, newOpId()],
        function (result) {
          currentRun = { runId: result.runId, machine: machine, operator: operator };
          state.runId = result.runId; runAddedSkids = [];
          renderRunAddSkids();
        },
        function (err) { toast('Error: ' + err.message); btn.disabled = false; btn.textContent = '+ Start Work'; });
    };

    google.script.run.withSuccessHandler(function (runs) {
      if (tok !== viewToken) return;
      // Only this tab's machine type (Line vs Press) belongs on this screen.
      renderOpenRunsList((runs || []).filter(function (r) { return machineParts(r.machine).type === machineType; }));
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      var el = document.getElementById('openRunsList');
      if (el) el.innerHTML = '<div class="sub">Error: ' + esc(err.message) + '</div>';
    }).getProductionRuns('', 'open');
  }

  function renderOpenRunsList(runs) {
    var el = document.getElementById('openRunsList');
    if (!el) return;
    if (!runs || !runs.length) { el.innerHTML = '<div class="sub">No open sessions. Start one above.</div>'; return; }
    var html = '';
    runs.forEach(function (r) {
      html += '<div class="queue-item" data-run="' + esc(r.runId) + '" style="padding:8px 0">' +
        '<div style="min-width:0"><div class="ticket-id" style="font-size:15px">' + esc(r.machine) +
          ' <span class="sub" style="font-weight:400">' + esc(r.runId) + '</span></div>' +
          '<div class="sub">' + (r.skidCount || 0) + ' skid(s) &middot; by ' + esc(r.operator) + ' &middot; ' + esc(r.createdOn) + '</div></div>' +
        '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-resume="' + esc(r.runId) + '">Resume</button>' +
      '</div>';
    });
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('[data-resume]'), function (btn) {
      btn.onclick = function () {
        var rid = btn.getAttribute('data-resume');
        var r = runs.filter(function (x) { return x.runId === rid; })[0];
        currentRun = { runId: r.runId, machine: r.machine, operator: r.operator };
        state.runId = r.runId; runAddedSkids = [];
        // Resuming: load the skids already on the run so the session list shows them (not 0).
        btn.disabled = true; btn.textContent = 'Opening…';
        google.script.run.withSuccessHandler(function (run) {
          runAddedSkids = ((run && run.skids) || []).map(function (s) {
            return { skidId: s.skidId, ticket: s.ticket, loadedOn: s.loadedOn };
          });
          renderRunAddSkids();
        }).withFailureHandler(function () { renderRunAddSkids(); }).getRunDetail(rid);
      };
    });
  }

  // ----- Add skids to the run (skids of any status except Used / already In Production) -----
  // Loadable: raw steel (Current/WIP) plus cut pallets for THIS machine — slit pallets on a Line,
  // scroll pallets on a Press. machineType ('Line'|'Press') scopes which cut pallets show; when
  // omitted (unknown), all cut pallets are allowed.
  function prodPickList(machineType) {
    var cutFor = machineType === 'Press' ? 'Scroll' : (machineType === 'Line' ? 'Slit' : null);
    return allCache.filter(function (t) {
      if (t.status === 'Current' || t.status === 'WIP') return true;
      if (t.status === 'Cut') return cutFor ? (t.cutType === cutFor) : true;
      return false;
    });
  }

  function renderRunAddSkids() {
    state.view = 'prodAdd';
    var view = document.getElementById('view');
    nextViewToken();
    showTabbar(false); showBack(true);
    view.innerHTML =
      '<div class="card"><div class="sub">Run <strong>' + esc(currentRun.runId) + '</strong> &middot; ' + esc(currentRun.machine) +
        (currentRun.operator ? ' &middot; ' + esc(currentRun.operator) : '') + '</div></div>' +
      '<div class="card"><h3 style="margin-top:0;font-size:15px">Find a skid to load</h3>' +
        searchBarHtml('runSkidSearch') +
        '<div id="runSkidPicker" style="margin-top:10px"><div class="loading">Loading&hellip;</div></div></div>' +
      '<div class="card">' +
        '<h4 style="margin-bottom:6px;font-size:13px;color:var(--muted)">Skids loaded this session (<span id="runAddedCount">0</span>)</h4>' +
        '<div id="runAddedList" class="sub">None yet.</div></div>' +
      '<div class="card">' +
        '<div class="sub" style="margin-bottom:10px">Loaded skids are marked <strong>In Production</strong> with today\'s date. Submit the run for review when the day is done.</div>' +
        '<button class="btn success" id="submitRunBtn" style="width:100%">Submit for Review</button></div>';

    var search = document.getElementById('runSkidSearch');
    search.oninput = function () { renderRunSkidPicker(search.value); };
    ensureAllCache(function () { renderRunSkidPicker(''); });
    renderRunAddedList();

    document.getElementById('submitRunBtn').onclick = function () {
      showModal({
        title: 'Any partial skids?',
        message: 'Did any skid on this run not fully run?',
        confirmText: 'Yes', cancelText: 'No',
        onConfirm: function () { renderRunPartials(); },
        onCancel: function () { doSubmitRun(); }
      });
    };
  }

  function doSubmitRun() {
    runMutation('submitRun', [currentRun.runId, currentRun.operator, newOpId()],
      function () { showInfo('Submitted for review', 'Run ' + currentRun.runId + ' is ready to review and finish.', function () { openMetalsSection(metalsTab); }); },
      function (err) { showModal({ title: 'Could not submit', message: err.message, confirmText: 'OK' }); });
  }

  // "Yes, there were partials" — pick a skid and enter the sheets that actually ran; the
  // leftover splits back to inventory now. Then submit the run for review.
  function renderRunPartials() {
    state.view = 'prodPartials';
    var view = document.getElementById('view');
    var tok = nextViewToken();
    showTabbar(false); showBack(true);
    view.innerHTML = '<div class="loading">Loading run&hellip;</div>';
    google.script.run.withSuccessHandler(function (run) {
      if (tok !== viewToken) return;
      renderRunPartialsContent(run);
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      view.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getRunDetail(currentRun.runId);
  }

  function renderRunPartialsContent(run) {
    var view = document.getElementById('view');
    var skids = (run.skids || []).filter(function (s) { return s.status === 'In Production'; });
    var html = '<div class="card"><h3 style="margin-top:0">Mark partial skids</h3>' +
      '<div class="sub" style="margin-bottom:6px">Run ' + esc(run.runId) + ' &middot; ' + esc(run.machine) + '</div>' +
      '<div class="sub">For any skid that didn\'t fully run, enter the sheets that ran and press Save — the leftover returns to inventory. Skids you don\'t touch stay full. Then submit.</div></div>';
    if (!skids.length) html += '<div class="card empty">No skids on this run.</div>';
    else {
      html += '<div class="card">';
      skids.forEach(function (s) {
        html += '<div class="queue-item" style="padding:8px 0"><div style="min-width:0">' +
          '<div class="ticket-id" style="font-size:15px">' + esc(s.ticket) + ' <span class="sub" style="font-weight:400">' + esc(s.skidId) + '</span></div>' +
          '<div class="sub">' + esc(s.qty) + ' sheets on hand</div></div>' +
          '<div style="white-space:nowrap">' +
            (Number(s.qty) > 0
              ? '<input type="number" class="partialRan" data-skid="' + esc(s.skidId) + '" data-max="' + esc(s.qty) + '" placeholder="ran" min="1" max="' + esc(s.qty) + '" style="width:78px;padding:6px;margin-right:6px"> ' +
                '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-savepartial="' + esc(s.skidId) + '">Save</button>'
              : '<span class="sub">no count</span>') +
          '</div></div>';
      });
      html += '</div>';
    }
    html += '<div class="card"><button class="btn success" id="partialsSubmitBtn" style="width:100%">Submit for Review</button></div>';
    view.innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll('[data-savepartial]'), function (btn) {
      btn.onclick = function () {
        var sk = btn.getAttribute('data-savepartial');
        var inp = document.querySelector('.partialRan[data-skid="' + sk + '"]');
        var max = Number(inp.getAttribute('data-max')) || 0;
        var ran = Number(inp.value);
        if (isNaN(ran) || ran <= 0) { toast('Enter how many sheets ran'); return; }
        if (max > 0 && ran > max) { toast('Only ' + max + ' sheets on this skid'); return; }
        if (max > 0 && ran === max) { toast('That\'s the full skid — nothing to split'); return; }
        btn.disabled = true;
        runMutation('runSkidPartial', [currentRun.runId, sk, ran, currentRun.operator, newOpId()],
          function () {
            toast('Partial recorded');
            google.script.run.withSuccessHandler(function (all) { setCaches(all); }).getAllTickets();
            renderRunPartials();
          },
          function (err) { showModal({ title: 'Could not save', message: err.message, confirmText: 'OK' }); btn.disabled = false; });
      };
    });
    document.getElementById('partialsSubmitBtn').onclick = function () { doSubmitRun(); };
  }

  function skidRowHtml(q, pickAttr) {
    var isCut = !!q.cutType;
    var label = isCut ? ('LOAD ' + esc(q.ticket)) : esc(q.ticket);
    var cutLine = isCut && q.mill ? '<div class="sub">' + esc(q.cutType) + ' pallet &middot; mill ' + esc(q.mill) + '</div>' : '';
    return '<div class="queue-item" style="padding:6px 0"><div style="min-width:0">' +
      '<span class="ticket-id" style="font-size:14px">' + label + '</span> ' +
      '<span class="badge ' + badgeClassFor(q.status) + '">' + esc(q.status) + '</span> ' +
      '<span class="sub">' + esc(q.endUse) + ' &middot; ' + esc(q.qty || 0) + ' sheets</span>' + cutLine +
      '<div class="specs"><span><b>BW</b> ' + esc(q.bw) + '</span><span><b>Type</b> ' + esc(q.type) +
      '</span><span><b>Temper</b> ' + esc(q.temper) + '</span></div></div>' +
      '<button class="btn secondary" style="padding:6px 10px;font-size:13px" ' + pickAttr + '="' + esc(q.skidId) + '">Select</button></div>';
  }

  function renderRunSkidPicker(term) {
    var c = document.getElementById('runSkidPicker');
    if (!c) return;
    term = (term || '').trim().toLowerCase();
    var list = prodPickList(currentRun ? machineParts(currentRun.machine).type : null);
    var rows = term
      ? list.filter(function (q) { return String(q.ticket).toLowerCase().indexOf(term) !== -1 || String(q.skidId).toLowerCase().indexOf(term) !== -1; })
      : list.slice(0, 15);
    if (!rows.length) { c.innerHTML = '<div class="sub">No skids match.</div>'; return; }
    var html = '';
    rows.forEach(function (q) { html += skidRowHtml(q, 'data-pick'); });
    c.innerHTML = html;
    // One tap: selecting a skid loads it straight onto the run (nothing else is entered here —
    // usage is captured later at Finish), matching the Review screen's picker.
    Array.prototype.forEach.call(c.querySelectorAll('[data-pick]'), function (btn) {
      btn.onclick = function () {
        var sk = btn.getAttribute('data-pick');
        btn.disabled = true;
        runMutation('runAddSkid', [currentRun.runId, sk, currentRun.operator, newOpId()],
          function (result) {
            if (result && result.duplicate) { toast('Already loaded'); btn.disabled = false; return; }
            runAddedSkids.push(result);
            toast('Loaded ' + (result.ticket || sk));
            markCacheStatus(sk, 'In Production'); // drop it from the picker right away
            var si = document.getElementById('runSkidSearch');
            renderRunSkidPicker(si ? si.value : ''); // keep the search context
            renderRunAddedList();
            google.script.run.withSuccessHandler(function (all) { setCaches(all); }).getAllTickets();
          },
          function (err) { toast('Error: ' + err.message); btn.disabled = false; });
      };
    });
  }

  function renderRunAddedList() {
    var container = document.getElementById('runAddedList');
    var countEl = document.getElementById('runAddedCount');
    if (countEl) countEl.textContent = runAddedSkids.length;
    if (!container) return;
    if (!runAddedSkids.length) { container.innerHTML = 'None yet.'; return; }
    var html = '<table><thead><tr><th>Ticket</th><th>Skid</th><th>Loaded</th></tr></thead><tbody>';
    runAddedSkids.forEach(function (r) {
      html += '<tr><td>' + esc(r.ticket) + '</td><td>' + esc(r.skidId) + '</td><td>' + esc(r.loadedOn) + '</td></tr>';
    });
    container.innerHTML = html + '</tbody></table>';
  }

  // ----- Review Work: submitted runs for a day, open one to review + finish -----
  function openProductionReview() {
    state.view = 'prodReview'; runSwapSkid = null;
    nextViewToken();
    showTabbar(false); showBack(true);
    renderProductionReview();
  }

  function renderProductionReview() {
    state.view = 'prodReview';
    var view = document.getElementById('view');
    var tok = nextViewToken();
    var day = prodReviewDate || todayStr();
    var reviewType = metalsTab === 'press' ? 'Press' : 'Line';
    var label = reviewType === 'Press' ? 'Press Department' : 'Metal Lines';
    view.innerHTML =
      '<div class="card"><h3 style="margin-top:0">Review ' + esc(label) + ' work</h3>' +
        '<div class="field"><label>Day</label><input type="date" id="prodReviewDay" value="' + esc(day) + '"></div>' +
        '<div class="sub">' + esc(reviewType) + ' runs submitted that day. Open one to review skids and finish the work.</div></div>' +
      '<div id="prodReviewList"><div class="loading">Loading&hellip;</div></div>';
    document.getElementById('prodReviewDay').onchange = function () { prodReviewDate = this.value; renderProductionReview(); };
    google.script.run.withSuccessHandler(function (runs) {
      if (tok !== viewToken) return;
      renderProdReviewList((runs || []).filter(function (r) { return machineParts(r.machine).type === reviewType; }));
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      var el = document.getElementById('prodReviewList');
      if (el) el.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getProductionRuns(prodReviewDate, 'submitted');
  }

  function renderProdReviewList(runs) {
    var el = document.getElementById('prodReviewList');
    if (!el) return;
    if (!runs || !runs.length) { el.innerHTML = '<div class="card empty">No runs submitted that day.</div>'; return; }
    var html = '<div class="card">';
    runs.forEach(function (r) {
      html += '<div class="queue-item" data-run="' + esc(r.runId) + '">' +
        '<div style="min-width:0"><div class="ticket-id">' + esc(r.machine) +
          ' <span class="sub" style="font-weight:400">' + esc(r.runId) + '</span></div>' +
          '<div class="sub">' + (r.skidCount || 0) + ' skid(s) &middot; by ' + esc(r.operator) + '</div></div>' +
        '<div style="text-align:right;white-space:nowrap"><span class="badge inprogress">Submitted</span></div></div>';
    });
    el.innerHTML = html + '</div>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-run]'), function (row) {
      row.onclick = function () { openRun(row.getAttribute('data-run')); };
    });
  }

  function openRun(runId) {
    state.view = 'run'; state.runId = runId; runSwapSkid = null;
    nextViewToken();
    showTabbar(false); showBack(true);
    renderRun();
  }

  function renderRun() {
    var view = document.getElementById('view');
    var tok = nextViewToken();
    view.innerHTML = '<div class="loading">Loading run&hellip;</div>';
    google.script.run.withSuccessHandler(function (run) {
      if (tok !== viewToken) return;
      renderRunContent(view, run);
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      view.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getRunDetail(state.runId);
  }

  function machineParts(machine) {
    var m = /^(Line|Press)\s*(\d+)/i.exec(String(machine || ''));
    return m ? { type: m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase(), num: m[2] } : { type: '', num: '' };
  }

  function renderRunContent(view, run) {
    var finished = run.status === 'Finished';
    var mp = machineParts(run.machine);
    reviewRunMachineType = mp.type; // scope the review add/swap picker to this run's machine (Line/Press)
    var html = '';

    html += '<div class="card">' +
      '<div class="ticket-id">' + esc(run.machine) +
        ' <span class="badge ' + (finished ? 'used' : 'inprogress') + '">' + esc(run.status) + '</span>' +
        ' <span class="sub" style="font-weight:400">' + esc(run.runId) + '</span></div>' +
      '<div class="sub" style="margin-top:4px">Operator ' + esc(run.operator) + ' &middot; started ' + esc(run.createdOn) +
        (run.submittedOn ? ' &middot; submitted ' + esc(run.submittedOn) : '') +
        (run.finishedOn ? ' &middot; finished ' + esc(run.finishedOn) : '') + '</div>' +
      (run.notes ? '<div class="sub">Notes: ' + esc(run.notes) + '</div>' : '') +
      '</div>';

    // One operator field for the whole review screen — used for every change here (add/remove/
    // swap/note/finish) and saved as the run's operator when you Save details.
    if (!finished) {
      html += '<div class="card">' + operatorFieldHtml('runReviewOperator', 'Operator name') +
        '<div class="sub">Used for every change on this screen.</div></div>';
    }

    // Edit run details (machine); operator comes from the field above
    if (!finished) {
      html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Run details</h3>' +
        '<div class="row">' +
          selectField('runEditType', 'Line / Press', ['Line', 'Press'], mp.type) +
          '<div class="field"><label>Number</label><input type="number" id="runEditNum" min="1" value="' + esc(mp.num) + '"></div>' +
        '</div>' +
        '<button class="btn secondary" id="saveRunBtn">Save details</button></div>';
    }

    // Skids on the run
    html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Skids on this run (' + run.skids.length + ')</h3>';
    if (!run.skids.length) html += '<div class="sub">None yet.</div>';
    else {
      html += '<table><thead><tr><th>Ticket</th><th>Status</th><th>Loaded</th><th>Sheets</th>' + (finished ? '<th>Finished</th>' : '<th></th>') + '</tr></thead><tbody>';
      run.skids.forEach(function (s) {
        var actions = finished ? esc(s.finishedOn) :
          '<button class="btn secondary" style="padding:4px 8px;font-size:12px" data-note="' + esc(s.skidId) + '">Note</button> ' +
          '<button class="btn secondary" style="padding:4px 8px;font-size:12px" data-swap="' + esc(s.skidId) + '">Swap</button> ' +
          '<button class="btn danger" style="padding:4px 8px;font-size:12px" data-remove="' + esc(s.skidId) + '">Remove</button>';
        html += '<tr><td>' + esc(s.ticket) + ' <span class="sub">' + esc(s.skidId) + '</span></td>' +
          '<td><span class="badge ' + badgeClassFor(s.status) + '">' + esc(s.status) + '</span></td>' +
          '<td class="sub">' + esc(s.loadedOn) + '</td><td>' + esc(s.qty) + '</td><td style="white-space:nowrap">' + actions + '</td></tr>' +
          (s.notes ? '<tr><td colspan="5" class="sub" style="border-bottom:1px solid var(--line)">Notes: ' + esc(s.notes) + '</td></tr>' : '');
      });
      html += '</tbody></table>';
      html += '<div id="runNoteForm" style="display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:12px"></div>';
    }
    html += '</div>';

    if (!finished) {
      // Add / swap skids
      html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Add a skid</h3>' +
        searchBarHtml('runReviewSearch') +
        '<div id="runReviewPicker" style="margin-top:10px"></div></div>';

      // Finish Work
      html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Finish work</h3>' +
        '<div class="sub" style="margin-bottom:10px">For each skid, enter how many sheets <strong>actually ran</strong>. If a skid didn\'t fully run, lower the number — the leftover goes back to inventory as a usable skid. Finishing marks the ran sheets <strong>Used</strong>.</div>';
      var inProd = run.skids.filter(function (s) { return s.status === 'In Production'; });
      if (!inProd.length) html += '<div class="sub">No in-production skids to finish.</div>';
      else {
        inProd.forEach(function (s) {
          html += '<div class="field"><label>' + esc(s.ticket) + ' — sheets that ran (of ' + esc(s.qty) + ')</label>' +
            (Number(s.qty) > 0
              ? '<input type="number" data-used-skid="' + esc(s.skidId) + '" value="' + esc(s.qty) + '" min="0" max="' + esc(s.qty) + '">' +
                '<div class="sub" id="finishHint_' + esc(s.skidId) + '" style="margin-top:4px"></div>'
              : '<div class="sub">Whole skid (no sheet count)</div>') +
            '</div>';
        });
      }
      html += '<button class="btn success" id="finishRunBtn"' + (inProd.length ? '' : ' disabled') + '>Finish Work</button></div>';
    }

    view.innerHTML = html;
    wireRunReview(run, finished);
  }

  function currentRunOperator() {
    var el = document.getElementById('runReviewOperator');
    return el ? el.value.trim() : '';
  }

  function wireRunReview(run, finished) {
    if (finished) return;

    var opField = document.getElementById('runReviewOperator');
    if (opField && run.operator) opField.value = run.operator; // the run's operator wins over the session default

    // Save run details
    var saveBtn = document.getElementById('saveRunBtn');
    if (saveBtn) saveBtn.onclick = function () {
      var operator = currentRunOperator();
      var type = document.getElementById('runEditType').value;
      var numv = document.getElementById('runEditNum').value.trim();
      if (!type || !numv) { toast('Pick Line/Press and a number'); return; }
      var fields = { Machine: type + ' ' + numv };
      if (operator) fields.Operator = operator;
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      runMutation('updateRun', [state.runId, fields, operator, newOpId()],
        function () { toast('Run details saved'); renderRun(); },
        function (err) { showModal({ title: 'Could not save', message: err.message, confirmText: 'OK' }); saveBtn.disabled = false; saveBtn.textContent = 'Save details'; });
    };

    // Per-skid note
    var noteForm = document.getElementById('runNoteForm');
    Array.prototype.forEach.call(document.querySelectorAll('[data-note]'), function (btn) {
      btn.onclick = function () {
        var sk = btn.getAttribute('data-note');
        noteForm.style.display = 'block';
        noteForm.innerHTML = '<div class="field"><label>Note for skid ' + esc(sk) + '</label><input id="runNoteInput" placeholder="e.g. edge dents"></div>' +
          '<button class="btn success" id="saveRunNoteBtn">Save note</button> <button class="btn secondary" id="cancelRunNoteBtn">Cancel</button>';
        if (noteForm.scrollIntoView) noteForm.scrollIntoView({ block: 'nearest' });
        document.getElementById('cancelRunNoteBtn').onclick = function () { noteForm.style.display = 'none'; noteForm.innerHTML = ''; };
        document.getElementById('saveRunNoteBtn').onclick = function () {
          var note = document.getElementById('runNoteInput').value.trim();
          if (!note) { toast('Enter a note'); return; }
          this.disabled = true;
          runMutation('updateRunSkid', [state.runId, sk, { notes: note }, currentRunOperator(), newOpId()],
            function () { toast('Note saved'); renderRun(); },
            function (err) { showModal({ title: 'Could not save note', message: err.message, confirmText: 'OK' }); });
        };
      };
    });

    // Swap: arm swap mode, then pick the replacement below
    Array.prototype.forEach.call(document.querySelectorAll('[data-swap]'), function (btn) {
      btn.onclick = function () {
        runSwapSkid = btn.getAttribute('data-swap');
        toast('Now pick the replacement skid below');
        var s = document.getElementById('runReviewSearch');
        if (s && s.scrollIntoView) s.scrollIntoView({ block: 'center' });
      };
    });

    // Remove
    Array.prototype.forEach.call(document.querySelectorAll('[data-remove]'), function (btn) {
      btn.onclick = function () {
        var sk = btn.getAttribute('data-remove');
        showConfirm('Remove skid', 'Remove skid ' + sk + ' from this run? It returns to its previous status.', function () {
          btn.disabled = true;
          runMutation('runRemoveSkid', [state.runId, sk, currentRunOperator(), newOpId()],
            function () { renderRun(); },
            function (err) { showModal({ title: 'Could not remove', message: err.message, confirmText: 'OK' }); btn.disabled = false; });
        }, 'Remove', 'danger');
      };
    });

    // Add-skid picker
    var search = document.getElementById('runReviewSearch');
    if (search) {
      ensureAllCache(function () { renderRunReviewPicker(''); });
      search.oninput = function () { renderRunReviewPicker(search.value); };
    }

    // Finish Work — live hint per skid showing how many sheets return to inventory.
    Array.prototype.forEach.call(document.querySelectorAll('[data-used-skid]'), function (inp) {
      function upd() {
        var sk = inp.getAttribute('data-used-skid');
        var hint = document.getElementById('finishHint_' + sk);
        var max = Number(inp.getAttribute('max')) || 0;
        var used = Number(inp.value);
        if (max > 0 && used > max) { inp.value = max; used = max; }
        if (!hint) return;
        if (isNaN(used) || inp.value === '') { hint.textContent = ''; return; }
        hint.textContent = (max > 0 && used < max)
          ? (max - used) + ' sheet(s) return to inventory as a new skid.'
          : 'Full skid used.';
      }
      inp.oninput = upd; upd();
    });

    var finishBtn = document.getElementById('finishRunBtn');
    if (finishBtn) finishBtn.onclick = function () {
      var operator = currentRunOperator();
      if (!operator) { toast('Enter an operator name'); return; }
      var usedMap = {};
      Array.prototype.forEach.call(document.querySelectorAll('[data-used-skid]'), function (inp) {
        usedMap[inp.getAttribute('data-used-skid')] = inp.value;
      });
      showConfirm('Finish work', 'Mark this run finished? Its skids will be recorded as Used with today\'s date.', function () {
        finishBtn.disabled = true;
        runMutation('finishRun', [state.runId, usedMap, operator, newOpId()],
          function () { showInfo('Work finished', 'Skids recorded as Used.', function () { openProductionReview(); }); },
          function (err) { showModal({ title: 'Could not finish', message: err.message, confirmText: 'OK' }); finishBtn.disabled = false; });
      }, 'Finish Work');
    };
  }

  function renderRunReviewPicker(term) {
    var c = document.getElementById('runReviewPicker');
    if (!c) return;
    term = (term || '').trim().toLowerCase();
    var list = prodPickList(reviewRunMachineType);
    var rows = term
      ? list.filter(function (q) { return String(q.ticket).toLowerCase().indexOf(term) !== -1 || String(q.skidId).toLowerCase().indexOf(term) !== -1; })
      : list.slice(0, 15);
    if (!rows.length) { c.innerHTML = '<div class="sub">No skids match.</div>'; return; }
    var html = '';
    rows.forEach(function (q) { html += skidRowHtml(q, 'data-rpick'); });
    c.innerHTML = html;
    Array.prototype.forEach.call(c.querySelectorAll('[data-rpick]'), function (btn) {
      btn.onclick = function () {
        var sk = btn.getAttribute('data-rpick');
        var operator = currentRunOperator();
        btn.disabled = true;
        if (runSwapSkid) {
          var oldSk = runSwapSkid; runSwapSkid = null;
          runMutation('swapRunSkid', [state.runId, oldSk, sk, operator, newOpId()],
            function () { toast('Skid swapped'); markCacheStatus(sk, 'In Production'); renderRun(); },
            function (err) { showModal({ title: 'Could not swap', message: err.message, confirmText: 'OK' }); btn.disabled = false; });
        } else {
          runMutation('runAddSkid', [state.runId, sk, operator, newOpId()],
            function () { toast('Skid added'); markCacheStatus(sk, 'In Production'); renderRun(); },
            function (err) { showModal({ title: 'Could not add', message: err.message, confirmText: 'OK' }); btn.disabled = false; });
        }
      };
    });
  }

  // ---------------- Slitter Department (Slitters + Scrolls; mixed-mill cutting log) --------
  // Two sub-tabs: Slitters (typed #) and Scrolls (1-SS/2-SS/3-SS dropdown) — operators move
  // between those machines in the same area. Each output pallet becomes a runnable "Cut" skid
  // carrying its mill composition, so slit pallets run on the Metal Lines and scroll pallets on
  // the Press. Source skids are not drawn down yet (value tracking deferred).
  function renderSlitterHome() {
    state.view = 'slitterHome';
    var view = document.getElementById('view');
    if (!view) return;
    nextViewToken();
    var chips = [['Slitter', 'Slitters'], ['Scroll', 'Scrolls']].map(function (k) {
      return '<button data-slkind="' + k[0] + '"' + (slitKind === k[0] ? ' class="active"' : '') + '>' + esc(k[1]) + '</button>';
    }).join('');
    view.innerHTML = '<div class="tabbar" id="slitKindTabs">' + chips + '</div><div id="slitBody"></div>';
    Array.prototype.forEach.call(document.querySelectorAll('#slitKindTabs button'), function (btn) {
      btn.onclick = function () { slitKind = btn.getAttribute('data-slkind'); renderSlitterHome(); };
    });
    renderSlitterKindBody();
  }

  function renderSlitterKindBody() {
    var body = document.getElementById('slitBody');
    if (!body) return;
    var tok = nextViewToken();
    var isScroll = slitKind === 'Scroll';
    var machineField = isScroll
      ? selectField('slitMachineSel', 'Scroll machine', ['1-SS', '2-SS', '3-SS'], null)
      : '<div class="field"><label>Slitter #</label><input type="number" id="slitNum" min="1" placeholder="e.g. 2"></div>';
    var feeds = isScroll ? 'Press' : 'Metal Lines';
    body.innerHTML =
      '<div class="card">' +
        '<h3 style="margin-top:0">' + (isScroll ? 'Scrolls' : 'Slitters') + ' — Log</h3>' +
        '<div class="sub" style="margin-bottom:12px">Record what the ' + (isScroll ? 'scroll' : 'slitter') + ' cut. Each output pallet becomes a runnable skid that carries its mill composition, so it can be run through the <b>' + feeds + '</b>.</div>' +
        '<div class="row">' + operatorFieldHtml('slitOperator') + machineField + '</div>' +
        '<div class="field"><label>Notes (optional)</label><input id="slitNotes" placeholder="e.g. day shift"></div>' +
        '<button class="btn success" id="startSlitBtn">+ Start ' + (isScroll ? 'Scroll' : 'Slitter') + ' Session</button>' +
      '</div>' +
      '<div class="card"><h3 style="margin-top:0;font-size:15px">Open ' + (isScroll ? 'scroll' : 'slitter') + ' sessions</h3>' +
        '<div id="openSlitList"><div class="loading">Loading&hellip;</div></div></div>';

    document.getElementById('startSlitBtn').onclick = function () {
      var operator = document.getElementById('slitOperator').value.trim();
      var machine = isScroll ? (document.getElementById('slitMachineSel').value) : ('Slitter ' + document.getElementById('slitNum').value.trim());
      var picked = isScroll ? document.getElementById('slitMachineSel').value : document.getElementById('slitNum').value.trim();
      var notes = document.getElementById('slitNotes').value;
      if (!operator) { toast('Enter an operator name'); return; }
      if (!picked) { toast(isScroll ? 'Pick a scroll machine' : 'Enter the slitter number'); return; }
      var btn = this; btn.disabled = true; btn.textContent = 'Starting…';
      runMutation('createSlitterSession', [slitKind, machine, operator, notes, newOpId()],
        function (result) {
          currentSlitter = { sessionId: result.sessionId, slitter: result.slitter, kind: slitKind, operator: operator };
          slitPickMode = null; slitPendingStrips = 0;
          renderSlitterSession();
        },
        function (err) { toast('Error: ' + err.message); btn.disabled = false; btn.textContent = '+ Start ' + (isScroll ? 'Scroll' : 'Slitter') + ' Session'; });
    };

    ensureAllCache(function () {}); // warm the skid cache for the composition picker
    google.script.run.withSuccessHandler(function (sessions) {
      if (tok !== viewToken) return;
      renderOpenSlitList(sessions);
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      var el = document.getElementById('openSlitList');
      if (el) el.innerHTML = '<div class="sub">Error: ' + esc(err.message) + '</div>';
    }).getSlitterSessions(slitKind, '', 'open');
  }

  function renderOpenSlitList(sessions) {
    var el = document.getElementById('openSlitList');
    if (!el) return;
    if (!sessions || !sessions.length) { el.innerHTML = '<div class="sub">No open sessions. Start one above.</div>'; return; }
    var html = '';
    sessions.forEach(function (s) {
      html += '<div class="queue-item" style="padding:8px 0"><div style="min-width:0">' +
        '<div class="ticket-id" style="font-size:15px">' + esc(s.slitter) + ' <span class="sub" style="font-weight:400">' + esc(s.sessionId) + '</span></div>' +
        '<div class="sub">' + (s.palletCount || 0) + ' pallet(s) &middot; by ' + esc(s.operator) + ' &middot; ' + esc(s.createdOn) + '</div></div>' +
        '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-slresume="' + esc(s.sessionId) + '">Resume</button></div>';
    });
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('[data-slresume]'), function (btn) {
      btn.onclick = function () {
        var sid = btn.getAttribute('data-slresume');
        var s = sessions.filter(function (x) { return x.sessionId === sid; })[0];
        currentSlitter = { sessionId: s.sessionId, slitter: s.slitter, kind: s.kind || slitKind, operator: s.operator };
        slitPickMode = null; slitPendingStrips = 0;
        renderSlitterSession();
      };
    });
  }

  function renderSlitterSession() {
    state.view = 'slitterSession';
    showTabbar(false); showBack(true); setDept('Metals');
    var view = document.getElementById('view');
    var tok = nextViewToken();
    view.innerHTML = '<div class="loading">Loading session&hellip;</div>';
    ensureAllCache(function () {});
    google.script.run.withSuccessHandler(function (detail) {
      if (tok !== viewToken) return;
      renderSlitterSessionContent(view, detail);
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      view.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getSlitterDetail(currentSlitter.sessionId);
  }

  function renderSlitterSessionContent(view, detail) {
    var isOpen = (detail.status || 'Open') !== 'Finished';
    var html = '<div class="card"><div class="ticket-id">' + esc(detail.slitter) +
      ' <span class="badge ' + (isOpen ? 'inprogress' : 'used') + '">' + esc(detail.status || 'Open') + '</span>' +
      ' <span class="sub" style="font-weight:400">' + esc(detail.sessionId) + '</span></div>' +
      '<div class="sub">by ' + esc(detail.operator) + ' &middot; ' + esc(detail.createdOn) +
      (detail.notes ? ' &middot; ' + esc(detail.notes) : '') + '</div></div>';

    var unit = detail.unit || (detail.kind === 'Scroll' ? 'Strips' : 'Body Blanks');

    if (isOpen) {
      var active = detail.activeSkid;
      var coils = detail.palletCoils || [];
      var soFar = detail.palletStripsSoFar || 0;
      var coilsLine = coils.length
        ? '<div class="sub" style="margin-top:8px">On this pallet so far: ' + coils.map(function (c) { return esc(c.ticket || ('Mill ' + c.mill)) + ' (' + esc(c.strips) + ')'; }).join(' + ') + ' = <b>' + esc(soFar) + '</b> ' + esc(unit) + '</div>'
        : '';
      if (!active || slitPickMode === 'switch') {
        // ---- skid picker: initial load, or switching to the next skid mid-pallet ----
        var isSwitch = !!active && slitPickMode === 'switch';
        html += '<div class="card">' +
          '<h3 style="margin-top:0;font-size:16px">' + (isSwitch ? 'Load the next skid' : 'Load the skid you are cutting') + '</h3>' +
          (isSwitch ? '<div class="sub" style="margin-bottom:8px">Recorded <b>' + esc(slitPendingStrips) + '</b> ' + esc(unit) + ' on the pallet. Pick the next skid to keep cutting into the same pallet.</div>'
                    : '<div class="sub" style="margin-bottom:8px">Search the ticket or skid number you are cutting from.</div>') +
          '<div class="searchrow">' + searchBarHtml('slitSkidSearch') + '</div>' +
          '<div id="slitSkidPicker"></div>' +
          (isSwitch ? '<button class="btn secondary" id="cancelSwitchBtn" style="margin-top:10px">Cancel</button>' : '') +
        '</div>';
      } else {
        // ---- the two big buttons ----
        html += '<div class="card">' +
          '<div class="sub">Cutting from</div>' +
          '<div class="ticket-id" style="font-size:22px">' + esc(detail.activeTicket || active) +
            (detail.activeMill ? ' <span class="sub" style="font-weight:400">Mill ' + esc(detail.activeMill) + '</span>' : '') + '</div>' +
          coilsLine +
          '<button class="btn success" id="palletFullBtn" style="width:100%;padding:22px;font-size:20px;margin-top:16px">✅ PALLET FULL</button>' +
          '<button class="btn secondary" id="skidEmptyBtn" style="width:100%;padding:18px;font-size:17px;margin-top:10px">🔄 SKID EMPTY / SWITCH</button>' +
        '</div>';
      }
    }

    var pallets = detail.pallets || [];
    var pHtml = '';
    if (!pallets.length) {
      pHtml = '<div class="sub">No pallets made yet.</div>';
    } else {
      pallets.forEach(function (p) {
        var comp = (p.composition || []).map(function (c) { var st = (c.strips != null ? c.strips : c.qty); return esc(c.ticket || ('Mill ' + c.mill)) + ' (' + esc(st) + ')'; }).join(' + ');
        var mixed = (p.composition || []).length > 1 ? ' <span class="badge wip">mixed</span>' : '';
        var runnable = p.skidId ? ' &middot; runnable skid <b>' + esc(p.skidId) + '</b>' : '';
        var head = p.loadNo ? 'LOAD ' + esc(p.loadNo) : esc(p.palletId);
        pHtml += '<div class="queue-item"><div style="min-width:0">' +
          '<div class="ticket-id" style="font-size:16px">' + head + ' <span class="sub" style="font-weight:400">' + esc(p.outputCount) + ' ' + esc(unit) + '</span>' + mixed + '</div>' +
          '<div class="sub">' + (comp ? 'from ' + comp : 'no sources') + runnable + '</div></div>' +
          (isOpen ? '<button class="btn danger" style="padding:6px 10px;font-size:13px" data-pdel="' + esc(p.palletId) + '">Remove</button>' : '') +
          '</div>';
      });
    }
    html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Pallets made this session (' + pallets.length + ')</h3>' + pHtml + '</div>';

    if (isOpen) {
      html += '<div class="card"><button class="btn secondary" id="finishSlitBtn" style="width:100%">Finish session</button></div>';
    }

    view.innerHTML = html;
    if (!isOpen) return;

    var search = document.getElementById('slitSkidSearch');
    if (search) {
      renderSlitPicker('');
      search.oninput = function () { renderSlitPicker(search.value); };
    }
    var cancelSwitch = document.getElementById('cancelSwitchBtn');
    if (cancelSwitch) cancelSwitch.onclick = function () {
      slitPickMode = null; slitPendingStrips = 0;
      renderSlitterSessionContent(document.getElementById('view'), detail);
    };

    var fullBtn = document.getElementById('palletFullBtn');
    if (fullBtn) fullBtn.onclick = function () {
      showPromptModal({
        title: 'Pallet full', message: 'Count the pallet. How many ' + unit + ' are on it now?',
        inputLabel: unit + ' on the pallet', placeholder: 'e.g. 50', confirmText: 'Save pallet',
        onConfirm: function (val) {
          var strips = Number(val) || 0;
          if (strips <= 0) { toast('Enter the ' + unit + ' count'); return; }
          runMutation('slitterFinishPallet', [currentSlitter.sessionId, strips, '', currentSlitter.operator, newOpId()],
            function (updated) {
              if (updated && updated.newLoadNo) {
                showInfo('Pallet done — LOAD ' + updated.newLoadNo, 'Write "LOAD ' + updated.newLoadNo + '" on the pallet. That is now its ticket number.');
              } else if (updated && updated.duplicate) { toast('Already saved'); }
              slitPickMode = null; slitPendingStrips = 0;
              // Refresh the shared cache so the new runnable Cut skid appears in the Line/Press picker.
              google.script.run.withSuccessHandler(function (all) { setCaches(all); }).getAllTickets();
              renderSlitterSessionContent(document.getElementById('view'), updated);
            },
            function (err) { toast('Error: ' + err.message); });
        }
      });
    };

    var emptyBtn = document.getElementById('skidEmptyBtn');
    if (emptyBtn) emptyBtn.onclick = function () {
      showPromptModal({
        title: 'Skid empty', message: 'This skid ran out. Count the pallet — how many ' + unit + ' are on it right now?',
        inputLabel: unit + ' on the pallet', placeholder: 'e.g. 30', confirmText: 'Pick next skid',
        onConfirm: function (val) {
          var strips = Number(val);
          if (isNaN(strips) || strips < 0) { toast('Enter the ' + unit + ' count'); return; }
          slitPendingStrips = strips;
          slitPickMode = 'switch';
          renderSlitterSessionContent(document.getElementById('view'), detail);
        }
      });
    };

    document.getElementById('finishSlitBtn').onclick = function () {
      showConfirm('Finish session', 'Finish ' + currentSlitter.sessionId + '? Any pallet still being cut is not saved.', function () {
        runMutation('finishSlitterSession', [currentSlitter.sessionId, currentSlitter.operator, newOpId()],
          function () { toast('Session finished'); openMetalsSection('slitter'); },
          function (err) { toast('Error: ' + err.message); });
      }, 'Finish');
    };

    Array.prototype.forEach.call(view.querySelectorAll('[data-pdel]'), function (btn) {
      btn.onclick = function () {
        var pid = btn.getAttribute('data-pdel');
        showConfirm('Remove pallet', 'Remove ' + pid + ' from this session?', function () {
          runMutation('removeSlitterPallet', [currentSlitter.sessionId, pid, currentSlitter.operator, newOpId()],
            function (updated) { toast('Pallet removed'); renderSlitterSessionContent(document.getElementById('view'), updated); },
            function (err) { toast('Error: ' + err.message); });
        }, 'Remove', 'danger');
      };
    });
  }

  // Picker for loading / switching the source skid being cut. Loadable = active inventory skids
  // (Current / WIP / Pending); cut pallets and spent (Used / In Production / Missing) skids are hidden.
  function renderSlitPicker(term) {
    var c = document.getElementById('slitSkidPicker');
    if (!c) return;
    term = (term || '').trim().toLowerCase();
    var rows = allCache.filter(function (t) {
      if (t.cutType) return false;
      if (['Used', 'In Production', 'Missing'].indexOf(t.status) !== -1) return false;
      if (!term) return false;
      return String(t.ticket).toLowerCase().indexOf(term) !== -1 || String(t.skidId).toLowerCase().indexOf(term) !== -1;
    }).slice(0, 10);
    if (!rows.length) { c.innerHTML = '<div class="sub">' + (term ? 'No skids match.' : 'Type a ticket or skid number to find it.') + '</div>'; return; }
    var html = '';
    rows.forEach(function (t) {
      html += '<div class="queue-item" style="padding:6px 0"><div style="min-width:0">' +
        '<span class="ticket-id" style="font-size:15px">' + esc(t.ticket) + '</span> ' +
        '<span class="sub">Mill ' + esc(t.mill || '?') + (t.endUse ? ' &middot; ' + esc(t.endUse) : '') + '</span></div>' +
        '<button class="btn success" style="padding:8px 14px" data-suse="' + esc(t.skidId) + '">Load</button></div>';
    });
    c.innerHTML = html;
    Array.prototype.forEach.call(c.querySelectorAll('[data-suse]'), function (b) {
      b.onclick = function () {
        var sk = b.getAttribute('data-suse');
        b.disabled = true;
        if (slitPickMode === 'switch') {
          runMutation('slitterSwitchSkid', [currentSlitter.sessionId, slitPendingStrips, sk, currentSlitter.operator, newOpId()],
            function (updated) {
              slitPickMode = null; slitPendingStrips = 0;
              // An emptied source flipped to Used — refresh the shared cache.
              google.script.run.withSuccessHandler(function (all) { setCaches(all); }).getAllTickets();
              renderSlitterSessionContent(document.getElementById('view'), updated);
            },
            function (err) { toast('Error: ' + err.message); b.disabled = false; });
        } else {
          runMutation('slitterLoadSkid', [currentSlitter.sessionId, sk, currentSlitter.operator, newOpId()],
            function (updated) {
              slitPickMode = null;
              renderSlitterSessionContent(document.getElementById('view'), updated);
            },
            function (err) { toast('Error: ' + err.message); b.disabled = false; });
        }
      };
    });
  }

  // boot
  boot();
</script>
