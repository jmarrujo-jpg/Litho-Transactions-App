<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --ink: #131b2e;
    --muted: #6b7280;
    --line: #dfe3ea;
    --accent: #0f2350;      /* navy sampled from the logo */
    --accent-dark: #0a1836;
    --good: #0f7a3d;
    --bg: #eef1f6;
    --card: #ffffff;
    --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  #app { max-width: 900px; margin: 0 auto; padding: 16px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; flex-wrap: wrap; gap: 8px; position: relative;
    border-bottom: 3px solid var(--accent); padding-bottom: 10px;
  }
  .dept {
    flex: 1; text-align: center; min-width: 0; font-size: 16px; font-weight: 700;
    color: var(--accent); pointer-events: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo { height: 40px; width: auto; flex: 0 0 auto; display: block; }
  header h1 { font-size: 20px; margin: 0; color: var(--accent); letter-spacing: .2px; }
  .header-right { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .header-right a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .version { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  header button {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; cursor: pointer;
  }
  .tabbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabbar button {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--muted);
  }
  .tabbar button.active { background: var(--accent); color: white; border-color: var(--accent); }
  .searchrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .searchwrap { position: relative; flex: 1; min-width: 0; height: 48px; }
  .searchwrap input {
    width: 100%; height: 48px; padding: 0 14px 0 42px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
  }
  .searchwrap input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 35, 80, .16);
  }
  .searchwrap .mag {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; pointer-events: none;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
  }
  .queue-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; cursor: pointer;
  }
  .queue-item + .queue-item { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .ticket-id { font-weight: 700; font-size: 16px; }
  .sub { color: var(--muted); font-size: 13px; }
  .specs { color: var(--ink); font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .specs b { color: var(--muted); font-weight: 600; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .badge.notstarted { background: #eef2ff; color: #3730a3; }
  .badge.inprogress { background: #fff7e6; color: var(--warn); }
  .badge.wip { background: #eafaf0; color: var(--good); }
  .badge.production { background: #e8edf8; color: #1e3a8a; }
  .badge.used { background: #edeff2; color: #4b5563; }
  .bwtag {
    display: inline-block; background: var(--accent); color: #fff; border-radius: 6px;
    padding: 2px 9px; font-weight: 700; font-size: 13px; margin-right: 8px; white-space: nowrap;
  }
  .btn {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.success { background: var(--good); }
  .btn.danger { background: #c0392b; }
  .btn.danger:hover { background: #a5311f; }
  .btn.warn { background: #b26a00; }
  .btn.warn:hover { background: #935700; }
  .ticket-link { color: var(--accent); font-weight: 600; text-decoration: underline; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .colgrid { display: flex; gap: 16px; flex-wrap: wrap; }
  .colstack { flex: 1; min-width: 150px; }
  .colstack .field { min-width: 0; }
  .field { flex: 1; min-width: 160px; margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field select, .field input, .field textarea {
    width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px;
  }
  .stat { text-align: center; }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .steel-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 13px; }
  .steel-meta div span { display: block; color: var(--muted); font-size: 11px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 10px 18px; border-radius: 8px; font-size: 14px;
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .dbtable { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  .dbtable th, .dbtable td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .dbtable thead th { background: var(--card); position: sticky; top: 0; font-weight: 700; }
  .dbtable tbody tr { cursor: pointer; }
  .dbtable tbody tr:hover td { background: #eef2ff; }
  .dbtable .dbsticky { position: sticky; left: 0; background: var(--card); z-index: 1; }
  .gate { max-width: 380px; margin: 60px auto; text-align: center; }
  .gate h2 { margin-bottom: 4px; }
  .gate p { color: var(--muted); font-size: 14px; margin-top: 0; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(19, 27, 46, .55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000;
  }
  .modal {
    background: var(--card); border-radius: 16px; max-width: 440px; width: 100%;
    padding: 24px; box-shadow: 0 16px 48px rgba(10, 24, 54, .35);
  }
  .modal .modal-icon {
    width: 46px; height: 46px; border-radius: 50%; background: #eafaf0; color: var(--good);
    display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px;
  }
  .modal h3 { margin: 0 0 8px; color: var(--ink); font-size: 19px; }
  .modal p { color: var(--muted); font-size: 15px; margin: 0 0 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* Wide content (tables) scrolls inside its card instead of stretching the page. */
  .card { overflow-x: auto; }

  /* Phone-friendly: bigger text/targets, no accidental horizontal scroll, 16px inputs so
     iOS doesn't zoom on focus. */
  @media (max-width: 600px) {
    body { font-size: 16px; }
    #app { padding: 10px; }
    header h1 { font-size: 17px; }
    .dept { font-size: 14px; }
    .brand .logo { height: 32px; }
    .brand { gap: 8px; }
    .card { padding: 13px; }
    .field select, .field input, .field textarea { font-size: 16px; padding: 12px; }
    .btn { padding: 14px 16px; font-size: 16px; }
    .tabbar { gap: 6px; }
    .tabbar button { padding: 12px 4px; font-size: 13px; }
    .ticket-id { font-size: 15px; }
    .sub { font-size: 13px; }
    .specs { font-size: 12px; }
    table { font-size: 12.5px; }
    th, td { padding: 6px 6px; }
    .searchwrap input { font-size: 16px; }
  }

  /* Printable check sheet (hidden on screen; shown only when printing / Save as PDF).
     Styled to mirror the Container Supply paper check sheet: company header, right-aligned
     title, BW color-coded packed columns, a center check column. print-color-adjust:exact
     keeps the BW colors + navy header from being stripped by the browser's print engine. */
  #printArea { display: none; }
  @media print {
    @page { size: letter portrait; margin: 0.5in; }
    #app, #toast, #modalRoot, datalist { display: none !important; }
    #printArea { display: block !important; color: #000; }
    #printArea .cs-date { font-size: 8pt; color: #646464; }
    #printArea .cs-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 3px; }
    #printArea .cs-co { font-size: 14pt; font-weight: bold; color: #141414; }
    #printArea .cs-title { font-size: 11pt; color: #323232; }
    #printArea .cs-rule { border: 0; border-top: 0.75pt solid #505050; margin: 4px 0 8px; }
    #printArea table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    #printArea th { background: #193264; color: #fff; font-size: 7pt; font-weight: bold; text-align: center;
      padding: 3px 2px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #printArea td { font-size: 8pt; border: 0.5pt solid #cfcfcf; padding: 2px 3px; text-align: center;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #printArea td.tk, #printArea th.tk { text-align: left; }
    #printArea td.bw { font-weight: bold; }
    #printArea .cs-sep { border-left: 1.5pt solid #9fb0cc; }
    #printArea .ckbox { display: inline-block; width: 12px; height: 12px; border: 1px solid #777;
      line-height: 11px; font-size: 9pt; color: #0a7a26; font-weight: bold; }
    #printArea h2 { margin: 0 0 4px; font-size: 16pt; }
    #printArea .pmeta { font-size: 9pt; color: #555; margin-bottom: 8px; }
  }
</style>

  function boot() {
    loadOperatorNames();
    loadRateData();
    renderLanding();
  }

  function showTabbar(show) { document.getElementById('tabbar').style.display = show ? 'flex' : 'none'; }
  function showBack(show) { document.getElementById('backBtn').style.display = show ? 'inline-block' : 'none'; }
  function setDept(name) { var el = document.getElementById('deptLabel'); if (el) el.textContent = name || ''; }

  // Single Back handler routed by the current view. The app has three top-level screens
  // (landing -> Litho / Production), each with their own drill-ins.
  document.getElementById('backBtn').onclick = function () {
    // Drilled into a ticket from a job? Back returns to that job.
    if (state.view === 'card' && state.returnToJobId) {
      var jid = state.returnToJobId; state.returnToJobId = null;
      openJob(jid);
      return;
    }
    // Drilled into a ticket from the global Search screen? Back returns to Search.
    if (state.view === 'card' && state.returnToSearch) {
      state.returnToSearch = false;
      openSearch();
      return;
    }
    switch (state.view) {
      case 'all': renderLanding(); return;                 // litho list -> landing
      case 'search': renderLanding(); return;              // global search -> landing
      case 'reports': renderLanding(); return;
      case 'count':
        // Within a count, Back steps back through the sub-screens before leaving.
        if (countMode === 'reviewPromote' || countMode === 'reviewMissing') { countMode = 'walk'; renderCount(); return; }
        if (countMode === 'missing' || countMode === 'history') { countMode = countSummary ? 'summary' : 'walk'; renderCount(); return; }
        renderLanding(); return;
      case 'card': case 'review': case 'job': case 'createJob': case 'addTicket': openLitho(); return;
      case 'metalsHome': renderLanding(); return;          // department chooser -> landing
      case 'prodHome': case 'slitterHome': case 'usedHome': openProduction(); return; // a section home -> chooser
      case 'prodAdd': case 'prodReview': openMetalsSection(metalsTab); return;
      case 'prodPartials': renderRunAddSkids(); return;
      case 'run': openProductionReview(); return;
      case 'slitterSession': openMetalsSection('slitter'); return; // slitter detail -> slitter home
      case 'database': renderLanding(); return;            // database home -> landing
      case 'databaseEdit': renderDatabaseHome(); return;   // row editor -> database home
      default: renderLanding(); return;
    }
  };

  // ---------------- Landing screen (three departments) ----------------
  function renderLanding() {
    state.view = 'home'; state.skid = null; state.jobId = null; state.runId = null;
    nextViewToken();
    showTabbar(false); showBack(false); setDept('');
    var view = document.getElementById('view');
    view.innerHTML =
      '<button class="btn secondary" id="tileSearch" style="width:100%;padding:22px;font-size:18px;margin-bottom:12px">🔎&nbsp; Search for a Ticket</button>' +
      '<button class="btn" id="tileLitho" style="width:100%;padding:26px;font-size:20px;margin-bottom:12px">Litho Department</button>' +
      '<button class="btn" id="tileProduction" style="width:100%;padding:26px;font-size:20px;margin-bottom:12px">Metals Department</button>' +
      '<button class="btn secondary" id="tileReports" style="width:100%;padding:22px;font-size:18px;margin-bottom:12px">📊&nbsp; Reports</button>' +
      '<button class="btn secondary" id="tileCount" style="width:100%;padding:22px;font-size:18px;margin-bottom:12px">🧮&nbsp; Litho Steel Count</button>' +
      '<button class="btn secondary" id="tileDatabase" style="width:100%;padding:22px;font-size:18px">🗄️&nbsp; Database</button>';
    document.getElementById('tileSearch').onclick = openSearch;
    document.getElementById('tileLitho').onclick = openLitho;
    document.getElementById('tileProduction').onclick = openProduction;
    document.getElementById('tileReports').onclick = openReports;
    document.getElementById('tileCount').onclick = openSteelCount;
    document.getElementById('tileDatabase').onclick = openDatabase;
  }

  // ---------------- Database (raw table audit / manual edit) ----------------
  // A spreadsheet-like admin view of the underlying tabs, read/written BY COLUMN NAME so it matches
  // exactly what the app uses (even where the sheet header has stray duplicate columns). Two tables:
  // Steel Tickets and the Transactions audit log. Tap a row to edit its fields and save back.
  var DB_TABLE_TABS = [['steel', 'Steel Tickets'], ['tx', 'Transactions']];
  var DB_ROW_CAP = 60;                          // rows rendered at once (search to narrow beyond this)
  var dbTable = 'steel';
  var dbData = { steel: null, tx: null };       // cache: { headers, rows }
  var dbSearch = '';
  var DB_CODE = '1245';                          // passcode to open the Database tab
  var dbUnlocked = false;                        // stays unlocked for the rest of the session once entered

  function openDatabase() {
    if (!dbUnlocked) {
      showPromptModal({
        title: 'Database — enter code', message: 'This area is protected.',
        inputLabel: 'Code', placeholder: '••••', confirmText: 'Unlock',
        onConfirm: function (v) {
          if (String(v) === DB_CODE) { dbUnlocked = true; openDatabase(); }
          else { toast('Incorrect code'); }
        }
      });
      return;
    }
    state.view = 'database';
    nextViewToken();
    showTabbar(false); showBack(true); setDept('Database');
    dbSearch = '';
    renderDatabaseHome();
  }

  function renderDatabaseHome() {
    state.view = 'database';
    var view = document.getElementById('view');
    if (!view) return;
    nextViewToken();
    var chips = DB_TABLE_TABS.map(function (c) {
      return '<button data-dbt="' + c[0] + '"' + (dbTable === c[0] ? ' class="active"' : '') + '>' + esc(c[1]) + '</button>';
    }).join('');
    view.innerHTML =
      '<div class="tabbar">' + chips + '</div>' +
      '<div class="row" style="align-items:flex-end;gap:8px">' +
        '<div class="field" style="flex:1;margin:0"><label>Search this table</label><input id="dbSearch" placeholder="filter any column…" autocomplete="off" value="' + esc(dbSearch) + '"></div>' +
        '<button class="btn secondary" id="dbReload" style="margin:0">↻</button>' +
      '</div>' +
      '<div class="sub" id="dbCount" style="margin:8px 0"></div>' +
      '<div id="dbTableBox" style="overflow-x:auto;-webkit-overflow-scrolling:touch"></div>' +
      '<div class="card" style="margin-top:16px">' +
        '<h3 style="margin-top:0;font-size:15px">Snapshots</h3>' +
        '<div class="sub">A snapshot of the Current + WIP + Pending rows is saved automatically to your <b>Litho Snapshots</b> spreadsheet every weekday at 3 PM. No action needed.</div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;border:1px solid #b26a00">' +
        '<h3 style="margin-top:0;font-size:15px">Fresh start — import from Current + WIP tabs</h3>' +
        '<div class="sub" style="margin-bottom:10px">Paste your Access data into two tabs named <b>Current</b> and <b>WIP</b> in this spreadsheet. This rebuilds <b>Steel Tickets</b> from those tabs: each row becomes a clean skid (fresh Skid ID; Status from which tab it came from) in single, non-duplicated columns.</div>' +
        '<div class="sub" style="margin-bottom:10px;color:#b26a00"><b>This wipes the current Steel Tickets tab and the Transactions audit log</b> and replaces them. Make a backup copy of the sheet first (File → Make a copy). Re-run it any time you refresh the Access data.</div>' +
        '<button class="btn warn" id="dbImportBtn" style="width:100%">Wipe &amp; import from Current + WIP</button>' +
      '</div>';
    Array.prototype.forEach.call(view.querySelectorAll('[data-dbt]'), function (b) {
      b.onclick = function () { dbTable = b.getAttribute('data-dbt'); dbSearch = ''; renderDatabaseHome(); };
    });
    var s = document.getElementById('dbSearch');
    s.oninput = function () { dbSearch = s.value; renderDbTable(); };
    document.getElementById('dbReload').onclick = function () { dbData[dbTable] = null; loadDbAndRender(); };
    document.getElementById('dbImportBtn').onclick = dbFreshImport;
    loadDbAndRender();
  }

  // Fresh-start import: wipe Steel Tickets + audit log and rebuild from the Current/WIP staging tabs.
  function dbFreshImport() {
    showConfirm('Wipe and re-import from Current + WIP?',
      'This DELETES everything in Steel Tickets and Transactions, then rebuilds Steel Tickets from the Current and WIP tabs. Make sure you have a backup copy of the sheet. Continue?',
      function () {
        var btn = document.getElementById('dbImportBtn');
        if (btn) { btn.disabled = true; btn.textContent = 'Importing…'; }
        runMutation('importStaging', [newOpId()],
          function (res) {
            var cur = (res && res.current) || 0, wip = (res && res.wip) || 0, total = (res && res.total) || 0;
            allCache = []; dbData.steel = null; dbData.tx = null;   // force a full reload
            ensureAllCache(function () {});
            showInfo('Import complete',
              'Imported ' + total + ' skid' + (total === 1 ? '' : 's') + ' — ' + cur + ' Current, ' + wip + ' WIP.' +
              (res && res.firstSkid ? ' Skid IDs ' + res.firstSkid + '–' + res.lastSkid + '.' : ''),
              function () { renderDatabaseHome(); });
          },
          function (err) {
            toast('Import failed: ' + (err && err.message ? err.message : 'unknown error'));
            var b2 = document.getElementById('dbImportBtn');
            if (b2) { b2.disabled = false; b2.textContent = 'Wipe & import from Current + WIP'; }
          });
      }, 'Wipe & import', 'danger');
  }

  function loadDbAndRender() {
    if (dbData[dbTable]) { renderDbTable(); return; }
    var box = document.getElementById('dbTableBox');
    if (box) box.innerHTML = '<div class="loading">Loading&hellip;</div>';
    var key = dbTable;
    google.script.run.withSuccessHandler(function (res) {
      dbData[key] = (res && res.headers) ? { headers: res.headers, rows: res.rows || [] } : { headers: [], rows: [] };
      if (dbTable === key) renderDbTable();
    }).withFailureHandler(function (err) {
      if (box) box.innerHTML = '<div class="sub">Could not load: ' + esc(err && err.message) + '</div>';
    }).getRawTable(key);
  }

  function renderDbTable() {
    var box = document.getElementById('dbTableBox');
    var countEl = document.getElementById('dbCount');
    if (!box) return;
    var data = dbData[dbTable];
    if (!data) { box.innerHTML = '<div class="loading">Loading&hellip;</div>'; return; }
    var term = (dbSearch || '').trim().toLowerCase();
    var rows = data.rows;
    if (term) rows = rows.filter(function (r) {
      return data.headers.some(function (h) { return String(r[h] == null ? '' : r[h]).toLowerCase().indexOf(term) !== -1; });
    });
    var total = rows.length;
    var shown = rows.slice(0, DB_ROW_CAP);
    if (countEl) countEl.textContent = 'Showing ' + shown.length + ' of ' + total + (term ? ' matching' : '') + ' — tap a row to edit.';
    if (!shown.length) { box.innerHTML = '<div class="sub">No rows' + (term ? ' match “' + esc(term) + '”.' : '.') + '</div>'; return; }
    var th = '<th class="dbsticky">#</th>' + data.headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('');
    var trs = shown.map(function (r) {
      var tds = '<td class="dbsticky" style="font-weight:600">' + esc(r.__row) + '</td>' +
        data.headers.map(function (h) { return '<td>' + esc(r[h]) + '</td>'; }).join('');
      return '<tr data-dbrow="' + esc(r.__row) + '">' + tds + '</tr>';
    }).join('');
    box.innerHTML = '<table class="dbtable"><thead><tr>' + th + '</tr></thead><tbody>' + trs + '</tbody></table>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-dbrow]'), function (tr) {
      tr.onclick = function () {
        var rn = Number(tr.getAttribute('data-dbrow'));
        var rowObj = data.rows.filter(function (x) { return x.__row === rn; })[0];
        if (rowObj) renderDbEditor(rowObj);
      };
    });
  }

  function renderDbEditor(rowObj) {
    state.view = 'databaseEdit';
    var view = document.getElementById('view');
    if (!view) return;
    nextViewToken();
    var data = dbData[dbTable];
    var title = (dbTable === 'steel') ? (rowObj['Skid ID'] || rowObj['Ticket'] || ('Row ' + rowObj.__row)) : ('Row ' + rowObj.__row);
    var fieldsHtml = data.headers.map(function (h) {
      var v = rowObj[h] == null ? '' : rowObj[h];
      var big = String(v).length > 40 || h === 'Comments' || h === 'Notes' || h === 'Litho Notes';
      var input = big
        ? '<textarea class="dbf" data-f="' + esc(h) + '" rows="2">' + esc(v) + '</textarea>'
        : '<input class="dbf" data-f="' + esc(h) + '" value="' + esc(v) + '">';
      return '<div class="field" style="margin:0 0 8px"><label>' + esc(h) + '</label>' + input + '</div>';
    }).join('');
    view.innerHTML =
      '<div class="card">' +
        '<div class="row" style="justify-content:space-between;align-items:center">' +
          '<h3 style="margin:0">Edit ' + esc(title) + '</h3>' +
          '<span class="sub">sheet row ' + esc(rowObj.__row) + '</span>' +
        '</div>' +
        '<div class="sub" style="margin:6px 0 12px">Change any field and save — edits write straight to the sheet.</div>' +
        fieldsHtml +
        '<div class="row" style="gap:8px;margin-top:12px">' +
          '<button class="btn secondary" id="dbCancel" style="flex:1">Cancel</button>' +
          '<button class="btn success" id="dbSave" style="flex:2">Save changes</button>' +
        '</div>' +
      '</div>';
    document.getElementById('dbCancel').onclick = function () { renderDatabaseHome(); };
    document.getElementById('dbSave').onclick = function () { dbSaveEditor(rowObj); };
  }

  function dbSaveEditor(rowObj) {
    var view = document.getElementById('view');
    var fields = {};
    var changed = [];
    Array.prototype.forEach.call(view.querySelectorAll('.dbf'), function (el) {
      var h = el.getAttribute('data-f');
      var nv = el.value;
      var ov = rowObj[h] == null ? '' : String(rowObj[h]);
      if (String(nv) !== ov) { fields[h] = nv; changed.push(h); }
    });
    if (!changed.length) { toast('No changes to save'); return; }
    showConfirm('Save ' + changed.length + ' change' + (changed.length === 1 ? '' : 's') + '?',
      'Fields: ' + changed.join(', ') + '. This writes straight to the ' + (dbTable === 'steel' ? 'Steel Tickets' : 'Transactions') + ' sheet.',
      function () {
        var btn = document.getElementById('dbSave');
        if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
        runMutation('updateRawRow', [dbTable, rowObj.__row, fields, newOpId()],
          function (res) {
            var applied = (res && res.updated != null) ? res.updated : changed.length;
            Object.keys(fields).forEach(function (h) { rowObj[h] = fields[h]; });   // keep local cache in sync
            if (dbTable === 'steel') google.script.run.withSuccessHandler(function (all) { setCaches(all); }).getAllTickets();
            showInfo('Saved', applied + ' field' + (applied === 1 ? '' : 's') + ' updated.', function () { renderDatabaseHome(); });
          },
          function (err) { toast('Error: ' + err.message); var b2 = document.getElementById('dbSave'); if (b2) { b2.disabled = false; b2.textContent = 'Save changes'; } });
      });
  }

  // Opens the Litho department exactly as the app worked before: the combined ticket list
  // with its All / Current / Pending / WIP chips, plus New Job / Review Jobs.
  function openLitho() {
    state.view = 'all'; state.listView = 'all'; state.skid = null;
    nextViewToken();
    showTabbar(true); showBack(true); setDept('Litho');
    renderAll();
  }

  // ---------------- Global "Search for a Ticket" (across every department) ----------------
  // "All" covers the live inventory (Current / WIP / Pending). Skids that have gone through
  // production (Used / In Production) are their own ever-growing history, so they load only
  // when the operator taps "Used in production" — keeping the everyday search fast as the
  // Used pile grows over the years.
  var searchFilter = 'all';        // all | current | wip | pending
  var usedCache = null;            // null = not fetched yet; [] or [...] once loaded
  var searchUsedOpen = false;

  function openSearch() {
    state.view = 'search'; state.skid = null;
    enterDetailView(); setDept('Search');
    searchFilter = 'all';
    renderSearch();
  }

  function renderSearch() {
    state.view = 'search';
    var view = document.getElementById('view');
    var tok = nextViewToken();
    var chips = [['all', 'All'], ['current', 'Current'], ['wip', 'WIP'], ['pending', 'Pending']].map(function (c) {
      return '<button data-sfilter="' + c[0] + '"' + (searchFilter === c[0] ? ' class="active"' : '') + '>' + esc(c[1]) + '</button>';
    }).join('');
    view.innerHTML =
      '<div class="searchrow">' + searchBarHtml('globalSearch') + '</div>' +
      '<div class="tabbar" id="searchChips">' + chips + '</div>' +
      '<div class="sub" style="margin-bottom:8px">Live steel — Current, WIP and Pending.</div>' +
      '<div id="searchActiveList"><div class="loading">Loading tickets&hellip;</div></div>' +
      '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">' +
        '<button class="btn secondary" id="loadUsedBtn" style="width:100%">' +
          (searchUsedOpen ? '📦 Used in production' : '📦 Used in production — tap to load') + '</button>' +
        '<div class="sub" style="margin-top:6px">Skids consumed or on a machine now. Loaded on demand — this list grows over time.</div>' +
      '</div>' +
      '<div id="searchUsedList"></div>';

    var searchInput = document.getElementById('globalSearch');
    searchInput.oninput = function () { renderSearchActive(); if (searchUsedOpen) renderSearchUsed(); };
    Array.prototype.forEach.call(document.querySelectorAll('#searchChips button'), function (btn) {
      btn.onclick = function () {
        searchFilter = btn.getAttribute('data-sfilter');
        Array.prototype.forEach.call(document.querySelectorAll('#searchChips button'), function (b) {
          b.classList.toggle('active', b.getAttribute('data-sfilter') === searchFilter);
        });
        renderSearchActive();
      };
    });
    document.getElementById('loadUsedBtn').onclick = function () {
      searchUsedOpen = true;
      var btn = document.getElementById('loadUsedBtn');
      btn.textContent = '📦 Used in production';
      if (usedCache === null) {
        document.getElementById('searchUsedList').innerHTML = '<div class="loading">Loading used skids&hellip;</div>';
        google.script.run.withSuccessHandler(function (used) {
          usedCache = used || [];
          if (tok === viewToken) renderSearchUsed();
        }).withFailureHandler(function (err) {
          if (tok !== viewToken) return;
          document.getElementById('searchUsedList').innerHTML = '<div class="card empty">Error loading used skids: ' + esc(err.message) + '</div>';
        }).getUsedTickets();
      } else {
        renderSearchUsed();
      }
    };

    ensureAllCache(function () { if (tok === viewToken) renderSearchActive(); });
    if (allCache.length) renderSearchActive();
    if (searchUsedOpen && usedCache !== null) renderSearchUsed();
  }

  function searchTermMatch(t, term) {
    if (!term) return true;
    return String(t.ticket).toLowerCase().indexOf(term) !== -1 ||
           String(t.skidId).toLowerCase().indexOf(term) !== -1;
  }

  function renderSearchActive() {
    var container = document.getElementById('searchActiveList');
    if (!container) return;
    var si = document.getElementById('globalSearch');
    var term = (si ? si.value : '').trim().toLowerCase();
    var rows = allCache.filter(function (t) {
      if (t.status !== 'Current' && t.status !== 'WIP' && t.status !== 'Pending') return false;
      if (searchFilter === 'current' && t.status !== 'Current') return false;
      if (searchFilter === 'wip' && t.status !== 'WIP') return false;
      if (searchFilter === 'pending' && t.status !== 'Pending') return false;
      return searchTermMatch(t, term);
    });
    if (!rows.length) {
      container.innerHTML = '<div class="card empty">' + (term ? 'No live tickets match "' + esc(si.value) + '".' : 'No live tickets.') + '</div>';
      return;
    }
    var html = '<div class="card">';
    rows.forEach(function (t) { html += ticketRowHtml(t); });
    html += '</div>';
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll('.queue-item'), function (el) {
      el.onclick = function () { openCardFromSearch(el.getAttribute('data-skid')); };
    });
  }

  function renderSearchUsed() {
    var container = document.getElementById('searchUsedList');
    if (!container || usedCache === null) return;
    var si = document.getElementById('globalSearch');
    var term = (si ? si.value : '').trim().toLowerCase();
    var rows = usedCache.filter(function (t) { return searchTermMatch(t, term); });
    if (!rows.length) {
      container.innerHTML = '<div class="card empty" style="margin-top:10px">' +
        (term ? 'No used skids match "' + esc(si.value) + '".' : 'No used skids yet.') + '</div>';
      return;
    }
    var html = '<div class="card" style="margin-top:10px">';
    rows.forEach(function (t) { html += ticketRowHtml(t); });
    html += '</div>';
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll('.queue-item'), function (el) {
      el.onclick = function () { openCardFromSearch(el.getAttribute('data-skid')); };
    });
  }

  // ---------------- Reports (completed work by department, by day or range) ----------------
  var reportDept = 'all';
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  function openReports() {
    state.view = 'reports';
    nextViewToken();
    showTabbar(false); showBack(true); setDept('Reports');
    renderReports();
  }

  function renderReports() {
    state.view = 'reports';
    var view = document.getElementById('view');
    var today = todayStr();
    view.innerHTML =
      '<div class="card"><h3 style="margin-top:0">Reports</h3>' +
        '<div class="sub" style="margin-bottom:10px">See what each department completed for a day or a date range.</div>' +
        selectField('reportDeptSel', 'Department', [{ value: 'all', text: 'All departments' }, { value: 'litho', text: 'Litho' }, { value: 'lines', text: 'Metal Lines' }, { value: 'press', text: 'Press' }, { value: 'slitter', text: 'Slitter' }, { value: 'scrolls', text: 'Scrolls' }, { value: 'direct', text: 'Used in Production (direct)' }, { value: 'count', text: 'Count' }], reportDept) +
        '<div class="row">' +
          '<div class="field"><label>From</label><input type="date" id="reportFrom" value="' + esc(today) + '"></div>' +
          '<div class="field"><label>To</label><input type="date" id="reportTo" value="' + esc(today) + '"></div>' +
        '</div>' +
        '<div class="row" style="gap:8px;margin-bottom:10px">' +
          '<button class="btn secondary" id="reportToday" style="flex:1">Today</button>' +
          '<button class="btn secondary" id="reportWeek" style="flex:1">This week (Mon–Fri)</button>' +
        '</div>' +
        '<button class="btn" id="runReportBtn" style="width:100%">Generate report</button>' +
      '</div>' +
      '<div id="reportResults"></div>';

    var from = document.getElementById('reportFrom');
    var to = document.getElementById('reportTo');
    document.getElementById('reportToday').onclick = function () { from.value = todayStr(); to.value = todayStr(); };
    document.getElementById('reportWeek').onclick = function () {
      // Generalized work week: Monday through Friday of the current week (Sun counts as that week).
      var d = new Date();
      var mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      var fri = new Date(mon); fri.setDate(mon.getDate() + 4);
      from.value = ymd(mon); to.value = ymd(fri);
    };
    document.getElementById('runReportBtn').onclick = function () {
      var dept = document.getElementById('reportDeptSel').value || 'all';
      var f = from.value, t = to.value || from.value;
      if (!f) { toast('Pick a date'); return; }
      if (t < f) { toast('"To" is before "From"'); return; }
      reportDept = dept;
      var results = document.getElementById('reportResults');
      results.innerHTML = '<div class="loading">Building report&hellip;</div>';
      google.script.run
        .withSuccessHandler(function (r) { renderReportResults(r); })
        .withFailureHandler(function (err) { results.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>'; })
        .getDepartmentReport(f, t, dept);
    };
  }

  function renderReportResults(r) {
    var el = document.getElementById('reportResults');
    if (!el) return;
    var range = (r.start === r.end) ? r.start : (r.start + ' to ' + r.end);
    var sections = r.sections || [];
    var html = '';
    sections.forEach(function (sec) { html += reportSectionHtml(sec, range); });
    if (!html) html = '<div class="card empty">Nothing in this range.</div>';
    el.innerHTML = html;
  }

  // Render one department section. Columns are tailored per department; cut pallets show the parent
  // tickets + mills they were cut from, so lineage back to the mill is visible in the report.
  function reportSectionHtml(sec, range) {
    var rows = sec.rows || [];
    var html = '<div class="card"><h3 style="margin-top:0;font-size:15px">' + esc(sec.label) +
      ' <span class="sub" style="font-weight:400">&middot; ' + esc(range) + ' &middot; ' + rows.length + '</span></h3>';
    if (!rows.length) { return html + '<div class="sub">Nothing in this range.</div></div>'; }
    var head, body;
    if (sec.key === 'litho') {
      head = '<tr><th>Date</th><th>Ticket</th><th>Skid</th><th>By</th><th>Litho</th></tr>';
      body = rows.map(function (x) { return '<tr><td>' + esc(x.date) + '</td><td>' + esc(x.ticket || '(none)') + '</td><td class="sub">' + esc(x.skidId) + '</td><td>' + esc(x.by) + '</td><td>' + money(x.litho) + '</td></tr>'; }).join('');
    } else if (sec.key === 'lines' || sec.key === 'press') {
      head = '<tr><th>Date</th><th>Ticket</th><th>Skid</th><th>Machine</th><th>By</th><th>Sheets</th></tr>';
      body = rows.map(function (x) { return '<tr><td>' + esc(x.date) + '</td><td>' + esc(x.ticket || '(none)') + '</td><td class="sub">' + esc(x.skidId) + '</td><td>' + esc(x.machine) + '</td><td>' + esc(x.by) + '</td><td>' + esc(x.sheets) + '</td></tr>'; }).join('');
    } else if (sec.key === 'slitter' || sec.key === 'scrolls') {
      head = '<tr><th>Date</th><th>Load</th><th>Machine</th><th>By</th><th>Output</th><th>Cost</th><th>Litho</th><th>Cut from</th></tr>';
      body = rows.map(function (x) { return '<tr><td>' + esc(x.date) + '</td><td><b>LOAD ' + esc(x.loadNo) + '</b></td><td>' + esc(x.machine) + '</td><td>' + esc(x.by) + '</td><td>' + esc(x.output) + ' ' + esc(x.unit) + '</td><td>' + (x.cost ? money(x.cost) : '—') + '</td><td>' + (x.litho ? money(x.litho) : '—') + '</td><td class="sub">' + esc(x.from) + '</td></tr>'; }).join('');
    } else if (sec.key === 'direct') {
      head = '<tr><th>Date</th><th>Ticket</th><th>Skid</th><th>Mill</th><th>Cost</th><th>Litho</th></tr>';
      body = rows.map(function (x) { return '<tr><td>' + esc(x.date) + '</td><td>' + esc(x.ticket || '(none)') + '</td><td class="sub">' + esc(x.skidId) + '</td><td>' + esc(x.mill || '—') + '</td><td>' + (x.cost ? money(x.cost) : '—') + '</td><td>' + (x.litho ? money(x.litho) : '—') + '</td></tr>'; }).join('');
    } else if (sec.key === 'count') {
      head = '<tr><th>Date</th><th>Session</th><th>By</th><th>Current</th><th>Promoted</th><th>WIP</th><th>Missing</th></tr>';
      body = rows.map(function (x) { return '<tr><td>' + esc(x.date) + '</td><td class="sub">' + esc(x.sessionId) + '</td><td>' + esc(x.by) + '</td><td>' + esc(x.currentFound) + '</td><td>' + esc(x.promoted) + '</td><td>' + esc(x.wipFound) + '</td><td>' + esc(x.missing) + '</td></tr>'; }).join('');
    } else {
      head = '<tr><th>Date</th><th>Detail</th></tr>';
      body = rows.map(function (x) { return '<tr><td>' + esc(x.date) + '</td><td>' + esc(JSON.stringify(x)) + '</td></tr>'; }).join('');
    }
    return html + '<div style="overflow-x:auto"><table style="margin-top:8px"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>';
  }

  // ---------------- Steel Count (guided two-stage physical count) ----------------
  // A count session walks the floor in two stages: Stage 1 checks every Current pallet, then the
  // ones not found are moved to WIP; Stage 2 checks every WIP pallet, then the ones still not found
  // are marked Missing (kept in the system + on a restorable Missing list). Session state lives on
  // the server (Count Sessions tab) so a count can span days and resume on any device. "Found this
  // session" = a skid's Counted At date is on/after the session's start date.
  var countSort = 'bw';
  var countCache = [];
  var countGroups = [];
  var countSession = null;   // { sessionId, startedOn, startedBy, stage } or null when no count is running
  var countMode = 'walk';    // walk | reviewPromote | reviewMissing | summary | missing
  var countReviewSel = {};   // skidId -> bool selection on the review screens
  var countPromoted = {};    // skidId -> true for pallets promoted Current->WIP this session (Stage 2 badge)
  var countSummary = null;   // { foundCurrent, promoted, foundWip, missing, startedOn } shown after finishing

  function cmpNumeric(a, b) {
    var na = Number(a), nb = Number(b);
    var aNum = !isNaN(na) && String(a).trim() !== '';
    var bNum = !isNaN(nb) && String(b).trim() !== '';
    if (aNum && bNum) return na - nb;
    if (aNum) return -1;
    if (bNum) return 1;
    return String(a || '').localeCompare(String(b || ''), undefined, { numeric: true });
  }
  function cmpTicket(a, b) { return String(a || '').localeCompare(String(b || ''), undefined, { numeric: true }); }
  function setActiveBtn(ids, activeId) {
    ids.forEach(function (id) { var b = document.getElementById(id); if (b) b.classList.toggle('active', id === activeId); });
  }

  // Which status the current walk is counting, and whether a skid was found in this session.
  function countWalkStatus() { return (countSession && countSession.stage === 'WIP') ? 'WIP' : 'Current'; }
  function countIsFound(t) { return !!(countSession && t.countedOn && t.countedOn >= countSession.startedOn); }
  function countSetStatus(id, status) {
    var t = countCache.filter(function (x) { return x.skidId === id; })[0];
    if (t) t.status = status;
  }

  function openSteelCount() {
    state.view = 'count'; nextViewToken();
    showTabbar(false); showBack(true); setDept('Steel Count');
    countCache = []; countSession = null; countMode = 'walk'; countPromoted = {}; countSummary = null;
    document.getElementById('view').innerHTML = '<div class="card"><div class="loading">Loading count&hellip;</div></div>';
    refreshCount();
  }

  // Load the active session (if any) + all tickets, then render whatever mode we're in.
  function refreshCount(after) {
    var tok = viewToken;
    function loadTickets() {
      google.script.run.withSuccessHandler(function (all) {
        if (tok !== viewToken) return;
        countCache = all || [];
        if (after) after(); else renderCount();
      }).withFailureHandler(function (err) {
        if (tok !== viewToken) return;
        document.getElementById('view').innerHTML = '<div class="card empty">Error loading steel: ' + esc(err.message) + '</div>';
      }).getAllTickets();
    }
    google.script.run.withSuccessHandler(function (sess) {
      if (tok !== viewToken) return;
      countSession = sess || null;
      loadTickets();
    }).withFailureHandler(function () {
      // Worker without getActiveCount (not yet redeployed): degrade gracefully to no session.
      if (tok !== viewToken) return;
      countSession = null; loadTickets();
    }).getActiveCount();
  }

  function renderCount() {
    state.view = 'count';
    if (countMode === 'missing') return renderCountMissing();
    if (countMode === 'history') return renderCountHistory();
    if (countMode === 'summary') return renderCountSummary();
    if (countMode === 'reviewPromote' || countMode === 'reviewMissing') return renderCountReview();
    if (!countSession) return renderCountStart();
    return renderCountWalk();
  }

  // ----- Start / resume screen -----
  function renderCountStart() {
    var missing = countCache.filter(function (t) { return (t.status || '') === 'Missing'; });
    var view = document.getElementById('view');
    view.innerHTML =
      '<div class="card"><h3 style="margin-top:0">Steel Count</h3>' +
        '<div class="sub" style="margin-bottom:10px">A count runs in two stages. First, walk the floor and check off every <strong>Current</strong> pallet. Any you can\'t find are moved to <strong>WIP</strong>, then you walk again. Whatever still isn\'t found goes on the <strong>Missing</strong> list.</div>' +
        operatorFieldHtml('countOperator', 'Who\'s counting?') +
        '<button class="btn" id="countStartBtn" style="width:100%;margin-top:10px;padding:16px;font-size:17px">Start count</button>' +
      '</div>' +
      '<div class="card"><div class="row" style="align-items:center;gap:10px">' +
        '<div style="flex:1"><strong>Missing list</strong><div class="sub">' + missing.length + ' pallet(s) not found in past counts</div></div>' +
        '<button class="btn secondary" id="countViewMissing" style="padding:10px 14px">View</button>' +
      '</div></div>' +
      '<div class="card"><div class="row" style="align-items:center;gap:10px">' +
        '<div style="flex:1"><strong>Past counts</strong><div class="sub">See saved counts and their tallies</div></div>' +
        '<button class="btn secondary" id="countViewHistory" style="padding:10px 14px">History</button>' +
      '</div>' +
        '<button class="btn secondary" id="countClearBtn" style="width:100%;margin-top:10px">Clear all checkmarks now</button>' +
        '<div class="sub" style="margin-top:6px">Finishing a count clears these automatically — use this only to reset a count you abandoned.</div>' +
      '</div>';
    document.getElementById('countStartBtn').onclick = function () {
      var op = ((document.getElementById('countOperator') || {}).value || lastOperator || '').trim();
      if (op) lastOperator = op;
      var btn = document.getElementById('countStartBtn'); btn.disabled = true; btn.textContent = 'Starting…';
      runMutation('startCount', [op, newOpId()], function (sess) {
        countSession = sess; countMode = 'walk'; countPromoted = {}; countSummary = null;
        renderCount();
      }, function (err) {
        showModal({ title: 'Could not start count', message: err.message, confirmText: 'OK' });
        btn.disabled = false; btn.textContent = 'Start count';
      });
    };
    document.getElementById('countViewMissing').onclick = function () { countMode = 'missing'; renderCount(); };
    document.getElementById('countViewHistory').onclick = function () { countMode = 'history'; renderCount(); };
    document.getElementById('countClearBtn').onclick = function () {
      showConfirm('Clear all checkmarks', 'This blanks every checkmark across all steel so the next count starts fresh. Continue?', function () {
        runMutation('clearAllCounts', [lastOperator, newOpId()], function (r) {
          countCache.forEach(function (t) { t.countedOn = ''; });
          toast('Cleared ' + ((r && r.cleared) || 0) + ' checkmark(s)');
        }, function (err) { showModal({ title: 'Could not clear', message: err.message, confirmText: 'OK' }); });
      }, 'Clear', 'danger');
    };
  }

  // ----- The walk (Stage 1 = Current, Stage 2 = WIP) -----
  function countRows() {
    var term = ((document.getElementById('countSearch') || {}).value || '').trim().toLowerCase();
    var st = countWalkStatus();
    return countCache.filter(function (t) {
      if ((t.status || 'Current') !== st) return false;
      if (term) {
        var hit = String(t.ticket).toLowerCase().indexOf(term) !== -1 ||
                  String(t.skidId).toLowerCase().indexOf(term) !== -1;
        if (!hit) return false;
      }
      return true;
    });
  }
  function updateCountProgress() {
    var rows = countRows();
    var counted = rows.filter(countIsFound).length;
    var prog = document.getElementById('countProgress');
    if (prog) prog.textContent = counted + ' of ' + rows.length + ' found';
  }
  function countSortedGroups() {
    var rows = countRows().slice();
    rows.sort(function (a, b) {
      if (countSort === 'bw') { var c = cmpNumeric(a.bw, b.bw); return c || cmpTicket(a.ticket, b.ticket); }
      var d = cmpNumeric(a.row, b.row); return d || cmpTicket(a.ticket, b.ticket);
    });
    var groups = [], byKey = {};
    rows.forEach(function (t) {
      var key = countSort === 'bw' ? ('BW ' + (t.bw || '—')) : ('Location ' + (t.row || '—'));
      if (!byKey[key]) { byKey[key] = { key: key, items: [] }; groups.push(byKey[key]); }
      byKey[key].items.push(t);
    });
    return groups;
  }

  function renderCountWalk() {
    var view = document.getElementById('view');
    var stage = countWalkStatus();
    var stageLabel = stage === 'WIP' ? 'Stage 2 of 2 — WIP count' : 'Stage 1 of 2 — Current count';
    var help = stage === 'WIP'
      ? 'Check off every WIP pallet you find. Highlighted pallets were just moved from Current — hunt for those. When done, tap Finish to mark whatever is left as Missing.'
      : 'Check off every Current pallet you find. When done, tap Finish to move the not-found ones to WIP.';
    view.innerHTML =
      '<div class="card"><div class="row" style="align-items:center;gap:8px">' +
          '<h3 style="margin:0;flex:1">Steel Count</h3>' +
          '<span class="badge ' + (stage === 'WIP' ? 'wip' : 'notstarted') + '">' + esc(stageLabel) + '</span>' +
        '</div>' +
        '<div class="sub" style="margin:6px 0 8px">' + esc(help) + '</div>' +
        '<div class="tabbar">' +
          '<button id="sortBw">By BW &rarr; Ticket</button><button id="sortLoc">By Location &rarr; Ticket</button>' +
        '</div>' +
        '<div class="row" style="align-items:center;margin-top:10px">' +
          '<div class="sub" id="countProgress" style="flex:1"></div>' +
          '<button class="btn secondary" id="countPrintBtn" style="padding:8px 12px;font-size:13px">🖨&nbsp; Print list</button>' +
        '</div>' +
      '</div>' +
      '<div id="countSearchBar" style="position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)">' +
        searchBarHtml('countSearch') +
      '</div>' +
      '<div id="countList"></div>' +
      '<div class="card" style="position:sticky;bottom:0;z-index:5">' +
        '<button class="btn ' + (stage === 'WIP' ? 'danger' : '') + '" id="countFinishBtn" style="width:100%;padding:14px;font-size:16px">' +
          (stage === 'WIP' ? 'Finish WIP count →' : 'Finish Current count →') +
        '</button>' +
        '<div class="sub" style="text-align:center;margin-top:6px">Count started ' + esc(countSession.startedOn) + (countSession.startedBy ? ' by ' + esc(countSession.startedBy) : '') + '</div>' +
      '</div>';
    setActiveBtn(['sortBw', 'sortLoc'], countSort === 'loc' ? 'sortLoc' : 'sortBw');
    document.getElementById('sortBw').onclick = function () { countSort = 'bw'; setActiveBtn(['sortBw', 'sortLoc'], 'sortBw'); renderCountList(); };
    document.getElementById('sortLoc').onclick = function () { countSort = 'loc'; setActiveBtn(['sortBw', 'sortLoc'], 'sortLoc'); renderCountList(); };
    document.getElementById('countSearch').oninput = function () { renderCountList(); };
    document.getElementById('countPrintBtn').onclick = printCount;
    document.getElementById('countFinishBtn').onclick = finishCountStage;
    renderCountList();
  }

  function renderCountList() {
    var el = document.getElementById('countList');
    if (!el) return;
    updateCountProgress();
    countGroups = countSortedGroups();
    if (!countGroups.length) { el.innerHTML = '<div class="card empty">No ' + esc(countWalkStatus()) + ' steel to count.</div>'; return; }
    var byLoc = countSort === 'loc'; // check-all only in location mode
    var inWip = countWalkStatus() === 'WIP';
    var html = '<div class="card">';
    countGroups.forEach(function (g, gi) {
      var allDone = g.items.every(countIsFound);
      html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px">' +
        '<span style="font-weight:700;color:var(--accent)">' + esc(g.key) + ' <span class="sub" style="font-weight:400">(' + g.items.length + ')</span></span>' +
        (byLoc ? '<button class="btn secondary" style="padding:5px 10px;font-size:12px" data-checkgroup="' + gi + '">' + (allDone ? 'Uncheck all' : 'Check all') + '</button>' : '') +
      '</div>';
      g.items.forEach(function (t) {
        var checked = countIsFound(t);
        var promoted = inWip && countPromoted[t.skidId];
        html += '<div class="queue-item" style="padding:6px 0' + (promoted ? ';background:var(--warnbg,rgba(255,196,0,.14));border-radius:8px;padding-left:8px;padding-right:8px' : '') + '">' +
          '<label style="display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;flex:1">' +
            '<input type="checkbox" class="countChk" data-skid="' + esc(t.skidId) + '" style="width:22px;height:22px;flex:0 0 auto"' + (checked ? ' checked' : '') + '>' +
            '<span style="min-width:0"><span class="bwtag">BW ' + esc(t.bw || '?') + '</span>' +
              (promoted ? '<span class="badge wip" style="margin-right:6px">from Current</span>' : '') +
              '<span class="ticket-id" style="font-size:15px">' + esc(t.ticket || '(no ticket)') + '</span>' +
              '<div class="sub">Loc ' + esc(t.row || '—') + ' &middot; ' + esc(t.qty || 0) + ' sheets</div></span>' +
          '</label>' +
          '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-countedit="' + esc(t.skidId) + '">Edit</button>' +
        '</div>' +
        '<div id="countEdit_' + esc(t.skidId) + '" style="display:none;padding:0 0 10px"></div>';
      });
    });
    html += '</div>';
    el.innerHTML = html;
    wireCountList();
  }

  function wireCountList() {
    Array.prototype.forEach.call(document.querySelectorAll('.countChk'), function (chk) {
      chk.onchange = function () {
        var sk = chk.getAttribute('data-skid');
        var checked = chk.checked;
        var op = lastOperator;
        var t = countCache.filter(function (x) { return x.skidId === sk; })[0];
        if (t) t.countedOn = checked ? todayStr() : ''; // optimistic
        updateCountProgress();
        runMutation('setSkidCounted', [sk, checked, op, newOpId()],
          function () {},
          function (err) {
            toast('Count not saved: ' + err.message);
            chk.checked = !checked;
            if (t) t.countedOn = !checked ? todayStr() : '';
            updateCountProgress();
          });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-countedit]'), function (btn) {
      btn.onclick = function () { openCountEdit(btn.getAttribute('data-countedit')); };
    });
    // Check / uncheck a whole location group in one bulk call (avoids a burst of Sheets reads).
    Array.prototype.forEach.call(document.querySelectorAll('[data-checkgroup]'), function (btn) {
      btn.onclick = function () {
        var g = countGroups[Number(btn.getAttribute('data-checkgroup'))];
        if (!g) return;
        var op = lastOperator;
        var want = !g.items.every(countIsFound); // all found -> uncheck all
        var stamp = want ? todayStr() : '';
        var ids = [];
        g.items.forEach(function (t) {
          if (countIsFound(t) === want) return; // already in desired state
          t.countedOn = stamp;
          ids.push(t.skidId);
        });
        renderCountList();
        if (ids.length) runMutation('setSkidsCounted', [ids, want, op, newOpId()], function () {},
          function (err) { toast('Count not saved: ' + err.message); });
      };
    });
  }

  function openCountEdit(sk) {
    var t = countCache.filter(function (x) { return x.skidId === sk; })[0];
    var form = document.getElementById('countEdit_' + sk);
    if (!form || !t) return;
    if (form.style.display === 'block') { form.style.display = 'none'; form.innerHTML = ''; return; }
    form.style.display = 'block';
    form.innerHTML =
      '<div class="row">' +
        '<div class="field"><label>Location</label><input id="ceLoc_' + esc(sk) + '" value="' + esc(t.row || '') + '"></div>' +
        '<div class="field"><label>Sheets (qty)</label><input type="number" id="ceQty_' + esc(sk) + '" min="0" value="' + esc(t.qty || 0) + '"></div>' +
      '</div>' +
      '<button class="btn success" id="ceSave_' + esc(sk) + '">Save</button> ' +
      '<button class="btn secondary" id="ceCancel_' + esc(sk) + '">Cancel</button>';
    document.getElementById('ceCancel_' + sk).onclick = function () { form.style.display = 'none'; form.innerHTML = ''; };
    document.getElementById('ceSave_' + sk).onclick = function () {
      var loc = document.getElementById('ceLoc_' + sk).value;
      var qty = document.getElementById('ceQty_' + sk).value;
      var op = lastOperator;
      if (qty !== '' && (isNaN(Number(qty)) || Number(qty) < 0)) { toast('Sheets must be 0 or more'); return; }
      var fields = { Row: loc };
      if (qty !== '') fields['QTY/LOAD'] = Number(qty);
      var btn = document.getElementById('ceSave_' + sk); btn.disabled = true; btn.textContent = 'Saving…';
      runMutation('updateTicketDetails', [sk, fields, op, newOpId()],
        function () {
          if (t) { t.row = loc; if (qty !== '') t.qty = Number(qty); }
          toast('Updated');
          renderCountList();
        },
        function (err) { showModal({ title: 'Could not save', message: err.message, confirmText: 'OK' }); btn.disabled = false; btn.textContent = 'Save'; });
    };
  }

  // ----- Finish a stage -> review the not-found pallets -----
  function finishCountStage() {
    var st = countWalkStatus();
    var notFound = countCache.filter(function (t) { return (t.status || 'Current') === st && !countIsFound(t); });
    countReviewSel = {};
    notFound.forEach(function (t) { countReviewSel[t.skidId] = true; }); // pre-select all
    countMode = (st === 'WIP') ? 'reviewMissing' : 'reviewPromote';
    renderCount();
  }
  function countReviewItems() {
    var st = (countMode === 'reviewMissing') ? 'WIP' : 'Current';
    return countCache.filter(function (t) { return (t.status || 'Current') === st && !countIsFound(t); })
      .sort(function (a, b) { var c = cmpNumeric(a.bw, b.bw); return c || cmpTicket(a.ticket, b.ticket); });
  }
  function renderCountReview() {
    var toMissing = countMode === 'reviewMissing';
    var items = countReviewItems();
    var view = document.getElementById('view');
    var title = toMissing ? 'Not found in WIP' : 'Not found in Current';
    var lead = toMissing
      ? 'These WIP pallets weren\'t found anywhere. Un-check any you don\'t want to mark Missing, then confirm. Missing pallets stay in the system on the Missing list — you can restore one if it turns up.'
      : 'These Current pallets weren\'t found. They were likely moved to WIP without being recorded. Un-check any you don\'t want to move, then confirm.';
    var html =
      '<div class="card"><h3 style="margin-top:0">' + esc(title) + '</h3>' +
        '<div class="sub" style="margin-bottom:8px">' + esc(lead) + '</div>';
    if (!items.length) {
      html += '<div class="empty" style="padding:12px 0">Every pallet was found — nothing to ' + (toMissing ? 'mark Missing' : 'move') + '. 🎉</div>';
    } else {
      html += '<div class="row" style="gap:8px;margin-bottom:6px">' +
        '<button class="btn secondary" id="revAll" style="padding:5px 10px;font-size:12px">Select all</button>' +
        '<button class="btn secondary" id="revNone" style="padding:5px 10px;font-size:12px">Select none</button></div>';
      items.forEach(function (t) {
        html += '<div class="queue-item" style="padding:6px 0">' +
          '<label style="display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;flex:1">' +
            '<input type="checkbox" class="revChk" data-skid="' + esc(t.skidId) + '" style="width:22px;height:22px;flex:0 0 auto"' + (countReviewSel[t.skidId] ? ' checked' : '') + '>' +
            '<span style="min-width:0"><span class="bwtag">BW ' + esc(t.bw || '?') + '</span>' +
              '<span class="ticket-id" style="font-size:15px">' + esc(t.ticket || '(no ticket)') + '</span>' +
              '<div class="sub">Loc ' + esc(t.row || '—') + ' &middot; ' + esc(t.qty || 0) + ' sheets</div></span>' +
          '</label></div>';
      });
    }
    html += '</div>' +
      '<div class="card" style="display:flex;gap:8px;position:sticky;bottom:0;z-index:5">' +
        '<button class="btn secondary" id="revBack" style="flex:1;padding:12px">Back to walk</button>' +
        '<button class="btn ' + (toMissing ? 'danger' : 'success') + '" id="revConfirm" style="flex:2;padding:12px;font-size:16px">' +
          (toMissing ? 'Mark selected Missing' : 'Move selected to WIP') +
        '</button>' +
      '</div>';
    view.innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.revChk'), function (chk) {
      chk.onchange = function () { countReviewSel[chk.getAttribute('data-skid')] = chk.checked; };
    });
    var all = document.getElementById('revAll'); if (all) all.onclick = function () { items.forEach(function (t) { countReviewSel[t.skidId] = true; }); renderCount(); };
    var none = document.getElementById('revNone'); if (none) none.onclick = function () { items.forEach(function (t) { countReviewSel[t.skidId] = false; }); renderCount(); };
    document.getElementById('revBack').onclick = function () { countMode = 'walk'; renderCount(); };
    document.getElementById('revConfirm').onclick = function () { confirmCountReview(items, toMissing); };
  }

  function failReview(btn, toMissing, err) {
    if (btn) { btn.disabled = false; btn.textContent = toMissing ? 'Mark selected Missing' : 'Move selected to WIP'; }
    showModal({ title: 'Could not save', message: err.message, confirmText: 'OK' });
  }
  function confirmCountReview(items, toMissing) {
    var ids = items.filter(function (t) { return countReviewSel[t.skidId]; }).map(function (t) { return t.skidId; });
    var op = lastOperator || (countSession && countSession.startedBy) || '';
    var btn = document.getElementById('revConfirm'); if (btn) { btn.disabled = true; btn.textContent = 'Working…'; }
    if (toMissing) {
      // Stage 2 finish: mark selected Missing (if any), then close the session and show the summary.
      var doDone = function () {
        var summ = {
          foundCurrent: countCache.filter(function (t) { return (t.status || '') === 'Current' && countIsFound(t); }).length,
          promoted: Object.keys(countPromoted).length,
          foundWip: countCache.filter(function (t) { return (t.status || '') === 'WIP' && countIsFound(t); }).length,
          missing: ids.length,
          startedOn: countSession.startedOn,
        };
        // Save the tallies on the session record + clear every checkmark for the next count.
        var serverSumm = { currentFound: summ.foundCurrent, promoted: summ.promoted, wipFound: summ.foundWip, missing: summ.missing };
        runMutation('endCount', [countSession.sessionId, op, serverSumm, newOpId()], function () {
          countSummary = summ; countMode = 'summary'; countSession = null;
          countCache.forEach(function (t) { t.countedOn = ''; }); // checkmarks cleared server-side too
          refreshCount(renderCount); // reload cache so Missing statuses are reflected on the Missing list
        }, function (err) { failReview(btn, toMissing, err); });
      };
      if (ids.length) {
        runMutation('markSkidsMissing', [ids, op, newOpId()], function () {
          ids.forEach(function (id) { countSetStatus(id, 'Missing'); });
          doDone();
        }, function (err) { failReview(btn, toMissing, err); });
      } else { doDone(); }
    } else {
      // Stage 1 finish: promote selected Current -> WIP (if any), then advance to Stage 2.
      var advance = function () {
        runMutation('setCountStage', [countSession.sessionId, 'WIP', op, newOpId()], function (sess) {
          countSession = sess || countSession; countSession.stage = 'WIP';
          countMode = 'walk';
          renderCount();
        }, function (err) { failReview(btn, toMissing, err); });
      };
      if (ids.length) {
        runMutation('promoteUnfoundToWip', [ids, op, newOpId()], function () {
          ids.forEach(function (id) { countSetStatus(id, 'WIP'); countPromoted[id] = true; });
          advance();
        }, function (err) { failReview(btn, toMissing, err); });
      } else { advance(); }
    }
  }

  // ----- Print check sheets (mirrors the Container Supply paper WIP/Current check sheet) -----
  // Each Basis Weight gets a stable color from this palette (sorted smallest->largest), so the
  // sheet reads the same way the paper one does.
  var BW_PALETTE = [[198,224,180],[155,194,230],[255,217,102],[255,200,80],[146,208,80],[0,176,240],
                    [112,173,71],[255,160,80],[100,160,220],[218,130,130],[180,140,210],[80,200,160]];
  function bwPaletteMap(records) {
    var bws = [];
    records.forEach(function (r) { var v = parseFloat(r.bw); if (!isNaN(v) && bws.indexOf(v) === -1) bws.push(v); });
    bws.sort(function (a, b) { return a - b; });
    var map = {};
    bws.forEach(function (bw, i) { map[bw] = BW_PALETTE[i % BW_PALETTE.length]; });
    return map;
  }
  function csDateStr() {
    return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  function csHeader(title) {
    return '<div class="cs-date">' + esc(csDateStr()) + '</div>' +
      '<div class="cs-head"><div class="cs-co">Container Supply Company, Inc.</div>' +
      '<div class="cs-title">' + esc(title) + '</div></div><hr class="cs-rule">';
  }
  // Footer (title left, page number right) via CSS paged-media margin boxes; harmless where unsupported.
  function csFooterStyle(title) {
    return '<style>@page { @bottom-left { content: "' + title + '"; font-size: 7pt; color: #646464; }' +
      ' @bottom-right { content: "Page " counter(page); font-size: 7pt; color: #646464; } }</style>';
  }

  function printCount() {
    var stage = countWalkStatus();
    var title = (stage === 'WIP' ? 'WIP' : 'Current') + ' Steel Check Sheet';
    // Whole list for this stage (ignore the on-screen search), in the current sort order.
    var records = countCache.filter(function (t) { return (t.status || 'Current') === stage; });
    records.sort(function (a, b) {
      if (countSort === 'bw') { var c = cmpNumeric(a.bw, b.bw); return c || cmpTicket(a.ticket, b.ticket); }
      var d = cmpNumeric(a.row, b.row); return d || cmpTicket(a.ticket, b.ticket);
    });
    var cmap = bwPaletteMap(records);
    var SETS = 3, R = Math.ceil(records.length / SETS) || 1;    // fill column-major into 3 sets

    var head = '<tr>';
    for (var s = 0; s < SETS; s++) {
      var sep = s ? ' cs-sep' : '';
      head += '<th class="bw' + sep + '">BW</th><th class="tk">Ticket</th><th>&#10003;</th><th>Loc</th>';
    }
    head += '</tr>';

    var rowsHtml = '';
    for (var i = 0; i < R; i++) {
      rowsHtml += '<tr>';
      for (var col = 0; col < SETS; col++) {
        var rec = records[i + col * R];
        var sep2 = col ? ' cs-sep' : '';
        if (rec) {
          var c2 = cmap[parseFloat(rec.bw)];
          var bg = c2 ? 'background:rgb(' + c2[0] + ',' + c2[1] + ',' + c2[2] + ')' : '';
          var chk = countIsFound(rec) ? '&#10003;' : '';
          rowsHtml += '<td class="bw' + sep2 + '" style="' + bg + '">' + esc(rec.bw || '') + '</td>' +
            '<td class="tk">' + esc(rec.ticket || '') + '</td>' +
            '<td><span class="ckbox">' + chk + '</span></td>' +
            '<td>' + esc(rec.row || '') + '</td>';
        } else {
          rowsHtml += '<td class="bw' + sep2 + '"></td><td></td><td></td><td></td>';
        }
      }
      rowsHtml += '</tr>';
    }

    var table = records.length
      ? '<table><thead>' + head + '</thead><tbody>' + rowsHtml + '</tbody></table>'
      : '<div>No ' + esc(stage) + ' steel to print.</div>';
    document.getElementById('printArea').innerHTML = csFooterStyle(title) + csHeader(title) + table;
    window.print();
  }

  function printMissing() {
    var title = 'Missing Steel List';
    var missing = countCache.filter(function (t) { return (t.status || '') === 'Missing'; })
      .sort(function (a, b) { var c = cmpNumeric(a.bw, b.bw); return c || cmpTicket(a.ticket, b.ticket); });
    var cmap = bwPaletteMap(missing);
    var head = '<tr><th class="bw">BW</th><th class="tk">Ticket</th><th>Loc</th><th>Sheets</th><th>Missing Since</th></tr>';
    var rows = '';
    missing.forEach(function (t) {
      var c = cmap[parseFloat(t.bw)];
      var bg = c ? 'background:rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')' : '';
      rows += '<tr><td class="bw" style="' + bg + '">' + esc(t.bw || '') + '</td>' +
        '<td class="tk">' + esc(t.ticket || '') + '</td><td>' + esc(t.row || '') + '</td>' +
        '<td>' + esc(t.qty || 0) + '</td><td>' + esc(t.missingOn || '') + '</td></tr>';
    });
    var table = missing.length
      ? '<table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>'
      : '<div>No missing pallets.</div>';
    document.getElementById('printArea').innerHTML = csFooterStyle(title) + csHeader(title) + table;
    window.print();
  }

  // ---- Skid traveler ---------------------------------------------------------------------
  // A one-page printout of everything done to a skid: ticket + steel specs + every coating
  // applied with its date and operator, plus a scannable Data Matrix label encoding the same.
  // Replaces the hand-written sheet; scan the label with a 2D imager to pull the ticket +
  // full coating/date history back out. Uses the same #printArea/window.print() flow as the
  // check sheets, so it inherits the app's print styles.
  function travelerDate(ts) { var m = String(ts || '').match(/\d{4}-\d{2}-\d{2}/); return m ? m[0] : String(ts || ''); }

  // Join each active coating pass to its transaction row (same passNumber) to recover the date
  // and operator, since the coating objects themselves carry no timestamp.
  function travelerCoatings(card) {
    var byPass = {};
    (card.transactions || []).forEach(function (t) { if (t.passNumber >= 1 && t.group) byPass[t.passNumber] = t; });
    return (card.coatings || []).map(function (c) {
      var t = byPass[c.passNumber] || {};
      return { passNumber: c.passNumber, item: c.item, group: c.group, sub: c.sub, cost: c.cost,
        when: t.timestamp || '', operator: t.operator || '' };
    });
  }

  // The label is 6in wide x 4in tall (landscape media), so the page is defined as 6in x 4in and the
  // traveler fills it directly — no rotation. All styles are scoped to `.trav` and use !important
  // where needed to override the app's generic #printArea print rules — in particular the
  // nowrap/ellipsis on table cells, which otherwise truncates the coatings. Pure black only,
  // since the label printer is 1-bit B/W.
  function travelerStyle() {
    return '<style>@media print {' +
      '@page { size: 6in 4in; margin: 0.12in; }' +
      '#printArea .trav { width: 5.76in; padding-top: 0.15in; color:#000; font-family:Arial,Helvetica,sans-serif; }' +
      '#printArea .trav, #printArea .trav * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }' +
      '#printArea .trav .top { display:flex; align-items:flex-start; gap:10px; }' +
      '#printArea .trav .tlogo { flex:none; height:0.62in; width:auto; }' +
      '#printArea .trav .hd { flex:1; min-width:0; }' +
      '#printArea .trav .co { font-size:8pt; font-weight:bold; }' +
      '#printArea .trav h2 { font-size:17pt; margin:2px 0 0; line-height:1; }' +
      '#printArea .trav .skid { font-size:9pt; font-weight:bold; margin-top:1px; }' +
      '#printArea .trav .dm { flex:none; text-align:center; }' +
      '#printArea .trav .dm svg { width:0.95in; height:0.95in; display:block; }' +
      '#printArea .trav table.specs { border-collapse:collapse; margin:5px 0 2px; width:100%; }' +
      '#printArea .trav table.specs td { border:0 !important; padding:0 4px 2px 0 !important; font-size:8pt; white-space:normal !important; overflow:visible !important; text-overflow:clip !important; text-align:left !important; }' +
      '#printArea .trav table.specs td.v { font-weight:bold; padding-right:14px !important; }' +
      '#printArea .trav hr { border:0; border-top:1pt solid #000; margin:3px 0; }' +
      '#printArea .trav .h3 { font-size:9.5pt; font-weight:bold; margin:3px 0 2px; }' +
      '#printArea .trav table.coats { width:100%; border-collapse:collapse; table-layout:fixed !important; }' +
      '#printArea .trav table.coats th { background:#000 !important; color:#fff !important; font-size:7pt; padding:2px 3px !important; text-align:left !important; white-space:normal !important; }' +
      '#printArea .trav table.coats td { border:0.5pt solid #000 !important; font-size:7.5pt; padding:2px 4px !important; text-align:left !important; white-space:normal !important; overflow:visible !important; text-overflow:clip !important; word-break:break-word; }' +
      '#printArea .trav table.coats td.n { text-align:center !important; }' +
      '#printArea .trav table.coats td.d { white-space:nowrap !important; }' +
      '}</style>';
  }

  function printTraveler(card) {
    var steel = card.steel || {};
    var coats = travelerCoatings(card);

    // Data Matrix payload: ticket, then each coating "item YYYY-MM-DD", pipe-separated.
    var payload = String(card.ticket || card.skidId || '');
    coats.forEach(function (c) { payload += '|' + (c.item || '') + ' ' + travelerDate(c.when); });
    var dm = '';
    try { dm = dataMatrixSVG(payload, 4, 2); } catch (e) { dm = ''; }

    // Steel specs as label/value pairs, laid out two per row so everything fits the label.
    var specs = [
      ['Ticket', card.ticket], ['Skid ID', card.skidId], ['Status', card.status],
      ['Basis Wt', steel['BW']], ['Type', steel['TC']], ['Temper', steel['TM']],
      ['Length', steel['Length']], ['Width', steel['Width']], ['End Use', steel['End Use']],
      ['Job', steel['Job ID']]
    ].filter(function (s) { return s[1] !== '' && s[1] != null; });
    // Three pairs per row — the landscape label is wide but short, so pack specs horizontally.
    var specRows = '';
    for (var i = 0; i < specs.length; i += 3) {
      var cells = '';
      for (var j = 0; j < 3; j++) {
        var s = specs[i + j];
        cells += s ? '<td>' + esc(s[0]) + '</td><td class="v">' + esc(s[1]) + '</td>' : '<td></td><td></td>';
      }
      specRows += '<tr>' + cells + '</tr>';
    }

    var rows = coats.map(function (c, i) {
      return '<tr><td class="n">' + (i + 1) + '</td><td>' + esc(c.item || '') + '</td>' +
        '<td>' + esc(c.group || '') + (c.sub ? ' / ' + esc(c.sub) : '') + '</td>' +
        '<td class="d">' + esc(travelerDate(c.when)) + '</td><td>' + esc(c.operator || '') + '</td></tr>';
    }).join('');
    var table = coats.length
      ? '<table class="coats">' +
        '<colgroup><col style="width:6%"><col style="width:34%"><col style="width:26%"><col style="width:16%"><col style="width:18%"></colgroup>' +
        '<thead><tr><th>#</th><th>Coating</th><th>Group / Sub</th><th>Date</th><th>Operator</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>'
      : '<div style="font-size:8pt">No coatings recorded on this skid yet.</div>';

    // Reuse the CSC logo already embedded in the app header (no duplicated image data).
    var logoEl = document.querySelector('#appHeader .logo') || document.querySelector('.logo');
    var logo = (logoEl && logoEl.src) ? logoEl.src : '';

    var html = travelerStyle() +
      '<div class="trav">' +
        '<div class="top">' +
          (logo ? '<img class="tlogo" src="' + esc(logo) + '" alt="CSC">' : '') +
          '<div class="hd">' +
            '<div class="co">Container Supply CO.</div>' +
            '<h2>Ticket - ' + esc(card.ticket || '(none)') + '</h2>' +
            '<div class="skid">' + esc(card.skidId || '') + (card.status ? ' &middot; ' + esc(card.status) : '') + '</div>' +
          '</div>' +
          (dm ? '<div class="dm">' + dm + '</div>' : '') +
        '</div>' +
        '<table class="specs">' + specRows + '</table>' +
        '<hr>' +
        '<div class="h3">Coatings applied</div>' +
        table +
      '</div>';

    document.getElementById('printArea').innerHTML = html;
    window.print();
  }

  // Review Jobs is a button on the home screen (rendered by renderAll), wired to this.
  function openReview() {
    enterDetailView();
    renderReview();

  var activeFilter = 'all';
  Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (btn) {
