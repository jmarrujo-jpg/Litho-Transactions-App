  // ---------------- Ticket card (one detail view for every status) ----------------
  function openCard(skidId) {
    state.view = 'card'; state.listView = 'all'; state.skid = skidId; state.returnToJobId = null; state.returnToSearch = false;
    enterDetailView();
    renderCard();
  }

  // Open a ticket from inside a job so Back returns to that job (not the main list).
  function openTicketFromJob(skidId, jobId) {
    openCard(skidId);
    state.returnToJobId = jobId;
  }

  // Open a ticket from the global Search screen so Back returns to Search (not the Litho list).
  function openCardFromSearch(skidId) {
    openCard(skidId);
    state.returnToSearch = true;
  }

  function renderCard() {
    var view = document.getElementById('view');
    var tok = nextViewToken();
    view.innerHTML = '<div class="loading">Loading ticket&hellip;</div>';
    google.script.run.withSuccessHandler(function (card) {
      if (tok !== viewToken) return;
      ensureRateData(function () { if (tok === viewToken) renderCardContent(view, card); });
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      view.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getTicketCard(state.skid);
  }

  function fmtStamp(at, by) {
    if (!at) return '';
    return esc(at) + (by ? ' by ' + esc(by) : '');
  }

  // Plain-English "what became of this piece" line for a split-family member.
  function familyWhatHappened(m) {
    var q = (m.qty !== '' && m.qty != null) ? (m.qty + ' sheets') : '';
    if (m.status === 'Used') return 'Used' + (m.usedBy ? ' by ' + m.usedBy : '') + (m.finishedOn ? ' on ' + m.finishedOn : '') + (m.runId ? ' · run ' + m.runId : '');
    if (m.status === 'In Production') return 'On production run ' + (m.runId || '?') + (q ? ' · ' + q : '');
    if (m.status === 'Missing') return 'Missing' + (m.missingOn ? ' since ' + m.missingOn : '') + (q ? ' · ' + q : '');
    if (m.status === 'Pending') return 'Pending approval' + (q ? ' · ' + q : '');
    if (m.status === 'WIP') return 'In WIP' + (q ? ' · ' + q : '') + (m.litho ? ' · litho ' + money(m.litho) : '');
    return 'In Current steel' + (q ? ' · ' + q : '');
  }

  // The split-history card: shows the original ticket plus every -LR#/-MR# piece that came
  // off it and what happened to each, so any partial can be traced back to its parent skid.
  // Only shown when there's actually a family (more than one skid on the base ticket).
  function familyCardHtml(card) {
    var fam = card.family;
    if (!fam || !fam.members || fam.members.length < 2) return '';
    var html = '<div class="card"><h3 style="margin-top:0;font-size:15px">Split history — where this steel went</h3>' +
      '<div class="sub" style="margin-bottom:8px">Every skid from original ticket <strong>' + esc(fam.base) + '</strong>. Tap any to open it.</div>';
    fam.members.forEach(function (m) {
      var isSelf = m.skidId === card.skidId;
      html += '<div class="queue-item" data-fam="' + esc(m.skidId) + '"' + (isSelf ? ' style="border:1px solid var(--accent)"' : '') + '>' +
        '<div style="min-width:0">' +
          '<div class="ticket-id">' + esc(m.ticket || '(no ticket)') +
            (m.isOriginal ? ' <span class="sub" style="font-weight:400">· original</span>' : '') +
            ' <span class="sub" style="font-weight:400">' + esc(m.skidId) + (isSelf ? ' · this skid' : '') + '</span></div>' +
          '<div class="sub">' + esc(familyWhatHappened(m)) + '</div>' +
        '</div>' +
        '<div style="text-align:right;white-space:nowrap"><span class="badge ' + badgeClassFor(m.status) + '">' + esc(m.status) + '</span></div>' +
      '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderCardContent(view, card) {
    var steel = card.steel;
    var status = card.status;
    var html = '';

    html += '<div class="card">';
    html += '<div class="ticket-id">' + esc(card.ticket || '(no ticket)') +
      ' <span class="badge ' + badgeClassFor(status) + '">' + esc(status) + '</span>' +
      ' <span class="sub" style="font-weight:400">' + esc(card.skidId) + '</span></div>';
    html += '<div class="steel-meta">' +
      metaBox('Basis Weight', steel['BW']) +
      (steel['Tested BW'] !== undefined && steel['Tested BW'] !== '' ? metaBox('Tested BW', steel['Tested BW']) : '') +
      metaBox('Type', steel['TC']) +
      metaBox('Temper', steel['TM']) + metaBox('Length', steel['Length']) +
      metaBox('Width', steel['Width']) + metaBox('End Use', steel['End Use']) +
      '</div>';
    if (steel['Litho Notes']) {
      html += '<div class="sub" style="margin-bottom:8px">Litho Notes: ' + esc(steel['Litho Notes']) + '</div>';
    }
    var meta2 = [];
    if (steel['Row'] !== '' && steel['Row'] != null) meta2.push('Row ' + esc(steel['Row']));
    if (Number(steel['Spoilage']) > 0) meta2.push('Spoilage ' + esc(steel['Spoilage']) + ' sheets');
    if (meta2.length) html += '<div class="sub" style="margin-bottom:6px">' + meta2.join(' &middot; ') + '</div>';
    var stamps = [];
    if (steel['First Coated At']) stamps.push('First coated ' + fmtStamp(steel['First Coated At'], steel['First Coated By']));
    if (steel['Approved At']) stamps.push('Approved ' + fmtStamp(steel['Approved At'], steel['Approved By']));
    // When the skid was used in production — pulled straight from Used At (old rows fall back to
    // Finished On), with how it was used (a run, the direct mark, or cut on a slitter/scroll).
    var usedWhen = steel['Used At'] || steel['Finished On'] || '';
    if (usedWhen) {
      var how = (steel['Used Via'] === 'Direct') ? 'used in production'
        : (steel['Run ID'] ? 'run ' + steel['Run ID'] : (status === 'Used' ? 'cut/used' : ''));
      stamps.push('Used ' + fmtStamp(usedWhen, steel['Used By']) + (how ? ' &middot; ' + esc(how) : ''));
    }
    if (stamps.length) html += '<div class="sub" style="margin-bottom:6px">' + stamps.join(' &middot; ') + '</div>';
    if (status === 'Current') {
      html += '<div class="sub">In Current Steel — no litho applied yet. Logging a coating sends it to WIP.</div>';
    } else {
      html += '<div class="row" style="margin-top:6px">' +
        '<div class="stat"><div class="num">' + (card.passCount || 0) + '</div><div class="label">Coatings</div></div>' +
        '<div class="stat"><div class="num">' + money(card.litho) + '</div><div class="label">Litho cost</div></div>' +
        '</div>';
    }
    html += '<button class="btn secondary" id="printTravelerBtn" style="width:100%;margin-top:12px">🖨️&nbsp; Print skid traveler</button>';
    html += '</div>';

    if (status === 'Current') html += currentActionsHtml(card);
    if (status === 'WIP') html += wipActionsHtml(card);
    if (status === 'Pending') {
      html += '<div class="card"><div class="sub">Ran as part of job <strong>' + esc(steel['Job ID'] || '') + '</strong>, ' +
        'awaiting approval. Review and approve it from <strong>Review Jobs</strong> to move it to WIP.</div></div>';
    }

    if ((status === 'WIP' || status === 'Pending') && card.coatings && card.coatings.length) {
      html += coatingsEditorHtml(card);
    }

    html += ticketDetailsEditorHtml(card);

    html += familyCardHtml(card);

    if (card.transactions && card.transactions.length) {
      html += '<div class="card"><h3 style="margin-top:0;font-size:15px">History</h3>' +
        renderHistoryTable(card.transactions) + '</div>';
    }

    view.innerHTML = html;
    Array.prototype.forEach.call(view.querySelectorAll('[data-fam]'), function (el) {
      var sk = el.getAttribute('data-fam');
      if (sk === card.skidId) return; // the current skid isn't a link to itself
      el.style.cursor = 'pointer';
      // Keep the same Back destination (Search or the job) when hopping between family members.
      el.onclick = function () {
        var rs = state.returnToSearch, rj = state.returnToJobId;
        openCard(sk);
        state.returnToSearch = rs; state.returnToJobId = rj;
      };
    });
    if (status === 'Current') wireCurrentActions(card);
    if (status === 'WIP') wireWipActions(card);
    if ((status === 'WIP' || status === 'Pending') && card.coatings && card.coatings.length) {
      wireCoatingsEditor(card);
    }
    wireTicketDetailsEditor(card);
    var ptb = document.getElementById('printTravelerBtn');
    if (ptb) ptb.onclick = function () { printTraveler(card); };
  }

  // ----- Edit a skid's steel details, Row number and Spoilage count -----

      '<div class="sub" style="margin-bottom:8px">Update this skid\'s steel details, correct the Row number, or record spoiled sheets. Changes are logged.</div>' +
      ticketFieldsHtml('ed', steel) +
      '<div class="row">' +
        '<div class="field"><label>Row number</label><input id="edRow" value="' + esc(steel['Row']) + '"></div>' +

      '</div>' +
      '<div class="row">' + operatorFieldHtml('editDetailsOperator', 'Operator name', whoRanIt(steel)) + '</div>' +
      '<button class="btn" id="saveTicketDetailsBtn">Save details</button>' +
      '</div>';
  }

  function wireTicketDetailsEditor(card) {
    var btn = document.getElementById('saveTicketDetailsBtn');
    if (!btn) return;
    btn.onclick = function () {
      var operator = document.getElementById('editDetailsOperator').value.trim();
      if (!operator) { toast('Enter an operator name'); return; }
      var spoil = document.getElementById('edSpoil').value;

    };

  // ----- Edit coatings already applied to a ticket (change the item, or remove one) -----
  // Corrections void the old pass and log the replacement, so the Litho cost follows the new
  // rate and the audit trail keeps the full "was X, now Y" record. The ticket's Job ID and
  // status are never touched — only this skid's coating changes, not the job it belongs to.
  function coatingsEditorHtml(card) {
    var html = '<div class="card"><h3 style="margin-top:0;font-size:15px">Coatings on this ticket</h3>' +
      '<div class="sub" style="margin-bottom:8px">Change corrects the coating (cost follows the new rate); Remove voids it. The ticket stays linked to its job.</div>' +
      '<div class="row">' + operatorFieldHtml('coatEditOperator', 'Operator name', whoRanIt(card.steel)) + '</div>';
    card.coatings.forEach(function (c) {
      html += '<div class="queue-item" data-coat-pass="' + esc(c.passNumber) + '">' +
        '<div style="min-width:0"><span class="ticket-id" style="font-size:14px">' + esc(c.item) + '</span> ' +
        '<span class="sub">' + esc(c.group) + (c.sub ? ' / ' + esc(c.sub) : '') + ' &middot; ' + money(c.cost) + '</span></div>' +
        '<div style="white-space:nowrap">' +
          '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-edit-coat="' + esc(c.passNumber) + '">Change</button> ' +
          '<button class="btn danger" style="padding:6px 10px;font-size:13px" data-del-coat="' + esc(c.passNumber) + '">Remove</button>' +
        '</div>' +
      '</div>';
    });
    html += '<div id="coatEditForm" style="display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:12px"></div>';
    html += '</div>';
    return html;
  }

  function wireCoatingsEditor(card) {
    var form = document.getElementById('coatEditForm');

    Array.prototype.forEach.call(document.querySelectorAll('[data-del-coat]'), function (btn) {
      btn.onclick = function () {
        var pass = btn.getAttribute('data-del-coat');
        var coat = card.coatings.filter(function (c) { return String(c.passNumber) === String(pass); })[0];
        var operator = (document.getElementById('coatEditOperator') || {}).value;
        operator = (operator || '').trim();
        if (!operator) { toast('Enter an operator name first'); return; }
        showConfirm('Remove coating',
          'Remove ' + (coat ? coat.item : 'this coating') + ' from ticket ' + card.ticket +
            '? Its cost comes off the litho total and the change is logged.',
          function () {
            runMutation('removeTicketCoating', [card.skidId, pass, operator, newOpId()],
              function () { toast('Coating removed'); renderCard(); },
              function (err) { toast('Error: ' + err.message); });
          }, 'Remove', 'danger');
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-edit-coat]'), function (btn) {
      btn.onclick = function () {
        var pass = btn.getAttribute('data-edit-coat');
        var coat = card.coatings.filter(function (c) { return String(c.passNumber) === String(pass); })[0];
        openCoatingEdit(card, coat, form);
      };
    });
  }

  function openCoatingEdit(card, coat, form) {
    form.style.display = 'block';
    form.innerHTML =
      '<h4 style="margin:0 0 8px;font-size:14px">Change coating (currently ' + esc(coat.item) + ')</h4>' +
      '<div class="row">' +
        selectField('editGroup', 'Size / Group', rateGroups(), coat.group) +
        selectField('editSub', '#OUT', [], null) +
        selectField('editItem', 'Coating Item', [], null) +
        selectField('editChem', 'Chem Code', [], null) +
      '</div>' +
      '<div id="editCoatCost" class="sub" style="margin-bottom:10px"></div>' +
      '<button class="btn success" id="saveCoatEditBtn">Save change</button> ' +
      '<button class="btn secondary" id="cancelCoatEditBtn">Cancel</button>';
    if (form.scrollIntoView) form.scrollIntoView({ block: 'nearest' });

    var groupSelect = document.getElementById('editGroup');
    var subSelect = document.getElementById('editSub');
    var itemSelect = document.getElementById('editItem');
    var chemSelect = document.getElementById('editChem');
    var costPreview = document.getElementById('editCoatCost');

    wireCoatingCascade(groupSelect, subSelect, itemSelect, chemSelect, costPreview, function (c) {
      return 'New coating cost: ' + money(c) + ' (was ' + money(coat.cost) + ').';
    });
    // Pre-fill the cascade to the coating being edited so the operator only changes what's wrong.
    if (coat.group) {
      groupSelect.value = coat.group; groupSelect.onchange();
      if (coat.sub) { subSelect.value = coat.sub; }
      subSelect.onchange();
      itemSelect.value = coat.item;
      itemSelect.onchange();
    }

    document.getElementById('cancelCoatEditBtn').onclick = function () {
      form.style.display = 'none'; form.innerHTML = '';
    };
    document.getElementById('saveCoatEditBtn').onclick = function () {
      var group = groupSelect.value, sub = subSelect.value, item = itemSelect.value;
      var operator = ((document.getElementById('coatEditOperator') || {}).value || '').trim();
      if (!group || !item) { toast('Pick a size/group and coating item'); return; }
      if (!operator) { toast('Enter an operator name (top of this card)'); return; }
      var btn = document.getElementById('saveCoatEditBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      runMutation('editTicketCoating', [card.skidId, coat.passNumber, group, sub, item, operator, newOpId()],
        function () { toast('Coating updated'); renderCard(); },
        function (err) { toast('Error: ' + err.message); btn.disabled = false; btn.textContent = 'Save change'; });
    };
  }

  // ----- Current: log the first coating (moves the skid to WIP) -----
  function currentActionsHtml(card) {
    var origQty = card.steel['QTY/LOAD'] || 0;
    return '<div class="card">' +
      '<h3 style="margin-top:0;font-size:15px">Log a coating</h3>' +
      '<div class="row">' +
        selectField('groupSelect', 'Size / Group', rateGroups(), card.suggestedGroup) +
        selectField('subSelect', '#OUT', [], null) +
        selectField('itemSelect', 'Coating Item', [], null) +
        selectField('chemSelect', 'Chem Code', [], null) +
      '</div>' +
      '<div class="row">' +
        operatorFieldHtml('passOperator') +
        '<div class="field"><label>Notes (optional)</label><input id="passNotes" placeholder="e.g. re-run, color match"></div>' +
      '</div>' +
      '<div id="itemCostPreview" class="sub" style="margin-bottom:10px"></div>' +
      (origQty > 0
        ? '<div class="field"><label>Sheets run (of ' + esc(origQty) + ')</label>' +
            '<input type="number" inputmode="numeric" id="sheetsRunInput" value="' + esc(origQty) + '" min="1" max="' + esc(origQty) + '"></div>' +
          '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;margin-bottom:6px">' +
            '<input type="checkbox" id="partialSkidToggle" style="width:18px;height:18px"> ' +
            'This is a partial skid — return leftovers to Current Steel' +
          '</label>' +
          '<div class="sub" id="sheetsRunPreview" style="margin-bottom:10px"></div>'
        : '<div class="sub" style="margin-bottom:10px">No sheet count on this ticket — the whole skid runs as-is.</div>') +
      '<div class="field"><label>Litho Notes (optional)</label><input id="lithoNoteInput" placeholder="Note kept with this ticket"></div>' +
      '<button class="btn success" id="logCoatingBtn">Log Coating &amp; Send to WIP</button>' +
      '</div>';
  }

  function wireCurrentActions(card) {
    var groupSelect = document.getElementById('groupSelect');
    var subSelect = document.getElementById('subSelect');
    var itemSelect = document.getElementById('itemSelect');
    var chemSelect = document.getElementById('chemSelect');
    var costPreview = document.getElementById('itemCostPreview');
    wireCoatingCascade(groupSelect, subSelect, itemSelect, chemSelect, costPreview, function (c) {
      return 'This coating adds ' + money(c) + ' to the litho cost.';
    });

    var sheetsRunInput = document.getElementById('sheetsRunInput');
    var partialToggle = document.getElementById('partialSkidToggle');
    var preview = document.getElementById('sheetsRunPreview');
    var origQty = Number(card.steel['QTY/LOAD']) || 0;
    var origWeight = Number(card.steel['Weight']) || 0;
    var weightPerSheet = origQty > 0 ? (origWeight / origQty) : 0;

    function updatePreview() {
      if (!preview || !sheetsRunInput) return;
      var sheets = Number(sheetsRunInput.value) || 0;
      var estWeight = Math.round(sheets * weightPerSheet * 100) / 100;
      var rem = origQty - sheets;
      if (rem <= 0) {
        preview.textContent = 'Full skid: ' + sheets + ' sheets (~' + estWeight + ' lbs, estimated).';
      } else if (partialToggle.checked) {
        var remWeight = Math.round((origWeight - estWeight) * 100) / 100;
        preview.textContent = sheets + ' sheets coated (~' + estWeight + ' lbs) become a new -LR# ticket in WIP. The other ' +
          rem + ' sheets (~' + remWeight + ' lbs) stay as ' + clientBaseTicket(card.ticket) + ' in Current.';
      } else {
        preview.textContent = sheets + ' sheets run. ' + rem + ' leftover sheets will be scrapped (not returned).';
      }
    }
    if (sheetsRunInput) sheetsRunInput.oninput = updatePreview;
    clampSheets(sheetsRunInput, origQty);
    if (partialToggle) partialToggle.onchange = updatePreview;
    updatePreview();

    var logCoatingBtn = document.getElementById('logCoatingBtn');
    logCoatingBtn.onclick = function () {
      var group = groupSelect.value, sub = subSelect.value, item = itemSelect.value;
      var operator = document.getElementById('passOperator').value.trim();
      var notes = document.getElementById('passNotes').value;
      var lithoNote = document.getElementById('lithoNoteInput').value;
      var isPartialSkid = !!(partialToggle && partialToggle.checked);
      var sheetsRun = sheetsRunInput ? sheetsRunInput.value : '';
      if (!group || !item) { toast('Pick a group and coating item first'); return; }
      if (!operator) { toast('Enter an operator name'); return; }
      var sErr = sheetsError(sheetsRun, origQty);
      if (sErr) { toast(sErr); return; }

      function submit(coatedTicket) {
        logCoatingBtn.disabled = true;
        runMutation('applyCoating',
          [state.skid, group, sub, item, operator, notes, sheetsRun, isPartialSkid, lithoNote, '', newOpId(), coatedTicket || ''],
          function (result) {
            if (result && result.duplicate) { toast('Already recorded'); renderCard(); return; }
            var msg = 'Ticket ' + result.ticket + ' moved to WIP. Litho cost so far: ' + money(result.litho) + '.';
            if (result.remainderTicket) msg += ' The remaining ' + result.remainderSheets + ' sheets stay in Current as ' + result.remainderTicket + '.';
            else if (result.scrapSheets) msg += ' ' + result.scrapSheets + ' sheets scrapped.';
            showInfo('Sent to WIP', msg, function () { renderCard(); });
          },
          function (err) {
            showModal({ title: 'Could not log coating', message: err.message, confirmText: 'OK' });
            logCoatingBtn.disabled = false;
          });
      }

      // Partial skid: the coated batch becomes a new -LR# ticket. The ticket NUMBER is auto-assigned
      // by the worker (next free -LR# off the original) — we intentionally do NOT prompt to name it,
      // so no one can renumber a ticket during a split. (Naming prompt turned off per request: the old
      // "Name the coated skid" dialog let operators type an arbitrary -LR# number.)
      if (isPartialSkid) {
        var base = clientBaseTicket(card.ticket);
        var ran = Number(sheetsRun) || 0;
        showConfirm('Coat & send to WIP',
          'Coating ' + ran + ' of ' + origQty + ' sheets. The coated batch moves to WIP with an auto-assigned -LR# ticket; the remaining ' + (origQty - ran) + ' sheets stay as ' + base + ' in Current.',
          function () { submit(''); });
      } else {
        submit('');
      }
    };
  }

  // ----- WIP: adjust cost, add coats (WIP is terminal; approval already happened) -----

      '<h3 style="margin-top:0;font-size:15px">Add another coating</h3>' +

      '<div class="row">' +
        selectField('wipGroupSelect', 'Size / Group', rateGroups(), null) +

  function wireWipActions(card) {
    var saveWipCostBtn = document.getElementById('saveWipCostBtn');
    saveWipCostBtn.onclick = function () {
      var newCost = String(document.getElementById('wipCostInput').value || '').replace(/[$,\s]/g, '');
      var operator = document.getElementById('wipCostOperator').value.trim();
      var notes = document.getElementById('wipCostNotes').value;
      // A cleared box used to save as $0.00. Require an actual number (0 is fine if typed).
      if (newCost === '' || isNaN(Number(newCost)) || Number(newCost) < 0) { toast('Enter the litho cost as a number, e.g. 12.50'); return; }
      if (!operator) { toast('Enter an operator name'); return; }
      saveWipCostBtn.disabled = true;
      runMutation('updateWipLithoCost', [state.skid, newCost, operator, notes, newOpId()],
        function () { toast('Litho cost updated'); renderCard(); },
        function (err) {
          showModal({ title: 'Could not update cost', message: err.message, confirmText: 'OK' });
          saveWipCostBtn.disabled = false;
        });
    };

    var wipGroupSelect = document.getElementById('wipGroupSelect');
    var wipSubSelect = document.getElementById('wipSubSelect');
    var wipItemSelect = document.getElementById('wipItemSelect');
    var wipChemSelect = document.getElementById('wipChemSelect');
    var wipCostPreview = document.getElementById('wipItemCostPreview');
    wireCoatingCascade(wipGroupSelect, wipSubSelect, wipItemSelect, wipChemSelect, wipCostPreview, function (c) {
      return 'This coating adds ' + money(c) + ' to the litho cost.';
    });

    var addCoatingBtn = document.getElementById('addCoatingBtn');
    addCoatingBtn.onclick = function () {
      var group = wipGroupSelect.value, sub = wipSubSelect.value, item = wipItemSelect.value;
      var operator = document.getElementById('wipCoatOperator').value.trim();
      var notes = document.getElementById('wipCoatNotes').value;
      var lithoNote = document.getElementById('wipLithoNoteInput').value;
      if (!group || !item) { toast('Pick a group and coating item first'); return; }
      if (!operator) { toast('Enter an operator name'); return; }
      addCoatingBtn.disabled = true;
      runMutation('applyCoating',
        [state.skid, group, sub, item, operator, notes, '', false, lithoNote, '', newOpId()],
        function (result) {
          if (result && result.duplicate) { toast('Already recorded'); renderCard(); return; }
          showInfo('Coating added', 'Litho cost is now ' + money(result.litho) + '.', function () { renderCard(); });
        },
        function (err) {
          showModal({ title: 'Could not add coating', message: err.message, confirmText: 'OK' });
          addCoatingBtn.disabled = false;
        });
    };
  }

  // ---------------- Review Jobs (a day's coating runs, then approve -> WIP) ----------------
  var reviewScope = 'pending'; // 'pending' = all pending jobs; 'all' = pending + approved

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  // Previous workday (skips weekends): Mon -> Fri, Sun/Sat -> Fri, otherwise yesterday.
  function prevWorkdayStr() {
    var d = new Date();
    do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function renderReview() {
    state.view = 'review';
    var view = document.getElementById('view');
    var tok = nextViewToken();
    var chips = [['pending', 'Pending'], ['all', 'All']].map(function (c) {
      return '<button data-rscope="' + c[0] + '"' + (reviewScope === c[0] ? ' class="active"' : '') + '>' + c[1] + '</button>';
    }).join('');
    view.innerHTML =
      '<div class="card">' +
        '<h3 style="margin-top:0">Review jobs</h3>' +
        '<div class="tabbar">' + chips + '</div>' +
        '<div class="sub">' + (reviewScope === 'all' ? 'All jobs, newest first.' : 'All pending jobs, newest first.') +
          ' Open one to add tickets/coatings and approve — approving moves its tickets to WIP.</div>' +
      '</div>' +
      '<div id="reviewList"><div class="loading">Loading jobs&hellip;</div></div>';
    Array.prototype.forEach.call(view.querySelectorAll('[data-rscope]'), function (b) {
      b.onclick = function () { reviewScope = b.getAttribute('data-rscope'); renderReview(); };
    });
    google.script.run.withSuccessHandler(function (jobs) {
      if (tok !== viewToken) return;
      renderReviewList(jobs);
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      var el = document.getElementById('reviewList');
      if (el) el.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getOpenJobs(reviewScope === 'all');
  }

  function renderReviewList(jobs) {
    var el = document.getElementById('reviewList');
    if (!el) return;
    if (!jobs || !jobs.length) { el.innerHTML = '<div class="card empty">' + (reviewScope === 'all' ? 'No jobs yet.' : 'No pending jobs.') + '</div>'; return; }
    var html = '<div class="card">';
    jobs.forEach(function (j) {
      var approved = j.status === 'Approved';
      var badge = approved ? '<span class="badge wip">Approved</span>' : '<span class="badge inprogress">Pending</span>';
      // Created date next to every job; for an approved job also show when it ran (was approved).
      var dateLine = 'Created ' + esc(j.createdAt || '—') + (approved && j.approvedAt ? ' &middot; Ran ' + esc(j.approvedAt) : '');
      html += '<div class="queue-item" data-job="' + esc(j.jobId) + '">' +
        '<div style="min-width:0">' +
          '<div class="ticket-id">' + esc(j.description || '(untitled job)') + ' <span class="sub" style="font-weight:400">' + esc(j.jobId) + '</span></div>' +
          '<div class="sub">' + esc(j.coatings || '') + '</div>' +
          '<div class="sub">' + dateLine + '</div>' +
          '<div class="sub">' + (j.ticketCount || 0) + ' ticket(s) &middot; by ' + esc(j.createdBy) + '</div>' +
        '</div>' +
        '<div style="text-align:right;white-space:nowrap">' + badge + '</div>' +
      '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('[data-job]'), function (row) {
      row.onclick = function () { openJob(row.getAttribute('data-job')); };
    });
  }

  function openJob(jobId) {
    if (!managerOnly()) return;
    state.view = 'job'; state.jobId = jobId;
    enterDetailView();
    renderJob();
  }

  function renderJob() {
    var view = document.getElementById('view');
    var tok = nextViewToken();
    view.innerHTML = '<div class="loading">Loading job&hellip;</div>';
    google.script.run.withSuccessHandler(function (job) {
      if (tok !== viewToken) return;
      ensureRateData(function () { if (tok === viewToken) renderJobContent(view, job); });
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      view.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getJobDetail(state.jobId);
  }

  function renderJobContent(view, job) {
    var approved = job.status === 'Approved';
    var html = '';

    var totalLitho = (job.tickets || []).reduce(function (s, t) { return s + (Number(t.litho) || 0); }, 0);
    // Look up a coating's Chem Code from the (already-loaded) rate data.
    function coatingChem(c) {
      var items = rateItems(c.group, c.sub) || [];
      var m = items.filter(function (it) { return it.item === c.item; })[0];
      if (!m && rateData.addons) m = rateData.addons.filter(function (it) { return it.item === c.item; })[0];
      return m ? (m.chemCode || '') : '';
    }
    var coatingLis;
    if (job.coatings && job.coatings.length) {
      coatingLis = job.coatings.map(function (c) {
        var chem = coatingChem(c);
        return '<li>' + esc(c.item) + (c.sub ? ' (' + esc(c.sub) + ')' : '') +
          (chem ? ' <span class="sub">&middot; Chem ' + esc(chem) + '</span>' : '') + '</li>';
      });
    } else {
      coatingLis = String(job.coatingsSummary || '').split(' | ').filter(Boolean).map(function (c) { return '<li>' + esc(c) + '</li>'; });
    }
    var coatingsBlock = coatingLis.length
      ? '<div style="margin-top:8px"><div class="sub">Coatings</div>' +
          '<ul style="margin:4px 0 0;padding-left:20px;font-size:15px;line-height:1.6">' + coatingLis.join('') + '</ul></div>'
      : '<div class="sub" style="margin-top:4px">Coatings: (none)</div>';

    html += '<div class="card">' +
      '<div class="ticket-id">' + esc(job.description || '(untitled job)') +
        ' <span class="badge ' + (approved ? 'wip' : 'inprogress') + '">' + esc(job.status) + '</span>' +
        ' <span class="sub" style="font-weight:400">' + esc(job.jobId) + '</span></div>' +
      coatingsBlock +
      (job.notes ? '<div class="sub" style="margin-top:6px">Notes: ' + esc(job.notes) + '</div>' : '') +
      '<div class="sub" style="margin-top:6px">Created by ' + esc(job.createdBy) + ' &middot; ' + esc(job.createdAt) + '</div>' +
      (approved ? '<div class="sub">Approved by ' + esc(job.approvedBy) + ' &middot; ' + esc(job.approvedAt) + '</div>' : '') +
      '<div class="row" style="margin-top:10px">' +
        '<div class="stat"><div class="num">' + money(totalLitho) + '</div><div class="label">Total litho cost</div></div>' +
        '<div class="stat"><div class="num">' + job.tickets.length + '</div><div class="label">Tickets</div></div>' +
      '</div>' +
      '</div>';

    // Picked-ticket entry sits at the top (like New Job) so the sheets/notes form appears
    // above the search when you select a ticket, instead of below the results.
    if (!approved) html += '<div class="card" id="jobReviewPicked" style="display:none"></div>';

    // Tickets on the job
    html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Tickets on this job (' + job.tickets.length + ')</h3>';
    if (!job.tickets.length) html += '<div class="sub">None yet.</div>';
    else {
      html += '<div class="sub" style="margin-bottom:8px">Tap a ticket number to view it and change or remove its coatings.</div>';
      html += '<table><thead><tr><th>Ticket</th><th>Skid</th><th>BW</th><th>Tested BW</th><th>Status</th><th>Litho</th>' + (approved ? '' : '<th></th>') + '</tr></thead><tbody>';
      job.tickets.forEach(function (t) {
        html += '<tr><td><span class="ticket-link" data-open-skid="' + esc(t.skidId) + '">' + esc(t.ticket) + '</span></td>' +
          '<td class="sub">' + esc(t.skidId) + '</td><td>' + esc(t.bw) + '</td><td>' + (t.testedBw !== undefined && t.testedBw !== '' ? esc(t.testedBw) : '&mdash;') + '</td>' +
          '<td>' + esc(t.status) + '</td><td>' + money(t.litho) + '</td>' +
          (approved ? '' : '<td><button class="btn secondary" style="padding:4px 8px;font-size:12px" data-remove="' + esc(t.skidId) + '">Remove</button></td>') +
          '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';

    if (!approved) {
      // Add a ticket — collapsed behind a button; pressing it opens the search + list.
      html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Add a ticket</h3>' +
        '<button class="btn secondary" id="showAddTicketBtn" style="width:100%">+ Add Tickets</button>' +
        '<div id="jobAddTicketArea" style="display:none;margin-top:10px">' +
          searchBarHtml('jobReviewSearch') +
          '<div id="jobReviewPicker" style="margin-top:10px"></div>' +
        '</div>' +
        '</div>';

      // Add a coating to the recipe
      html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Add a coating to this job</h3>' +
        '<div class="sub" style="margin-bottom:8px">Applies to every ticket already on the job.</div>' +
        '<div class="row">' +
          selectField('jrGroup', 'Size / Group', rateGroups(), null) +
          selectField('jrSub', '#OUT', [], null) +
          selectField('jrItem', 'Coating Item', [], null) +
          selectField('jrChem', 'Chem Code', [], null) +
        '</div>' +
        operatorFieldHtml('jrOperator') +
        '<div id="jrCostPreview" class="sub" style="margin:6px 0"></div>' +
        '<button class="btn" id="jrAddCoatingBtn">Add Coating</button>' +
        '</div>';

      // Approve
      html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Approve job</h3>' +
        '<div class="sub" style="margin-bottom:10px">Approving moves ' + job.tickets.length + ' ticket(s) to WIP and locks the job.</div>' +
        foremanFieldHtml('approveForeman', 'Foreman name') +
        '<button class="btn success" id="approveJobBtn"' + (job.tickets.length ? '' : ' disabled') + '>Approve &amp; Send to WIP</button>' +
        (job.tickets.length ? '' : '<div class="sub" style="margin-top:8px">Add at least one ticket first.</div>') +
        '</div>';

      // Delete a job created by mistake. Only an empty job can be deleted here; a job with
      // tickets must have them removed first (each ticket returns to Current).
      html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Delete job</h3>' +
        (job.tickets.length
          ? '<div class="sub">This job has ' + job.tickets.length + ' ticket(s). Remove them above first — each returns to Current — then you can delete the empty job.</div>'
          : '<div class="sub" style="margin-bottom:10px">Permanently removes this empty job. Use this for a job created by mistake.</div>' +
            '<button class="btn warn" id="deleteJobBtn" style="width:100%">Delete this job</button>') +
        '</div>';
    }

    view.innerHTML = html;
    wireJobReview(job, approved);
  }

  function wireJobReview(job, approved) {
    // Tap a ticket to open its full detail (coating editor, history). Works whatever the job
    // status — approved jobs' tickets are WIP and can still have coatings corrected. Back
    // returns to this job.
    Array.prototype.forEach.call(document.querySelectorAll('[data-open-skid]'), function (el) {
      el.onclick = function () { openTicketFromJob(el.getAttribute('data-open-skid'), job.jobId); };
    });

    if (approved) return;

    // Remove ticket buttons
    Array.prototype.forEach.call(document.querySelectorAll('[data-remove]'), function (btn) {
      btn.onclick = function () {
        var sk = btn.getAttribute('data-remove');
        showConfirm('Remove ticket', 'Remove skid ' + sk + ' from this job? Its pending coatings are voided.', function () {
          btn.disabled = true;
          runMutation('removeTicketFromJob', [state.jobId, sk, currentApprover(), newOpId()],
            function () { renderJob(); },
            function (err) { showModal({ title: 'Could not remove', message: err.message, confirmText: 'OK' }); btn.disabled = false; });
        }, 'Remove', 'secondary');
      };
    });

    // Ticket picker stays hidden until "Add Tickets" is pressed (Current skids only).
    var showAddBtn = document.getElementById('showAddTicketBtn');
    if (showAddBtn) showAddBtn.onclick = function () {
      var area = document.getElementById('jobAddTicketArea');
      if (area) area.style.display = 'block';
      showAddBtn.style.display = 'none';
      ensureAllCache(function () { renderJobReviewPicker(''); });
      var search = document.getElementById('jobReviewSearch');
      if (search) { search.oninput = function () { renderJobReviewPicker(search.value); }; search.focus(); }
    };

    // Add-coating cascade
    var jrGroup = document.getElementById('jrGroup'), jrSub = document.getElementById('jrSub'),
        jrItem = document.getElementById('jrItem'), jrChem = document.getElementById('jrChem'),
        jrCost = document.getElementById('jrCostPreview');
    wireCoatingCascade(jrGroup, jrSub, jrItem, jrChem, jrCost, function (c) { return 'Adds ' + money(c) + ' per ticket.'; });
    document.getElementById('jrAddCoatingBtn').onclick = function () {
      var operator = document.getElementById('jrOperator').value.trim();
      if (!jrGroup.value || !jrItem.value) { toast('Pick a group and coating item'); return; }
      if (!operator) { toast('Enter an operator name'); return; }
      var btn = document.getElementById('jrAddCoatingBtn'); btn.disabled = true;
      runMutation('addCoatingToJob', [state.jobId, { group: jrGroup.value, sub: jrSub.value, item: jrItem.value }, operator, newOpId()],
        function () { toast('Coating added to job'); renderJob(); },
        function (err) { showModal({ title: 'Could not add coating', message: err.message, confirmText: 'OK' }); btn.disabled = false; });
    };

    // Approve
    wireForemanField('approveForeman');
    var approveBtn = document.getElementById('approveJobBtn');
    if (approveBtn) approveBtn.onclick = function () {
      var operator = currentApprover();
      if (!operator) { toast('Select or enter a foreman name'); return; }
      showConfirm('Approve job', 'Approve ' + state.jobId + ' and move ' + job.tickets.length + ' ticket(s) to WIP?', function () {
        approveBtn.disabled = true;
        runMutation('approveJob', [state.jobId, operator, newOpId()],
          function () { showInfo('Job approved', 'All tickets moved to WIP.', function () { renderJob(); }); },
          function (err) { showModal({ title: 'Could not approve', message: err.message, confirmText: 'OK' }); approveBtn.disabled = false; });
      }, 'Approve');
    };

    // Delete job (only shown for an empty, unapproved job)
    var deleteBtn = document.getElementById('deleteJobBtn');
    if (deleteBtn) deleteBtn.onclick = function () {
      showConfirm('Delete job', 'Delete ' + (job.description || job.jobId) + '? This can\'t be undone.', function () {
        deleteBtn.disabled = true;
        runMutation('deleteJob', [state.jobId, currentApprover(), newOpId()],
          function () { toast('Job deleted'); openReview(); },
          function (err) { showModal({ title: 'Could not delete', message: err.message, confirmText: 'OK' }); deleteBtn.disabled = false; });
      }, 'Delete', 'warn');
    };
  }

  function currentApprover() {
    var f = foremanValue('approveForeman');
    if (f) return f;
    var el = document.getElementById('jrOperator');
    return el ? el.value.trim() : '';
  }

  function renderJobReviewPicker(term) {
    var c = document.getElementById('jobReviewPicker');
    if (!c) return;
    term = (term || '').trim().toLowerCase();
    var rows = (term ? queueCache.filter(function (q) { return String(q.ticket).toLowerCase().indexOf(term) !== -1; }) : queueCache.slice(0, 15));
    if (!rows.length) {
      var checking = recheckOnMiss(term, function () { var i = document.getElementById('jobReviewSearch'); if (i) renderJobReviewPicker(i.value); });
      c.innerHTML = '<div class="sub">No Current tickets match.' + (checking ? CHECKING_HTML : '') + '</div>'; return;
    }
    var html = '';
    rows.forEach(function (q) {
      html += '<div class="queue-item" style="padding:6px 0"><div style="min-width:0">' +
        '<span class="ticket-id" style="font-size:14px">' + esc(q.ticket) + '</span> <span class="sub">' + esc(q.endUse) + ' &middot; ' + esc(q.qty || 0) + ' sheets</span></div>' +
        '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-pick="' + esc(q.skidId) + '">Select</button></div>';
    });
    c.innerHTML = html;
    Array.prototype.forEach.call(c.querySelectorAll('[data-pick]'), function (btn) {
      btn.onclick = function () {
        var sk = btn.getAttribute('data-pick');
        renderJobReviewPicked(sk, queueCache.filter(function (q) { return q.skidId === sk; })[0]);
      };
    });
  }

  function renderJobReviewPicked(skidId, entry) {
    var card = document.getElementById('jobReviewPicked');
    var origQty = entry ? Number(entry.qty) || 0 : 0;
    card.style.display = 'block';
    card.innerHTML = '<h3 style="margin-top:0;font-size:15px">Add ticket to job</h3>' +
      '<div class="ticket-id">' + esc(entry ? entry.ticket : skidId) + '</div>' +
      (origQty > 0
        ? '<div class="field"><label>Sheets run (of ' + esc(origQty) + ')</label><input type="number" inputmode="numeric" id="jrSheets" value="' + esc(origQty) + '" min="1" max="' + esc(origQty) + '"></div>' +
          '<label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px"><input type="checkbox" id="jrPartial" style="width:18px;height:18px"> Partial skid — return leftovers to Current</label>'
        : '') +
      operatorFieldHtml('jrPickOperator') +
      testedBwFieldHtml('jrTestedBw', entry) +
      '<div class="field"><label>Litho Notes (optional)</label><input id="jrLithoNote"></div>' +
      '<button class="btn" id="jrAddTicketBtn">Add to Job</button>';
    if (card.scrollIntoView) card.scrollIntoView({ block: 'start' });
    clampSheets(document.getElementById('jrSheets'), origQty);
    document.getElementById('jrAddTicketBtn').onclick = function () {
      var operator = document.getElementById('jrPickOperator').value.trim();
      if (!operator) { toast('Enter an operator name'); return; }
      var sheets = document.getElementById('jrSheets') ? document.getElementById('jrSheets').value : '';
      var partial = document.getElementById('jrPartial') ? document.getElementById('jrPartial').checked : false;
      var lithoNote = document.getElementById('jrLithoNote').value;
      var sErr = sheetsError(sheets, origQty);
      if (sErr) { toast(sErr); return; }
      var testedBw = readTestedBw('jrTestedBw');
      if (testedBw === null) { toast('Tested BW must be a number, e.g. 75.2'); return; }
      var btn = document.getElementById('jrAddTicketBtn'); btn.disabled = true;
      runMutation('jobAddTicket', [state.jobId, skidId, sheets, partial, lithoNote, operator, newOpId(), '', testedBw],
        function (result) {
          toast('Ticket added');
          warnIfTestedBwDropped(testedBw, result);
          dropFromQueueCache(skidId); // no longer Current — keep it out of the picker; the list reloads on the next visit
          renderJob();
        },
        function (err) { showModal({ title: 'Could not add ticket', message: err.message, confirmText: 'OK' }); btn.disabled = false; });
    };
  }

  // ---------------- Create Job (multi-coating recipe) ----------------
  // A job carries a recipe of one or more coatings. Every ticket added to the job gets
  // the whole recipe applied and lands in Pending, awaiting review/approval in Review Jobs.
  var currentJob = null; // { jobId, description, coatings:[...], operator, notes }
  var jobCoatings = [];   // recipe being built in step 1, before the job is created
  var jobAddedTickets = []; // running list of tickets added so far, for display

  function openCreateJob() {
    currentJob = null;
    jobCoatings = [];
    jobAddedTickets = [];
    state.view = 'createJob';
    enterDetailView();
    renderCreateJobSetup();
  }

  // Step 1: describe the job and build its coating recipe (one or more coatings) before
  // adding any tickets.
  function renderCreateJobSetup() {
    var view = document.getElementById('view');
    var html = '';

    html += '<div class="card">' +
      '<h3 style="margin-top:0">New Job</h3>' +
      '<div class="sub" style="margin-bottom:12px">Describe what\'s being done and add one or more coatings. Every ticket you add gets the whole recipe. The job is reviewed and approved later in Review Jobs.</div>' +
      '<div class="field"><label>Job description</label><input id="jobName" placeholder="e.g. White coat run, 7/1 morning"></div>' +
      '<div class="row">' +
        operatorFieldHtml('jobOperator') +
        '<div class="field"><label>Notes (optional)</label><input id="jobNotes" placeholder="e.g. re-run, color match"></div>' +
      '</div>' +
      '</div>';

    // Coating builder card: add coatings to the recipe one at a time.
    html += '<div class="card">' +
      '<h3 style="margin-top:0;font-size:15px">Coatings on this job</h3>' +
      '<div id="jobCoatingList" class="sub" style="margin-bottom:12px">No coatings added yet.</div>' +
      '<div class="field"><label>Can Fitting Size (sets the Size / Group)</label>' +
        '<select id="jobCanSize"><option value="">-- pick a can size --</option></select></div>' +
      '<div class="row">' +
        '<div class="field" id="jobGroupWrap"></div>' +
        '<div class="field" id="jobSubWrap"></div>' +
        '<div class="field" id="jobItemWrap"></div>' +
        '<div class="field" id="jobChemWrap"></div>' +
      '</div>' +
      '<div class="sub" id="jobCostPreview" style="margin-bottom:10px"></div>' +
      '<button class="btn secondary" id="addCoatingBtn">+ Add Coating</button>' +
      '</div>';

    html += '<div class="card">' +
      '<button class="btn" id="startJobSetupBtn">Start Adding Tickets</button>' +
      '</div>';

    view.innerHTML = html;

    document.getElementById('jobGroupWrap').innerHTML = '<label>Size / Group</label><select id="jobGroupSelect"><option value="">--</option></select>';
    document.getElementById('jobSubWrap').innerHTML = '<label>#OUT</label><select id="jobSubSelect"><option value="">--</option></select>';
    document.getElementById('jobItemWrap').innerHTML = '<label>Coating Item</label><select id="jobItemSelect"><option value="">--</option></select>';
    document.getElementById('jobChemWrap').innerHTML = '<label>Chem Code</label><select id="jobChemSelect"><option value="">--</option></select>';

    var canSizeInput = document.getElementById('jobCanSize');
    var groupSelect = document.getElementById('jobGroupSelect');
    var subSelect = document.getElementById('jobSubSelect');
    var itemSelect = document.getElementById('jobItemSelect');
    var chemSelect = document.getElementById('jobChemSelect');
    var costPreview = document.getElementById('jobCostPreview');

    ensureRateData(function () {
      rateGroups().forEach(function (g) {
        var opt = document.createElement('option');
        opt.value = g; opt.textContent = g;
        groupSelect.appendChild(opt);
      });
      canSizeOptions().forEach(function (cs) {
        var opt = document.createElement('option');
        opt.value = cs; opt.textContent = cs;
        canSizeInput.appendChild(opt);
      });
      wireCoatingCascade(groupSelect, subSelect, itemSelect, chemSelect, costPreview, function (c) {
        return 'This coating adds ' + money(c) + ' per ticket.';
      });
    });

    // Picking a can size (e.g. 603x700) decides the Size/Group and drives the cascade.
    canSizeInput.onchange = function () {
      var g = groupForCanSize(canSizeInput.value);
      if (g && g !== groupSelect.value) { groupSelect.value = g; groupSelect.onchange(); }
    };

    renderJobCoatingList();

    document.getElementById('addCoatingBtn').onclick = function () {
      var group = groupSelect.value, sub = subSelect.value, item = itemSelect.value;
      if (!group || !item) { toast('Pick a size/group and coating item'); return; }
      jobCoatings.push({ group: group, sub: sub, item: item });
      renderJobCoatingList();
      // Reset the coating picker for the next one, keeping the group so multi-coats on the
      // same size are quick to add. Re-running the cascade re-defaults the sub to the highest
      // #OUT (rather than blanking it) and clears the item/chem for a fresh pick.
      groupSelect.onchange();
      toast('Coating added — add another or start adding tickets');
    };

    document.getElementById('startJobSetupBtn').onclick = function () {
      var jobName = document.getElementById('jobName').value.trim();
      var operator = document.getElementById('jobOperator').value.trim();
      var notes = document.getElementById('jobNotes').value;

      // Fold in an un-added coating still sitting in the picker so it isn't lost. Build the recipe
      // as a COPY: jobCoatings is only updated once the job is created, so tapping Start again
      // after a failed attempt (or a missing operator name) can't add that coating a second time.
      var coatings = jobCoatings.slice();
      var pendingGroup = groupSelect.value, pendingItem = itemSelect.value;
      if (pendingGroup && pendingItem) {
        coatings.push({ group: pendingGroup, sub: subSelect.value, item: pendingItem });
      }

      if (!coatings.length) { toast('Add at least one coating'); return; }
      if (!operator) { toast('Enter an operator name'); return; }

      var btn = document.getElementById('startJobSetupBtn');
      btn.disabled = true; btn.textContent = 'Creating job…';
      runMutation('createJob', [jobName, operator, coatings, notes, newOpId()],
        function (result) {
          jobCoatings = coatings;
          currentJob = {
            jobId: result.jobId, description: jobName,
            coatings: coatings.slice(), operator: operator, notes: notes
          };
          state.jobId = result.jobId;
          renderCreateJobAddTickets();
        },
        function (err) {
          toast('Error: ' + err.message);
          btn.disabled = false; btn.textContent = 'Start Adding Tickets';
        });
    };
  }

  function renderJobCoatingList() {
    var container = document.getElementById('jobCoatingList');
    if (!container) return;
    if (!jobCoatings.length) { container.innerHTML = 'No coatings added yet.'; return; }
    var html = '';
    jobCoatings.forEach(function (c, i) {
      html += '<div class="queue-item" style="padding:6px 0">' +
        '<div style="min-width:0"><span class="ticket-id" style="font-size:14px">' + esc(c.item) + '</span> ' +
        '<span class="sub">' + esc(c.group) + (c.sub ? ' / ' + esc(c.sub) : '') + '</span></div>' +
        '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-remove-coat="' + i + '">Remove</button>' +
        '</div>';
    });
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll('[data-remove-coat]'), function (btn) {
      btn.onclick = function () {
        jobCoatings.splice(Number(btn.getAttribute('data-remove-coat')), 1);
        renderJobCoatingList();
      };
    });
  }

  // Step 2: add tickets to the job one at a time, entering sheets run for each.
  function renderCreateJobAddTickets() {
    var view = document.getElementById('view');
    var html = '';

    // Workers only add tickets here: they see the job's coatings but can't change the recipe
    // (adding a coating re-coats every ticket already on the job — a manager's call).
    var canEditRecipe = !lithoUser || lithoUser.manager;
    var recipeItems = currentJob.coatings.map(function (c) {
      return '<li><strong>' + esc(c.item) + '</strong>' +
        '<span class="sub"> &middot; ' + esc(c.group || '') + (c.sub ? ' ' + esc(c.sub) : '') + '</span></li>';
    }).join('');
    html += '<div class="card">' +
      '<div class="ticket-id">' + esc(currentJob.description || '(untitled job)') + '</div>' +
      '<div class="sub" style="margin-bottom:10px">Job ' + esc(currentJob.jobId) + '</div>' +
      '<h4 style="margin:0 0 4px;font-size:13px;color:var(--muted)">Coatings on this job (' + currentJob.coatings.length + ')</h4>' +
      '<ul id="jobCoatingsList" style="margin:0;padding-left:20px;line-height:1.7">' + (recipeItems || '<li class="sub">None</li>') + '</ul>' +
      '<div class="sub" style="margin-top:8px">Every ticket you add gets all of these coatings.</div>' +
      '</div>';

    // What's already on the job comes first, then the recipe editor, then the ticket picker —
    // so when you reopen a job you see its current state before adding more.
    html += '<div class="card">' +
      '<h4 style="margin-bottom:6px;font-size:13px;color:var(--muted)">Tickets added to this job so far (<span id="jobAddedCount">0</span>)</h4>' +
      '<div id="jobAddedList" class="sub">None yet.</div>' +
      '</div>';

    // Add another coating to the job's recipe (applies to tickets already on it). Same control as
    // the Review Jobs view, so a resumed job can grow its recipe without going through Review.
    if (canEditRecipe) html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Add a coating to this job</h3>' +
      '<div class="sub" style="margin-bottom:8px">Applies to every ticket already on the job.</div>' +
      '<div class="row">' +
        selectField('jobAddCoatGroup', 'Size / Group', rateGroups(), null) +
        selectField('jobAddCoatSub', '#OUT', [], null) +
        selectField('jobAddCoatItem', 'Coating Item', [], null) +
        selectField('jobAddCoatChem', 'Chem Code', [], null) +
      '</div>' +
      operatorFieldHtml('jobAddCoatOperator') +
      '<div id="jobAddCoatPreview" class="sub" style="margin:6px 0"></div>' +
      '<button class="btn secondary" id="jobAddCoatBtn">Add Coating</button>' +
      '</div>';

    html += '<div class="card" id="jobPickedTicketCard" style="display:none"></div>';

    html += '<div class="card">' +
      '<h3 style="margin-top:0;font-size:15px">Add a ticket</h3>' +
      operatorFieldHtml('jobTicketOperator', 'Your name (logged on each ticket you add)', lastOperator || (currentJob.resumed ? '' : currentJob.operator)) +
      searchBarHtml('jobTicketSearch') +
      '<div id="jobQueuePicker" style="margin-top:10px"></div>' +
      '</div>';

    html += '<div class="card">' +
      (canEditRecipe
        ? '<div class="sub" style="margin-bottom:10px">Tickets you add are logged as <strong>Pending</strong>. Review and approve the job in <strong>Review Jobs</strong> to send them all to WIP.</div>' +
          '<button class="btn secondary" id="finishJobBtn" style="width:100%">Done — Back to Tickets</button>'
        : '<div class="sub" style="margin-bottom:10px">Tickets you add are logged as <strong>Pending</strong> until a manager approves the job.</div>' +
          '<button class="btn secondary" id="finishJobBtn" style="width:100%">Done</button>') +
      '</div>';

    view.innerHTML = html;

    var jobTicketSearch = document.getElementById('jobTicketSearch');
    jobTicketSearch.oninput = function () { renderJobQueuePicker(jobTicketSearch.value); };
    // Land the cursor on the ticket-number field so you can start typing right away — this
    // screen re-renders after each add, so the cursor returns here for the next ticket too.
    if (jobTicketSearch.focus) jobTicketSearch.focus();
    if (!queueCache.length) {
      fetchTickets(function () { renderJobQueuePicker(''); });
    } else {
      renderJobQueuePicker('');
    }

    renderJobAddedList();

    // Add-coating cascade + button (grows the job's recipe from this screen).
    var acGroup = document.getElementById('jobAddCoatGroup'), acSub = document.getElementById('jobAddCoatSub'),
        acItem = document.getElementById('jobAddCoatItem'), acChem = document.getElementById('jobAddCoatChem'),
        acCost = document.getElementById('jobAddCoatPreview');
    if (acGroup) wireCoatingCascade(acGroup, acSub, acItem, acChem, acCost, function (c) { return 'Adds ' + money(c) + ' per ticket.'; });
    if (acGroup) document.getElementById('jobAddCoatBtn').onclick = function () {
      var operator = document.getElementById('jobAddCoatOperator').value.trim();
      if (!acGroup.value || !acItem.value) { toast('Pick a group and coating item'); return; }
      if (!operator) { toast('Enter an operator name'); return; }
      var btn = document.getElementById('jobAddCoatBtn'); btn.disabled = true;
      runMutation('addCoatingToJob', [currentJob.jobId, { group: acGroup.value, sub: acSub.value, item: acItem.value }, operator, newOpId()],
        function () {
          currentJob.coatings.push({ group: acGroup.value, sub: acSub.value, item: acItem.value });
          toast('Coating added to job');
          renderCreateJobAddTickets();   // refresh the recipe line and reset the picker
        },
        function (err) { showModal({ title: 'Could not add coating', message: err.message, confirmText: 'OK' }); btn.disabled = false; });
    };

    document.getElementById('finishJobBtn').onclick = function () {
      document.getElementById('backBtn').click();
    };
  }

  function renderJobQueuePicker(searchTerm) {
    var container = document.getElementById('jobQueuePicker');
    if (!container) return;
    var term = (searchTerm || '').trim().toLowerCase();
    // Workers don't browse the ticket list — they scan or type the ticket they have in hand.
    if (!term && lithoUser && !lithoUser.manager) { container.innerHTML = '<div class="sub">Scan or type a ticket number.</div>'; return; }
    var rows = term ? queueCache.filter(function (q) { return String(q.ticket).toLowerCase().indexOf(term) !== -1; }) : queueCache.slice(0, 15);

    if (!rows.length) {
      var checking = recheckOnMiss(term, function () { var i = document.getElementById('jobTicketSearch'); if (i) renderJobQueuePicker(i.value); });
      container.innerHTML = '<div class="sub">No matches.' + (checking ? CHECKING_HTML : '') + '</div>'; return;
    }
    var html = '';
    rows.forEach(function (q) {
      html += '<div class="queue-item" data-ticket="' + esc(q.ticket) + '" style="padding:6px 0">' +
        '<div style="min-width:0"><span class="ticket-id" style="font-size:14px">' + esc(q.ticket) + '</span> ' +
        '<span class="sub">' + esc(q.endUse) + ' &middot; ' + esc(q.qty || 0) + ' sheets</span>' +
        '<div class="specs"><span><b>BW</b> ' + esc(q.bw) + '</span><span><b>Type</b> ' + esc(q.type) +
        '</span><span><b>Temper</b> ' + esc(q.temper) + '</span></div></div>' +
        '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-pick="' + esc(q.skidId) + '">Select</button>' +
      '</div>';
    });
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll('[data-pick]'), function (btn) {
      btn.onclick = function () {
        var sk = btn.getAttribute('data-pick');
        var entry = queueCache.filter(function (q) { return q.skidId === sk; })[0];
        renderPickedTicketCard(sk, entry);
      };
    });
  }

  // Tested BW: the basis weight measured on the floor for this skid (the ticket's BW is nominal).
  // Optional; saved to the skid's 'Tested BW' column when the ticket is added to a job.
  function testedBwFieldHtml(id, entry) {
    return '<div class="field"><label>Tested BW (optional' + (entry && entry.bw ? ' — ticket says ' + esc(entry.bw) : '') + ')</label>' +
      '<input type="number" inputmode="decimal" step="0.01" min="0" id="' + id + '" placeholder="e.g. 75.2" value="' + esc(entry && entry.testedBw ? entry.testedBw : '') + '"></div>';
  }
  // Returns '' (left blank), the cleaned number as a string, or null if it isn't a valid number.
  function readTestedBw(id) {
    var el = document.getElementById(id);
    var v = el ? String(el.value || '').replace(/[,\s]/g, '') : '';
    if (v === '') return '';
    return (isFinite(Number(v)) && Number(v) > 0) ? v : null;
  }

  // An older Worker ignores the Tested BW without saying so; it only confirms it when saved.
  function warnIfTestedBwDropped(sent, result) {
    if (sent && !(result && result.testedBw != null && result.testedBw !== ''))
      showModal({ title: 'Tested BW not saved', message: 'The ticket was added, but the server didn’t save the Tested BW (' + sent + '). The server needs its latest update — enter it in the Database tab for now.', confirmText: 'OK' });
  }

  function renderPickedTicketCard(skidId, entry) {
    var card = document.getElementById('jobPickedTicketCard');
    var origQty = entry ? Number(entry.qty) || 0 : 0;
    var origWeight = entry ? Number(entry.weight) || 0 : 0;
    var weightPerSheet = origQty > 0 ? (origWeight / origQty) : 0;

    card.style.display = 'block';
    var specsHtml = entry ? ('<div class="specs" style="margin-bottom:10px">' +
      '<span><b>BW</b> ' + esc(entry.bw) + '</span><span><b>Type</b> ' + esc(entry.type) + '</span>' +
      '<span><b>Temper</b> ' + esc(entry.temper) + '</span><span><b>L</b> ' + esc(entry.length) + '</span>' +
      '<span><b>W</b> ' + esc(entry.width) + '</span><span><b>End Use</b> ' + esc(entry.endUse) + '</span></div>') : '';
    card.innerHTML =
      '<div class="ticket-id">' + esc(entry ? entry.ticket : skidId) + '</div>' +
      '<div class="sub" style="margin-bottom:6px">' + esc(origQty) + ' sheets on hand &middot; ~' + esc(origWeight) + ' lbs</div>' +
      specsHtml +
      (origQty > 0
        ? '<div class="field"><label>Sheets run</label>' +
            '<input type="number" inputmode="numeric" id="sheetsRunInput" value="' + esc(origQty) + '" min="1" max="' + esc(origQty) + '"></div>' +
          '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;margin-bottom:6px">' +
            '<input type="checkbox" id="partialSkidToggle" style="width:18px;height:18px"> ' +
            'This is a partial skid — return leftovers to Current Steel' +
          '</label>' +
          '<div class="sub" id="sheetsRunPreview" style="margin-bottom:10px"></div>'
        : '<div class="sub" style="margin-bottom:10px">No sheet count on this ticket — the whole skid runs as-is.</div>') +
      testedBwFieldHtml('jobTestedBw', entry) +
      '<div class="field"><label>Litho Notes (optional)</label>' +
        '<input id="lithoNoteInput" placeholder="Note kept with this ticket"></div>' +
      '<button class="btn" id="addTicketToJobBtn">Add to Job</button>';

    if (card.scrollIntoView) card.scrollIntoView({ block: 'start' });

    var sheetsRunInput = document.getElementById('sheetsRunInput');
    var preview = document.getElementById('sheetsRunPreview');
    var partialToggle = document.getElementById('partialSkidToggle');

    function updatePreview() {
      if (!preview || !sheetsRunInput) return;
      var sheets = Number(sheetsRunInput.value) || 0;
      var estWeight = Math.round(sheets * weightPerSheet * 100) / 100;
      var remSheets = origQty - sheets;
      if (remSheets <= 0) {
        preview.textContent = 'Full skid: ' + sheets + ' sheets (~' + estWeight + ' lbs, estimated).';
      } else if (partialToggle.checked) {
        var remWeight = Math.round((origWeight - estWeight) * 100) / 100;
        preview.textContent = 'Partial skid: ' + sheets + ' sheets coated (~' + estWeight + ' lbs) become a new -LR# ticket. The other ' +
          remSheets + ' sheets (~' + remWeight + ' lbs) stay as ' + clientBaseTicket(entry ? entry.ticket : '') + ' in Current.';
      } else {
        preview.textContent = sheets + ' sheets run. ' + remSheets +
          ' leftover sheets will be scrapped (not returned to Current Steel).';
      }
    }
    if (sheetsRunInput) sheetsRunInput.oninput = updatePreview;
    clampSheets(sheetsRunInput, origQty);
    if (partialToggle) partialToggle.onchange = updatePreview;
    updatePreview();

    document.getElementById('addTicketToJobBtn').onclick = function () {
      var sheetsRun = sheetsRunInput ? sheetsRunInput.value : '';
      var lithoNote = document.getElementById('lithoNoteInput').value;
      var isPartialSkid = !!(partialToggle && partialToggle.checked);
      var sErr = sheetsError(sheetsRun, origQty);
      if (sErr) { toast(sErr); return; }
      var testedBw = readTestedBw('jobTestedBw');
      if (testedBw === null) { toast('Tested BW must be a number, e.g. 75.2'); return; }
      var opEl = document.getElementById('jobTicketOperator');
      var operator = opEl ? opEl.value.trim() : currentJob.operator;
      if (!operator) { toast('Enter your name first'); if (opEl) opEl.focus(); return; }
      var btn = document.getElementById('addTicketToJobBtn');

      function submit(coatedTicket) {
        btn.disabled = true; btn.textContent = 'Adding…';
        runMutation('jobAddTicket',
          [currentJob.jobId, skidId, sheetsRun, isPartialSkid, lithoNote, operator, newOpId(), coatedTicket || '', testedBw],
          function (result) {
            if (result && result.duplicate) { toast('Already recorded'); btn.disabled = false; btn.textContent = 'Add to Job'; return; }
            warnIfTestedBwDropped(testedBw, result);
            jobAddedTickets.push(result);
            var msg = 'Added ' + result.ticket;
            if (result.isPartial && result.remainderTicket) msg += ' — ' + result.remainderSheets + ' sheets stay as ' + result.remainderTicket;
            else if (result.scrapSheets) msg += ' — ' + result.scrapSheets + ' sheets scrapped';
            else msg += ' to job';
            toast(msg);
            card.style.display = 'none';
            document.getElementById('jobTicketSearch').value = '';
            dropFromQueueCache(skidId); // no longer Current — remove from picker right away
            renderJobQueuePicker('');
            renderJobAddedList();
            // No reload here (one per ticket added adds up): the picker already dropped this skid,
            // the list reloads on the next visit since this device saved, and a search for a new
            // split remainder that isn't in the list re-checks the server.
          },
          function (err) {
            toast('Error: ' + err.message);
            btn.disabled = false; btn.textContent = 'Add to Job';
          });
      }

      // Partial skid: coated batch becomes a new -LR# ticket, auto-assigned by the worker. Naming
      // prompt intentionally turned off (per request) so no one can renumber a ticket during a split.
      if (isPartialSkid) {
        var baseTk = clientBaseTicket(entry ? entry.ticket : '');
        var ran = Number(sheetsRun) || 0;
        showConfirm('Add to Job',
          'Coating ' + ran + ' of ' + origQty + ' sheets. The coated batch joins the job with an auto-assigned -LR# ticket; the remaining ' + (origQty - ran) + ' sheets stay as ' + baseTk + ' in Current.',
          function () { submit(''); });
      } else {
        submit('');
      }
    };
  }

  function renderJobAddedList() {
    var container = document.getElementById('jobAddedList');
    var countEl = document.getElementById('jobAddedCount');
    if (countEl) countEl.textContent = jobAddedTickets.length;
    if (!container) return;
    if (!jobAddedTickets.length) { container.innerHTML = 'None yet.'; return; }
    var html = '<table><thead><tr><th>Ticket</th><th>Sheets Run</th><th>Est. Weight</th><th>Tested BW</th><th>Remainder / Scrap</th></tr></thead><tbody>';
    jobAddedTickets.forEach(function (r) {
      var last = r.remainderTicket
        ? esc(r.remainderTicket) + ' (' + esc(r.remainderSheets) + ' sheets)'
        : (r.scrapSheets ? esc(r.scrapSheets) + ' scrapped' : '&mdash;');
      // Resumed tickets carry no sheets/weight detail — show a dash instead of "undefined".
      var sheetsCell = (r.sheetsRun || r.sheetsRun === 0) ? esc(r.sheetsRun) : '&mdash;';
      var weightCell = (r.estimatedWeightUsed || r.estimatedWeightUsed === 0) ? esc(r.estimatedWeightUsed) + ' lbs' : '&mdash;';
      html += '<tr><td>' + esc(r.ticket) + '</td><td>' + sheetsCell + '</td><td>' + weightCell + '</td>' +
        '<td>' + (r.testedBw ? esc(r.testedBw) : '&mdash;') + '</td><td>' + last + '</td></tr>';
    });
    html += '</tbody></table>';

  // ================= PRODUCTION department =================================================
  // Mirrors the Litho job flow, but tracks skid USAGE instead of coating: a "run" is one
  // Line/Press; skids are loaded onto it (-> In Production, Loaded On stamped), the run is
  // submitted for review, then Finish Work marks them Used (with partial-usage split) and
  // stamps Used At with the full date + time (the Used-in-Production quick-mark writes date only).
  var currentRun = null;     // { runId, machine, operator } — the run being built
  var runAddedSkids = [];    // running display list of skids loaded this session
  var prodReviewDate = '';   // yyyy-MM-dd; '' means today
  var runSwapSkid = null;    // when set, the next picked skid replaces this one on the run
  var metalsTab = 'lines';   // Metals sub-nav: 'lines' | 'press' | 'slitter' | 'coil' | 'used'
  // The machines on the floor, picked from a list (no typing). Stored as shown, e.g. 'Press 13'.
  var PRESS_MACHINES = ['A Liner', 'Press 2', 'Press 3', 'Press 13', 'Press 14', 'Press 15', 'Press 16', 'Press 17', 'Press 18', 'Press 19', 'Press 20'];
  var SLITTER_MACHINES = ['1 H', '2 H', '7 A', '9 A'];
  var SCROLL_MACHINES = ['2 SS', '3 SS'];
  var currentSlitter = null; // { sessionId, slitter, kind, operator } — the cutting session being logged
  var slitKind = 'Slitter';  // Slitter Department sub-tab: 'Slitter' | 'Scroll'
  var reviewRunMachineType = null; // machine type of the run open in Review (scopes its picker)
  var slitPickMode = null;   // when set, the session screen shows a skid picker: 'load' | 'switch'
  var slitPendingStrips = 0; // pieces-on-pallet count captured before a switch, passed to slitterSwitchSkid

  function openProduction() {
    state.view = 'metalsHome'; state.runId = null; runSwapSkid = null;
    nextViewToken();
    showTabbar(false); showBack(true); setDept('Metals');
    renderMetalsChooser();
  }

  // Metals is 3 departments. The chooser is a screen of BIG buttons (like the landing tiles) —
  // pick one and you go fully into that section. Metal Lines and Press Department share the run
  // flow (only "Line #" vs "Press #" differs); Slitter is a separate log-only module.
  function renderMetalsChooser() {
    state.view = 'metalsHome';
    nextViewToken();
    showTabbar(false); showBack(true); setDept('Metals');
    var view = document.getElementById('view');
    view.innerHTML =
      '<div class="sub" style="margin:4px 0 16px;font-size:16px">Which department are you working in?</div>' +
      '<button class="btn" id="metalsPickLines" style="width:100%;padding:30px;font-size:22px;margin-bottom:14px">🏭&nbsp; Metal Lines</button>' +
      '<button class="btn" id="metalsPickPress" style="width:100%;padding:30px;font-size:22px;margin-bottom:14px">🛠️&nbsp; Press Department</button>' +
      '<button class="btn" id="metalsPickSlitter" style="width:100%;padding:30px;font-size:22px;margin-bottom:14px">✂️&nbsp; Slitter Department</button>' +
      '<button class="btn" id="metalsPickCoil" style="width:100%;padding:30px;font-size:22px;margin-bottom:14px">🧵&nbsp; Coil Line</button>' +
      (FULL_APP ?
        '<button class="btn success" id="metalsPickUsed" style="width:100%;padding:30px;font-size:22px">✅&nbsp; Used in Production</button>' +
        '<button class="btn" id="metalsPrintTickets" style="width:100%;padding:30px;font-size:22px;margin-top:14px">🖨️&nbsp; Print New Steel Tickets</button>' +
        '<div class="sub" style="margin:8px 0 0;text-align:center">Opens the steel-ticket printer (local network only).</div>' : '');
    document.getElementById('metalsPickLines').onclick = function () { openMetalsSection('lines'); };

    document.getElementById('metalsPickSlitter').onclick = function () { openMetalsSection('slitter'); };

  // Enter a chosen department full-screen. Back from a section home returns to the chooser.
  function openMetalsSection(tab) {
    if (tab === 'used' && !FULL_APP) { renderMetalsChooser(); return; }
    metalsTab = tab;

    if (tab === 'slitter') { state.view = 'slitterHome'; renderSlitterHome(); }
    else if (tab === 'used') { state.view = 'usedHome'; renderUsedHome(); }
