<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --ink: #131b2e;
    --muted: #6b7280;
    --line: #dfe3ea;
    --accent: #0f2350;      /* navy sampled from the logo */
    --accent-dark: #0a1836;
    --good: #0f7a3d;
    --bg: #eef1f6;
    --card: #ffffff;
    --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  #app { max-width: 900px; margin: 0 auto; padding: 16px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; flex-wrap: wrap; gap: 8px; position: relative;
    border-bottom: 3px solid var(--accent); padding-bottom: 10px;
  }
  .dept {
    flex: 1; text-align: center; min-width: 0; font-size: 16px; font-weight: 700;
    color: var(--accent); pointer-events: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo { height: 40px; width: auto; flex: 0 0 auto; display: block; }
  header h1 { font-size: 20px; margin: 0; color: var(--accent); letter-spacing: .2px; }
  .header-right { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .header-right a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .version { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  header button {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; cursor: pointer;
  }
  .tabbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabbar button {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--muted);
  }
  .tabbar button.active { background: var(--accent); color: white; border-color: var(--accent); }
  .searchrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .searchwrap { position: relative; flex: 1; min-width: 0; height: 48px; }
  .searchwrap input {
    width: 100%; height: 48px; padding: 0 14px 0 42px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
  }
  .searchwrap input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 35, 80, .16);
  }
  .searchwrap .mag {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; pointer-events: none;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 12px;
  }
  .queue-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; cursor: pointer;
  }
  .queue-item + .queue-item { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .ticket-id { font-weight: 700; font-size: 16px; }
  .sub { color: var(--muted); font-size: 13px; }
  .specs { color: var(--ink); font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .specs b { color: var(--muted); font-weight: 600; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .badge.notstarted { background: #eef2ff; color: #3730a3; }
  .badge.inprogress { background: #fff7e6; color: var(--warn); }
  .badge.wip { background: #eafaf0; color: var(--good); }
  .badge.production { background: #e8edf8; color: #1e3a8a; }
  .badge.used { background: #edeff2; color: #4b5563; }
  .bwtag {
    display: inline-block; background: var(--accent); color: #fff; border-radius: 6px;
    padding: 2px 9px; font-weight: 700; font-size: 13px; margin-right: 8px; white-space: nowrap;
  }
  .btn {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.success { background: var(--good); }
  .btn.danger { background: #c0392b; }
  .btn.danger:hover { background: #a5311f; }
  .btn.warn { background: #b26a00; }
  .btn.warn:hover { background: #935700; }
  .ticket-link { color: var(--accent); font-weight: 600; text-decoration: underline; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .colgrid { display: flex; gap: 16px; flex-wrap: wrap; }
  .colstack { flex: 1; min-width: 150px; }
  .colstack .field { min-width: 0; }
  .field { flex: 1; min-width: 160px; margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field select, .field input, .field textarea {
    width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px;
  }
  /* iPad: iOS zooms the page when a focused field's text is under 16px, so no field goes below it
     (this also beats the small inline sizes some list inputs set). Tap targets are at least 44px. */
  input:not([type=checkbox]):not([type=radio]), select, textarea { font-size: 16px !important; }
  .btn, header button, .tabbar button { min-height: 44px; min-width: 44px; }
  .stat { text-align: center; }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .steel-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 13px; }
  .steel-meta div span { display: block; color: var(--muted); font-size: 11px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 10px 18px; border-radius: 8px; font-size: 14px;
    opacity: 0; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .dbtable { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  .dbtable th, .dbtable td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .dbtable thead th { background: var(--card); position: sticky; top: 0; font-weight: 700; }
  .dbtable tbody tr { cursor: pointer; }
  .dbtable tbody tr:hover td { background: #eef2ff; }
  .dbtable .dbsticky { position: sticky; left: 0; background: var(--card); z-index: 1; }
  .gate { max-width: 380px; margin: 60px auto; text-align: center; }
  .gate h2 { margin-bottom: 4px; }
  .gate p { color: var(--muted); font-size: 14px; margin-top: 0; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(19, 27, 46, .55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000;
  }
  .modal {
    background: var(--card); border-radius: 16px; max-width: 440px; width: 100%;
    padding: 24px; box-shadow: 0 16px 48px rgba(10, 24, 54, .35);
    max-height: calc(100vh - 40px); display: flex; flex-direction: column;
  }
  .modal p { overflow-y: auto; min-height: 0; overflow-wrap: anywhere; }
  .modal .modal-icon {
    width: 46px; height: 46px; border-radius: 50%; background: #eafaf0; color: var(--good);
    display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px;
  }
  .modal h3 { margin: 0 0 8px; color: var(--ink); font-size: 19px; }
  .modal p { color: var(--muted); font-size: 15px; margin: 0 0 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* Wide content (tables) scrolls inside its card instead of stretching the page. */
  .card { overflow-x: auto; }

  /* Phone-friendly: bigger text/targets, no accidental horizontal scroll, 16px inputs so
     iOS doesn't zoom on focus. */
  @media (max-width: 600px) {
    body { font-size: 16px; }
    #app { padding: 10px; }
    header h1 { font-size: 17px; }
    .dept { font-size: 14px; }
    .brand .logo { height: 32px; }
    .brand { gap: 8px; }
    .card { padding: 13px; }
    .field select, .field input, .field textarea { font-size: 16px; padding: 12px; }
    .btn { padding: 14px 16px; font-size: 16px; }
    .tabbar { gap: 6px; }
    .tabbar button { padding: 12px 4px; font-size: 13px; }
    .ticket-id { font-size: 15px; }
    .sub { font-size: 13px; }
    .specs { font-size: 12px; }
    table { font-size: 12.5px; }
    th, td { padding: 6px 6px; }
    .searchwrap input { font-size: 16px; }
  }

  /* Printable check sheet (hidden on screen; shown only when printing / Save as PDF).
     Styled to mirror the Container Supply paper check sheet: company header, right-aligned
     title, BW color-coded packed columns, a center check column. print-color-adjust:exact
     keeps the BW colors + navy header from being stripped by the browser's print engine. */
  #printArea { display: none; }
  @media print {
    @page { size: letter portrait; margin: 0.5in; }
    #app, #toast, #modalRoot, datalist { display: none !important; }
    #printArea { display: block !important; color: #000; }
    #printArea .cs-date { font-size: 8pt; color: #646464; }
    #printArea .cs-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 3px; }
    #printArea .cs-co { font-size: 14pt; font-weight: bold; color: #141414; }
    #printArea .cs-title { font-size: 11pt; color: #323232; }
    #printArea .cs-rule { border: 0; border-top: 0.75pt solid #505050; margin: 4px 0 8px; }
    #printArea table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    #printArea th { background: #193264; color: #fff; font-size: 7pt; font-weight: bold; text-align: center;
      padding: 3px 2px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #printArea td { font-size: 8pt; border: 0.5pt solid #cfcfcf; padding: 2px 3px; text-align: center;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #printArea td.tk, #printArea th.tk { text-align: left; }
    #printArea td.bw { font-weight: bold; }
    #printArea .cs-sep { border-left: 1.5pt solid #9fb0cc; }
    #printArea .ckbox { display: inline-block; width: 12px; height: 12px; border: 1px solid #777;
      line-height: 11px; font-size: 9pt; color: #0a7a26; font-weight: bold; }
    #printArea h2 { margin: 0 0 4px; font-size: 16pt; }
    #printArea .pmeta { font-size: 9pt; color: #555; margin-bottom: 8px; }
  }
</style>

  // Once the action succeeds, the next identical tap is a brand-new action again.
  var stickyOps = {};
  function isOpId(a) { return typeof a === 'string' && /^op-\d+-[a-z0-9]+$/.test(a); }
  function mutationKey(fnName, args) {
    try { return fnName + '|' + JSON.stringify(args.map(function (a) { return isOpId(a) ? '#op' : a; })); }
    catch (e) { return null; }
  }
  function runMutation(fnName, args, onSuccess, onFailure) {
    var key = mutationKey(fnName, args);
    if (key && stickyOps[key]) args = args.map(function (a) { return isOpId(a) ? stickyOps[key] : a; });
    var attempts = 0;
    function attempt() {
      attempts++;
      var runner = google.script.run.withSuccessHandler(function (res) {
        if (key) delete stickyOps[key];
        lastSaveAt = Date.now();
        onSuccess(res);
      }).withFailureHandler(function (err) {
        if (err && err.transport && !err.timeout && attempts < 3) { setTimeout(attempt, attempts * 1000); return; }
        lastSaveAt = Date.now();   // part of it may have saved, so cached lists are no longer trusted
        var op = args.filter(isOpId)[0];
        if (key && op) stickyOps[key] = op;
        if (onFailure) onFailure(err);
      });
      runner[fnName].apply(runner, args);
    }
    attempt();
  }

  // Steel-spec fields captured on Add Ticket and Edit ticket details. `col` is the Steel
  // Tickets column; `id` is the input id (prefixed to keep Add vs Edit distinct). Laid out in
  // three fixed columns (TICKET_COLUMNS) mirroring the paper ticket.
  var TICKET_FIELDS = [
    { id: 'Qty', col: 'QTY/LOAD', label: 'QTY', num: true },
    { id: 'BC', col: 'B/C', label: 'B/C' },
    { id: 'Type', col: 'TC', label: 'Type' },
    { id: 'Length', col: 'Length', label: 'Length' },
    { id: 'Mill', col: 'Mill', label: 'Mill' },
    { id: 'BW', col: 'BW', label: 'Basis Weight' },
    { id: 'CoilSheet', col: 'C/S', label: 'Coil / Sheet' },
    { id: 'EndUse', col: 'End Use', label: 'End Use' },
    { id: 'Supplier', col: 'Supplier', label: 'Supplier' },
    { id: 'Temper', col: 'TM', label: 'Temper' },
    { id: 'Width', col: 'Width', label: 'Width' },
    { id: 'Weight', col: 'Weight', label: 'Weight', num: true },
    { id: 'Comments', col: 'Comments', label: 'Comments' }
  ];
  var TICKET_COLUMNS = [
    ['Qty', 'BC', 'Type', 'Length', 'Mill'],
    ['BW', 'CoilSheet', 'EndUse'],
    ['Supplier', 'Temper', 'Width', 'Weight', 'Comments']
  ];

  // Renders the steel-spec inputs in three columns (prefix keeps Add vs Edit ids distinct);
  // prefill from a steel row.
  function ticketFieldsHtml(prefix, steel) {
    steel = steel || {};
    function fieldHtml(id) {
      var f = TICKET_FIELDS.filter(function (x) { return x.id === id; })[0];
      if (!f) return '';
      var val = steel[f.col] != null ? steel[f.col] : '';
      return '<div class="field"><label>' + esc(f.label) + '</label>' +
        '<input id="' + prefix + f.id + '"' + (f.num ? ' type="number" min="0" inputmode="' + (f.id === 'Weight' ? 'decimal' : 'numeric') + '"' : '') + ' value="' + esc(val) + '"></div>';
    }
    return '<div class="colgrid">' + TICKET_COLUMNS.map(function (col) {
      return '<div class="colstack">' + col.map(fieldHtml).join('') + '</div>';
    }).join('') + '</div>';
  }

  // Collects the steel-spec inputs back into a { column: value } object for the server.
  function collectTicketFields(prefix) {
    var out = {};
    TICKET_FIELDS.forEach(function (f) {
      var el = document.getElementById(prefix + f.id);
      if (el) out[f.col] = el.value;
    });
    return out;
  }

  // Operator name field markup — a text input with a datalist of suggestions.
  // Fill OPERATOR_NAMES in Code.gs and it shows up here automatically; typing still
  // works even with an empty list so nobody's blocked in the meantime.
  function operatorFieldHtml(id, label, value) {
    return '<div class="field"><label>' + esc(label || 'Operator name') + '</label>' +
      '<input id="' + id + '" list="operatorNamesList" value="' + esc(value || lastOperator) + '" placeholder="Select or type a name" autocomplete="off"></div>';
  }

  // Best guess at who ran/entered a skid, used to prefill the operator on edit forms so the
  // person making a correction doesn't have to re-type it (they can still change it).
  function whoRanIt(steel) {
    steel = steel || {};
    return steel['First Coated By'] || steel['Last Updated By'] || '';
  }

  // Foreman picker: a dropdown of known foremen plus "Other", which reveals a free-text box.
  var FOREMEN = ['Joel', 'Alex'];
  var FOREMAN_OTHER = '__OTHER__';
  function foremanFieldHtml(prefix, label) {
    var opts = FOREMEN.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
    return '<div class="field"><label>' + esc(label || 'Foreman name') + '</label>' +
      '<select id="' + prefix + 'Sel"><option value="">--</option>' + opts +
        '<option value="' + FOREMAN_OTHER + '">Other</option></select>' +
      '<input id="' + prefix + 'Other" placeholder="Enter name" autocomplete="off" style="display:none;margin-top:8px"></div>';
  }
  function wireForemanField(prefix) {
    var sel = document.getElementById(prefix + 'Sel');
    var other = document.getElementById(prefix + 'Other');
    if (!sel || !other) return;
    sel.onchange = function () {
      var isOther = sel.value === FOREMAN_OTHER;
      other.style.display = isOther ? 'block' : 'none';
      if (isOther) other.focus(); else other.value = '';
    };
  }
  function foremanValue(prefix) {
    var sel = document.getElementById(prefix + 'Sel');
    if (!sel) return '';
    if (sel.value === FOREMAN_OTHER) {
      var other = document.getElementById(prefix + 'Other');
      return other ? other.value.trim() : '';
    }
    return sel.value.trim();
  }

  // Monotonic guard against stale async responses clobbering the current view. Each render
  // that overwrites #view claims a token; a late server response only writes if its token is
  // still current. Without this, e.g. an in-flight getAllTickets from "Back to Tickets" can
  // overwrite the Review Jobs list you navigated to a moment later.
  var viewToken = 0;
  function nextViewToken() { return ++viewToken; }

  // (Operator names aren't fetched: the Worker has no name list and always answered [], so that
  // call was a wasted request on every page load. Names typed this session fill the list instead.)
  function boot() {
    var dl = document.getElementById('operatorNamesList');
    if (dl) dl.innerHTML = LITHO_USERS.map(function (u) { return '<option value="' + esc(u.name) + '">'; }).join('');
    loadRateData();
    if (!FULL_APP) { var ver = document.getElementById('appVersion'); if (ver) ver.textContent += ' · tablet'; }
    renderLanding();
  }

  function showTabbar(show) { document.getElementById('tabbar').style.display = show ? 'flex' : 'none'; }
  function showBack(show) { document.getElementById('backBtn').style.display = show ? 'inline-block' : 'none'; }
  function setDept(name) { var el = document.getElementById('deptLabel'); if (el) el.textContent = name || ''; }

  // Single Back handler routed by the current view. The app has three top-level screens
  // (landing -> Litho / Production), each with their own drill-ins.
  document.getElementById('backBtn').onclick = function () {
    // Drilled into a ticket from a job? Back returns to that job.
    if (state.view === 'card' && state.returnToJobId) {
      var jid = state.returnToJobId; state.returnToJobId = null;
      openJob(jid);
      return;
    }
    // Drilled into a ticket from the global Search screen? Back returns to Search.
    if (state.view === 'card' && state.returnToSearch) {
      state.returnToSearch = false;
      openSearch();
      return;
    }
    switch (state.view) {
      case 'search': renderLanding(); return;              // global search -> landing
      case 'reports': renderLanding(); return;
      case 'count':
        // Within a count, Back steps back through the sub-screens before leaving.
        if (countMode === 'reviewPromote' || countMode === 'reviewMissing') { countMode = 'walk'; renderCount(); return; }
        if (countMode === 'missing' || countMode === 'history') { countMode = countSummary ? 'summary' : 'walk'; renderCount(); return; }
        renderLanding(); return;
      case 'card': case 'review': case 'job': case 'createJob': case 'addTicket': case 'openJobs': openLitho(); return;
      case 'all': openLithoDept(); return;                 // litho home -> Litho Department chooser
      case 'lithoLogin': case 'moveWip': openLithoDept(); return;
      case 'lithoDept': renderLanding(); return;
      case 'metalsHome': renderLanding(); return;          // department chooser -> landing
      case 'prodHome': case 'slitterHome': case 'usedHome': case 'coilHome': openProduction(); return; // a section home -> chooser
      case 'prodAdd': case 'prodReview': openMetalsSection(metalsTab); return;
      case 'prodPartials': renderRunAddSkids(); return;
      case 'run': openProductionReview(); return;
      case 'slitterSession': openMetalsSection('slitter'); return; // slitter detail -> slitter home
      case 'database': renderLanding(); return;            // database home -> landing
      case 'databaseEdit': renderDatabaseHome(); return;   // row editor -> database home
      default: renderLanding(); return;
    }
  };

  // ---------------- Landing screen (three departments) ----------------
  function renderLanding() {
    state.view = 'home'; state.skid = null; state.jobId = null; state.runId = null;
    nextViewToken();
    showTabbar(false); showBack(false); setDept('');
    var view = document.getElementById('view');
    view.innerHTML =
      '<button class="btn secondary" id="tileSearch" style="width:100%;padding:22px;font-size:18px;margin-bottom:12px">🔎&nbsp; Search for a Ticket</button>' +
      '<button class="btn" id="tileLitho" style="width:100%;padding:26px;font-size:20px;margin-bottom:12px">Litho Department</button>' +
      '<button class="btn" id="tileProduction" style="width:100%;padding:26px;font-size:20px;margin-bottom:12px">Metals Department</button>' +
      (FULL_APP ? '<button class="btn secondary" id="tileReports" style="width:100%;padding:22px;font-size:18px;margin-bottom:12px">📊&nbsp; Reports</button>' : '') +
      '<button class="btn secondary" id="tileCount" style="width:100%;padding:22px;font-size:18px;margin-bottom:12px">🧮&nbsp; Litho Steel Count</button>' +
      (FULL_APP ? '<button class="btn secondary" id="tileDatabase" style="width:100%;padding:22px;font-size:18px">🗄️&nbsp; Database</button>' : '');
    document.getElementById('tileSearch').onclick = openSearch;
    document.getElementById('tileLitho').onclick = openLithoDept;
    document.getElementById('tileProduction').onclick = openProduction;
    document.getElementById('tileCount').onclick = openSteelCount;
    if (FULL_APP) {
      document.getElementById('tileReports').onclick = openReports;
      document.getElementById('tileDatabase').onclick = openDatabase;
    }
  }

  // ---------------- Database (raw table audit / manual edit) ----------------
  // A spreadsheet-like admin view of the underlying tabs, read/written BY COLUMN NAME so it matches
  // exactly what the app uses (even where the sheet header has stray duplicate columns). Two tables:
  // Steel Tickets and the Transactions audit log. Tap a row to edit its fields and save back.
  var DB_TABLE_TABS = [['master', 'Master sheet'], ['receivers', 'Receivers'], ['steel', 'Steel Tickets'], ['tx', 'Transactions']];
  var DB_ROW_CAP = 60;                          // rows rendered at once (search to narrow beyond this)
  var dbTable = 'master';
  var dbData = { steel: null, tx: null };       // cache: { headers, rows }
  var dbSearch = '';
  // No passcode: the Database only shows on computers (see FULL_APP).
  function openDatabase() {
    if (!FULL_APP) { renderLanding(); return; }
    state.view = 'database';
    nextViewToken();
    showTabbar(false); showBack(true); setDept('Database');
    dbSearch = '';
    renderDatabaseHome();
  }

  function renderDatabaseHome() {
    state.view = 'database';
    var view = document.getElementById('view');
    if (!view) return;
    nextViewToken();
    var chips = DB_TABLE_TABS.map(function (c) {
      return '<button data-dbt="' + c[0] + '"' + (dbTable === c[0] ? ' class="active"' : '') + '>' + esc(c[1]) + '</button>';
    }).join('');
    var isMaster = dbTable === 'master', isRcv = dbTable === 'receivers';
    view.innerHTML =
      '<div class="tabbar">' + chips + '</div>' +
      (isMaster ? '<div id="msBox"></div>' : isRcv ? '<div id="rcvBox"></div>' :
      '<div class="row" style="align-items:flex-end;gap:8px">' +
        '<div class="field" style="flex:1;margin:0"><label>Search this table</label><input id="dbSearch" placeholder="filter any column…" autocomplete="off" value="' + esc(dbSearch) + '"></div>' +
        '<button class="btn secondary" id="dbReload" style="margin:0">↻</button>' +
      '</div>' +
      '<div class="sub" id="dbCount" style="margin:8px 0"></div>' +
      '<div id="dbTableBox" style="overflow-x:auto;-webkit-overflow-scrolling:touch"></div>') +
      '<div class="card" style="margin-top:16px">' +
        '<h3 style="margin-top:0;font-size:15px">Snapshots</h3>' +
        '<div class="sub">A snapshot of the Current + WIP + Pending rows is saved automatically to your <b>Litho Snapshots</b> spreadsheet every weekday at 3 PM. No action needed.</div>' +
        '<div class="sub" style="margin:8px 0">Need one right now? Save one on demand — it adds a new dated tab (a second run the same day gets a &ldquo;(2)&rdquo;).</div>' +
        '<button class="btn secondary" id="dbSnapshotBtn" style="width:100%">Run snapshot now</button>' +
        '<div class="sub" id="dbSnapshotMsg" style="margin-top:8px"></div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;border:1px solid #b26a00">' +
        '<h3 style="margin-top:0;font-size:15px">Fresh start — import from Current + WIP + Used in Production tabs</h3>' +
        '<div class="sub" style="margin-bottom:10px">Paste your Access data into tabs named <b>Current</b>, <b>WIP</b> and <b>Used in Production</b> in this spreadsheet. This rebuilds <b>Steel Tickets</b> from those tabs: each row becomes a clean skid (fresh Skid ID; Status from which tab it came from) in single, non-duplicated columns.</div>' +
        '<div class="sub" style="margin-bottom:10px">Each ticket on <b>Used in Production</b> comes in once as <b>Used</b>, dated by its <b>Date Used</b> (260601-001 → June 1, 2026; the number after the dash is ignored). A ticket used on several days is dated the last day, with every day in its System Notes. A ticket still on Current / WIP stays open, with the days it was used noted. No Used in Production tab = only Current and WIP are imported.</div>' +
        '<div class="sub" style="margin-bottom:10px;color:#b26a00"><b>This wipes the current Steel Tickets tab and the Transactions audit log</b> and replaces them. Make a backup copy of the sheet first (File → Make a copy). Re-run it any time you refresh the Access data.</div>' +
        '<button class="btn warn" id="dbImportBtn" style="width:100%">Wipe &amp; import from Current + WIP + Used</button>' +
      '</div>';
    Array.prototype.forEach.call(view.querySelectorAll('[data-dbt]'), function (b) {
      b.onclick = function () {
        var go = function () { dbTable = b.getAttribute('data-dbt'); dbSearch = ''; renderDatabaseHome(); };
        if (dbTable === 'receivers' && rcvSel && rcvMarkCount() && b.getAttribute('data-dbt') !== 'receivers') {
          showConfirm('Leave without saving?', 'The tickets you marked to add or take off are not saved yet.', function () { rcvAdd = {}; rcvDrop = {}; go(); }, 'Leave', 'danger');
        } else go();
      };
    });
    document.getElementById('dbImportBtn').onclick = dbFreshImport;
    document.getElementById('dbSnapshotBtn').onclick = dbRunSnapshot;
    if (isMaster) { renderMasterSheet(); return; }
    if (isRcv) { renderReceivers(); return; }
    var s = document.getElementById('dbSearch');
    s.oninput = function () { dbSearch = s.value; renderDbTable(); };
    document.getElementById('dbReload').onclick = function () { dbData[dbTable] = null; loadDbAndRender(); };
    loadDbAndRender();
  }

  // ---------------- Database: Master sheet ----------------
  // Every Current / WIP / Used ticket (and Pending, read-only) with its live coatings. Mark changes
  // — a new status, coatings to take off — and nothing is saved until Save all, which sends the
  // whole batch in one request (masterEdit). Unsaved marks stay while the page is open.
  var msData = null, msSearch = '', msFilter = 'all', msStatus = {}, msRemove = {}, msOpen = {};
  var msRcv = {}, msRcvEdit = {}, msReceivers = [];   // receiver marks: skidId -> new receiver ('' = none)
  var MS_CAP = 100;
  var MS_STATUSES = ['Current', 'WIP', 'Used'];

  function msChanges() {
    var out = [];
    (msData || []).forEach(function (t) {
      var to = msStatus[t.skidId], passes = Object.keys(msRemove[t.skidId] || {});
      var rc = msRcv[t.skidId], rcChange = rc !== undefined && rc !== (t.receiverOwn || '');
      if ((to && to !== t.status) || passes.length || rcChange) {
        var ch = { skidId: t.skidId, from: t.status };
        if (to && to !== t.status) ch.status = to;
        if (passes.length) ch.removePasses = passes.map(Number);
        if (rcChange) ch.receiver = rc;
        out.push(ch);
      }
    });
    return out;
  }
  function msLoad() {
    var box = document.getElementById('msList');
    if (box) box.innerHTML = '<div class="loading">Loading the master sheet&hellip;</div>';
    google.script.run.withSuccessHandler(function (res) {
      msData = (res && res.rows) || [];
      msReceivers = (res && res.receivers) || [];
      Object.keys(msRcv).forEach(function (id) {
        var t = msData.filter(function (x) { return x.skidId === id; })[0];
        if (!t || (t.receiverOwn || '') === msRcv[id]) { delete msRcv[id]; delete msRcvEdit[id]; }
      });
      // Drop marks that no longer apply (ticket gone, or the coating already off).
      Object.keys(msRemove).forEach(function (id) {
        var t = msData.filter(function (x) { return x.skidId === id; })[0];
        if (!t) { delete msRemove[id]; return; }
        Object.keys(msRemove[id]).forEach(function (p) { if (!t.coatings.some(function (c) { return String(c.passNumber) === p; })) delete msRemove[id][p]; });
        if (!Object.keys(msRemove[id]).length) delete msRemove[id];
      });
      Object.keys(msStatus).forEach(function (id) {
        var t = msData.filter(function (x) { return x.skidId === id; })[0];
        if (!t || t.status === msStatus[id]) delete msStatus[id];
      });
      renderMsList();
    }).withFailureHandler(function (err) {
      if (box) box.innerHTML = '<div class="card empty">Could not load: ' + esc(err.message) + ' <button class="btn secondary" id="msRetry">Try again</button></div>';
      var r = document.getElementById('msRetry'); if (r) r.onclick = msLoad;
    }).getMasterSheet();
  }

  function renderMasterSheet() {
    var box = document.getElementById('msBox');
    if (!box) return;
    var chips = [['all', 'All'], ['Current', 'Current'], ['WIP', 'WIP'], ['Used', 'Used'], ['Pending', 'Pending']].map(function (c) {
      return '<button data-msf="' + c[0] + '"' + (msFilter === c[0] ? ' class="active"' : '') + '>' + esc(c[1]) + '</button>';
    }).join('');
    box.innerHTML =
      '<div class="sub" style="margin:4px 0 8px">Change a ticket&rsquo;s status (Current, WIP, Used) or receiver, or mark coatings to take off. Nothing saves until you tap <b>Save all</b> — then every change goes at once. Status and coating changes are logged in Transactions; receivers are just set on the ticket.</div>' +
      '<div class="row" style="align-items:flex-end;gap:8px">' +
        '<div class="field" style="flex:1;margin:0"><label>Find a ticket</label><input id="msSearch" placeholder="ticket, skid, mill, customer…" autocomplete="off" value="' + esc(msSearch) + '"></div>' +
        '<button class="btn secondary" id="msReload" style="margin:0">↻</button>' +
      '</div>' +
      '<div class="tabbar" id="msFilters" style="margin-top:8px">' + chips + '</div>' +
      '<div class="sub" id="msCount" style="margin:8px 0"></div>' +
      '<div id="msList"></div>' +
      '<div id="msBar" class="card" style="position:sticky;bottom:8px;z-index:5;display:none;border:2px solid var(--accent)">' +
        '<div class="row" style="align-items:center;gap:8px">' +
          '<div style="flex:1;font-weight:600" id="msBarText"></div>' +
          '<button class="btn secondary" id="msDiscard">Discard</button>' +
          '<button class="btn success" id="msSaveBtn">Save all</button>' +
        '</div></div>';
    var si = document.getElementById('msSearch');
    si.oninput = function () { msSearch = si.value; renderMsList(); };
    document.getElementById('msReload').onclick = msLoad;
    Array.prototype.forEach.call(box.querySelectorAll('[data-msf]'), function (b) {
      b.onclick = function () {
        msFilter = b.getAttribute('data-msf');
        Array.prototype.forEach.call(box.querySelectorAll('[data-msf]'), function (x) { x.classList.toggle('active', x === b); });
        renderMsList();
      };
    });
    document.getElementById('msDiscard').onclick = function () {
      showConfirm('Discard all marked changes?', 'Nothing has been saved yet. This clears every status change and coating removal you marked.',
        function () { msStatus = {}; msRemove = {}; msRcv = {}; msRcvEdit = {}; renderMsList(); }, 'Discard', 'danger');
    };
    document.getElementById('msSaveBtn').onclick = msSaveAll;
    if (msData) renderMsList(); else msLoad();
  }

  function renderMsList() {
    var box = document.getElementById('msList');
    if (!box || !msData) return;
    var term = String(msSearch || '').trim().toLowerCase();
    var rows = msData.filter(function (t) {
      if (msFilter !== 'all' && t.status !== msFilter) return false;
      if (!term) return true;
      return [t.ticket, t.skidId, t.mill, t.customer, t.jobId, t.po, t.receiver, t.receiverName].some(function (v) { return String(v || '').toLowerCase().indexOf(term) !== -1; });
    });
    // Changed tickets first, so marks are easy to review.
    rows.sort(function (a, b) {
      var ca = (msStatus[a.skidId] || msRemove[a.skidId] || msRcv[a.skidId] !== undefined) ? 0 : 1, cb = (msStatus[b.skidId] || msRemove[b.skidId] || msRcv[b.skidId] !== undefined) ? 0 : 1;
      return ca - cb;
    });
    var shown = rows.slice(0, MS_CAP);
    var cnt = document.getElementById('msCount');
    if (cnt) cnt.textContent = 'Showing ' + shown.length + ' of ' + rows.length + (rows.length > MS_CAP ? ' — search to narrow it down.' : '.');
    box.innerHTML = shown.length ? shown.map(msRowHtml).join('') : '<div class="card empty">No tickets match.</div>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-msst]'), function (sel) {
      sel.onchange = function () {
        var id = sel.getAttribute('data-msst');
        var t = msData.filter(function (x) { return x.skidId === id; })[0];
        if (!t || sel.value === t.status) delete msStatus[id]; else msStatus[id] = sel.value;
        renderMsList();
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-msrcvedit]'), function (b) {
      b.onclick = function () { var id = b.getAttribute('data-msrcvedit'); msRcvEdit[id] = true; renderMsList(); };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-msrcv]'), function (sel) {
      sel.onchange = function () {
        var id = sel.getAttribute('data-msrcv');
        var t = msData.filter(function (x) { return x.skidId === id; })[0];
        if (!t || sel.value === (t.receiverOwn || '')) delete msRcv[id]; else msRcv[id] = sel.value;
        renderMsList();
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-mscoats]'), function (b) {
      b.onclick = function () { var id = b.getAttribute('data-mscoats'); msOpen[id] = !msOpen[id]; renderMsList(); };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-msvoid]'), function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-msvoid'), p = b.getAttribute('data-pass');
        var m = msRemove[id] = msRemove[id] || {};
        if (m[p]) delete m[p]; else m[p] = true;
        if (!Object.keys(m).length) delete msRemove[id];
        renderMsList();
      };
    });
    var n = msChanges().length, bar = document.getElementById('msBar');
    if (bar) {
      bar.style.display = n ? '' : 'none';
      var tx = document.getElementById('msBarText');

      .concat(Object.keys(rcvDrop).map(function (s) { return { skidId: s, receiver: '', from: (byId[s] || {}).status || '' }; }));

    if (changes.length > 300) { showInfo('Too many at once', 'Save at most 300 tickets at a time.'); return; }
    var moving = Object.keys(rcvAdd).filter(function (s) { return byId[s] && byId[s].receiver; });
    var r = rcvById(id);
    showConfirm('Save ' + changes.length + ' ticket' + (changes.length === 1 ? '' : 's') + '?',
      [Object.keys(rcvAdd).length && ('Add ' + Object.keys(rcvAdd).length + ' to ' + r.name + '.'),
        moving.length && (moving.length + ' of them move off another receiver: ' + moving.slice(0, 8).map(function (s) { return byId[s].ticket + ' (' + byId[s].receiver + ')'; }).join(', ') + (moving.length > 8 ? '…' : '') + '.'),
        Object.keys(rcvDrop).length && ('Take ' + Object.keys(rcvDrop).length + ' off.')].filter(Boolean).join(' '),
      function () {
        var btn = document.getElementById('rcvSaveTickets');
        if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
        runMutation('masterEdit', [changes, '', newOpId()], function (res) {
          var saved = (res && res.saved) || [], skipped = (res && res.skipped) || [];
          saved.forEach(function (x) { delete rcvAdd[x.skidId]; delete rcvDrop[x.skidId]; });
          msData = null;   // the Master sheet shows receivers too
          showInfo('Saved', saved.length + ' ticket' + (saved.length === 1 ? '' : 's') + ' updated.' +
            (skipped.length ? ' ' + skipped.length + ' not changed: ' + skipped.map(function (x) { return (x.ticket || x.skidId) + ' (' + x.reason + ')'; }).join(', ') + '.' : ''));
          rcvLoad();
        }, function (err) {
          if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
          showModal({ title: 'Could not save', confirmText: 'OK', message: err.message + ' — Your marks are kept. Tap Save again: it finishes whatever didn\'t save and never applies a change twice.' });
        });
      }, 'Save');
  }

          (res.wip || 0) + ' WIP, ' + (res.pending || 0) + ' Pending)';

              (res && res.usedMultiDayCount ? ' ' + res.usedMultiDayCount + ' ticket' + (res.usedMultiDayCount === 1 ? ' was' : 's were') + ' used on more than one day — each came in once, dated the last day, with every day in its System Notes: ' + some(res.usedMultiDay, res.usedMultiDayCount) + '.' : '') +

              (res && res.receiversNotBackCount ? ' ' + res.receiversNotBackCount + ' ticket' + (res.receiversNotBackCount === 1 ? '' : 's') + ' that had a receiver didn’t come back on it (not in Current / WIP / Used, or the mill and ticket number changed): ' +

  function loadDbAndRender() {
    if (dbData[dbTable]) { renderDbTable(); return; }
    var box = document.getElementById('dbTableBox');
    if (box) box.innerHTML = '<div class="loading">Loading&hellip;</div>';
    var key = dbTable;
    google.script.run.withSuccessHandler(function (res) {
      dbData[key] = (res && res.headers) ? { headers: res.headers, rows: res.rows || [] } : { headers: [], rows: [] };
      if (dbTable === key) renderDbTable();
    }).withFailureHandler(function (err) {
      if (box) box.innerHTML = '<div class="sub">Could not load: ' + esc(err && err.message) + '</div>';
    }).getRawTable(key);
  }

  function renderDbTable() {
    var box = document.getElementById('dbTableBox');
    var countEl = document.getElementById('dbCount');
    if (!box) return;
    var data = dbData[dbTable];
    if (!data) { box.innerHTML = '<div class="loading">Loading&hellip;</div>'; return; }
    var term = (dbSearch || '').trim().toLowerCase();
    var rows = data.rows;
    if (term) rows = rows.filter(function (r) {
      return data.headers.some(function (h) { return String(r[h] == null ? '' : r[h]).toLowerCase().indexOf(term) !== -1; });
    });
    var total = rows.length;
    var shown = rows.slice(0, DB_ROW_CAP);
    if (countEl) countEl.textContent = 'Showing ' + shown.length + ' of ' + total + (term ? ' matching' : '') + ' — tap a row to edit.';
    if (!shown.length) { box.innerHTML = '<div class="sub">No rows' + (term ? ' match “' + esc(term) + '”.' : '.') + '</div>'; return; }
    var th = '<th class="dbsticky">#</th>' + data.headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('');
    var trs = shown.map(function (r) {
      var tds = '<td class="dbsticky" style="font-weight:600">' + esc(r.__row) + '</td>' +
        data.headers.map(function (h) { return '<td>' + esc(r[h]) + '</td>'; }).join('');
      return '<tr data-dbrow="' + esc(r.__row) + '">' + tds + '</tr>';
    }).join('');
    box.innerHTML = '<table class="dbtable"><thead><tr>' + th + '</tr></thead><tbody>' + trs + '</tbody></table>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-dbrow]'), function (tr) {
      tr.onclick = function () {
        var rn = Number(tr.getAttribute('data-dbrow'));
        var rowObj = data.rows.filter(function (x) { return x.__row === rn; })[0];
        if (rowObj) renderDbEditor(rowObj);
      };
    });
  }

  function dbSaveEditor(rowObj) {
    var view = document.getElementById('view');
    var fields = {};
    var changed = [];
    Array.prototype.forEach.call(view.querySelectorAll('.dbf'), function (el) {
      var h = el.getAttribute('data-f');
      var nv = el.value;
      var ov = rowObj[h] == null ? '' : String(rowObj[h]);
      if (String(nv) !== ov) { fields[h] = nv; changed.push(h); }
    });
    if (!changed.length) { toast('No changes to save'); return; }
    showConfirm('Save ' + changed.length + ' change' + (changed.length === 1 ? '' : 's') + '?',
      'Fields: ' + changed.join(', ') + '. This writes straight to the ' + (dbTable === 'steel' ? 'Steel Tickets' : 'Transactions') + ' sheet.',
      function () {
        var btn = document.getElementById('dbSave');
        if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
        runMutation('updateRawRow', [dbTable, rowObj.__row, fields, newOpId()],
          function (res) {
            var applied = (res && res.updated != null) ? res.updated : changed.length;
            Object.keys(fields).forEach(function (h) { rowObj[h] = fields[h]; });   // keep local cache in sync
            if (dbTable === 'steel') fetchTickets();
            showInfo('Saved', applied + ' field' + (applied === 1 ? '' : 's') + ' updated.', function () { renderDatabaseHome(); });
          },
          function (err) { toast('Error: ' + err.message); var b2 = document.getElementById('dbSave'); if (b2) { b2.disabled = false; b2.textContent = 'Save changes'; } });
      });
  }

    var box = document.getElementById('mwCoatingList');
    if (!box) return;
    if (!mwCoatings.length) { box.innerHTML = 'Nothing added yet. Pick a coating below and tap + Add Coating.'; return; }
    var total = 0;
    box.innerHTML = mwCoatings.map(function (c, i) {
      total += coatCost(c);
      return '<div class="queue-item" style="padding:6px 0">' +
        '<div style="min-width:0"><span class="ticket-id" style="font-size:14px">' + esc(c.item) + '</span> ' +
        '<span class="sub">' + esc(c.group) + (c.sub ? ' / ' + esc(c.sub) : '') + '</span></div>' +
        '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-mwrc="' + i + '">Remove</button></div>';
    }).join('') + '<div class="sub" style="margin-top:6px">Each ticket gets all of these: ' + money(total) + ' per ticket.</div>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-mwrc]'), function (b) {
      b.onclick = function () { mwCoatings.splice(Number(b.getAttribute('data-mwrc')), 1); renderMwCoatings(); };
    });
  }

  // Current steel (first coat) or WIP steel (another pass on top). Pending tickets belong to a
  // job under review and aren't offered.
  function mwEligible() {
    var onList = {};
    mwBatch.forEach(function (b) { onList[b.skidId] = true; });
    return queueCache.filter(function (t) { return !onList[t.skidId]; });
  }

  function mwQuickAdd(term) {
    term = (term || '').trim();
    if (!term) return;
    var lc = term.toLowerCase();
    var onList = mwBatch.filter(function (b) { return String(b.ticket).toLowerCase() === lc || String(b.skidId).toLowerCase() === lc; })[0];
    if (onList) { toast(term + ' is already on the list'); var i0 = document.getElementById('mwAddInput'); if (i0) i0.value = ''; renderMwPicker(''); return; }
    var matches = mwEligible().filter(function (t) { return String(t.ticket).toLowerCase() === lc || String(t.skidId).toLowerCase() === lc; });
    if (matches.length === 1) { mwAdd(matches[0].skidId); return; }
    if (!matches.length) {
      if (recheckOnMiss(term, function () { mwQuickAdd(term); }, true)) { toast('Checking for "' + term + '"…'); return; }
      var other = allCache.filter(function (t) { return String(t.ticket).toLowerCase() === lc || String(t.skidId).toLowerCase() === lc; })[0];
      toast(other ? term + ' is ' + other.status + ' — only Current or WIP tickets can move' : 'No ticket matches "' + term + '"');
      return;
    }
    renderMwPicker(term);   // several match: pick from the list
  }

  function renderMwPicker(term) {
    var c = document.getElementById('mwPicker');
    if (!c) return;
    term = (term || '').trim().toLowerCase();
    if (!term) { c.innerHTML = ''; return; }
    var rows = mwEligible().filter(function (t) {
      return String(t.ticket).toLowerCase().indexOf(term) !== -1 || String(t.skidId).toLowerCase().indexOf(term) !== -1;
    }).slice(0, 10);
    if (!rows.length) {
      var checking = recheckOnMiss(term, function () { var i = document.getElementById('mwAddInput'); if (i) renderMwPicker(i.value); });
      c.innerHTML = '<div class="sub">No Current or WIP tickets match.' + (checking ? CHECKING_HTML : '') + '</div>'; return;
    }
    c.innerHTML = rows.map(function (t) {
      return '<div class="queue-item" style="padding:6px 0"><div style="min-width:0">' +
        '<span class="ticket-id" style="font-size:15px">' + esc(t.ticket || '(no ticket)') + '</span> ' +
        '<span class="sub">' + esc(t.skidId) + (t.endUse ? ' &middot; ' + esc(t.endUse) : '') + ' &middot; ' + esc(t.qty || 0) + ' sheets' +
        (t.status === 'WIP' ? ' &middot; <span style="color:#b26a00;font-weight:600">already WIP → another pass</span>' : '') + '</span></div>' +
        '<button class="btn success" style="padding:8px 14px" data-mwadd="' + esc(t.skidId) + '">+ Add</button></div>';
    }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-mwadd]'), function (b) {
      b.onclick = function () { mwAdd(b.getAttribute('data-mwadd')); };
    });
  }

  function mwAdd(skidId) {
    var t = allCache.filter(function (x) { return x.skidId === skidId; })[0];
    if (!t) { toast('Ticket not found'); return; }
    if (!mwBatch.some(function (b) { return b.skidId === skidId; })) {
      mwBatch.push({ skidId: t.skidId, ticket: t.ticket, status: t.status, endUse: t.endUse, qty: t.qty });
    }
    var input = document.getElementById('mwAddInput');
    if (input) { input.value = ''; input.focus(); }
    renderMwPicker('');
    renderMwList();
  }

  // WIP tickets on the list can open a drop-down of the coatings already on them (loaded on
  // demand, one request per ticket) and mark coatings to take off. Nothing is removed until Move to
  // WIP: the removals go in the same batch as the new coats, so taking a ticket off the list drops
  // its marks too.
  var mwOpen = {};     // skidId -> drop-down open
  var mwCards = {};    // skidId -> { loading, error, card }
  var mwRemove = {};   // skidId -> { passNumber: true } marked to take off at Move to WIP
  function mwMarked(skidId) { return Object.keys(mwRemove[skidId] || {}); }

  function mwLoadCard(skidId) {
    mwCards[skidId] = { loading: true };
    renderMwList();
    google.script.run.withSuccessHandler(function (card) {
      mwCards[skidId] = { card: card };
      renderMwList();
    }).withFailureHandler(function (err) {
      mwCards[skidId] = { error: err.message };
      renderMwList();
    }).getTicketCard(skidId);
  }

  function mwCoatingsHtml(b) {
    var c = mwCards[b.skidId] || {};
    var inner;
    if (c.loading) inner = '<div class="loading">Loading coatings&hellip;</div>';
    else if (c.error) inner = '<div class="sub">Could not load: ' + esc(c.error) + ' <button class="btn secondary" style="padding:6px 10px;font-size:13px" data-mwretry="' + esc(b.skidId) + '">Try again</button></div>';
    else if (c.card) {
      var coats = c.card.coatings || [];
      var marks = mwRemove[b.skidId] || {}, off = 0;
      inner = coats.length ? coats.map(function (k) {
        var m = !!marks[String(k.passNumber)];
        if (m) off += Number(k.cost) || 0;
        return '<div class="queue-item" style="padding:6px 0"><div style="min-width:0' + (m ? ';text-decoration:line-through;opacity:.6' : '') + '">' +
          '<strong>' + esc(k.item) + '</strong> <span class="sub">' + esc([k.group, k.sub].filter(Boolean).join(' ')) +
          (k.chemCode ? ' &middot; chem ' + esc(k.chemCode) : '') + ' &middot; ' + money(k.cost) + '</span></div>' +
          (m ? '<span class="sub" style="color:#b3261e;font-weight:600;margin-right:6px">comes off at Move</span>' : '') +
          '<button class="btn ' + (m ? 'secondary' : 'warn') + '" style="padding:6px 10px;font-size:13px" data-mwvoid="' + esc(b.skidId) + '" data-pass="' + esc(k.passNumber) + '">' +
            (m ? 'Undo' : 'Remove coating') + '</button></div>';
      }).join('') + '<div class="sub" style="margin-top:4px">Litho on this ticket now: ' + money(c.card.litho) +
        (off ? ' &middot; after removals: ' + money(c.card.litho - off) + ' (plus the new coatings)' : '') + '</div>'
        : '<div class="sub">No coatings on this ticket.</div>';
    } else inner = '';
    return '<div class="mw-coats" style="margin:0 0 8px;padding:6px 12px;background:var(--bg);border-radius:8px">' + inner + '</div>';
  }

  function renderMwList() {
    var box = document.getElementById('mwListBox'), cnt = document.getElementById('mwCount'), btn = document.getElementById('mwMoveBtn');
    if (!box) return;
    if (cnt) cnt.textContent = mwBatch.length ? '(' + mwBatch.length + ')' : '';
    if (btn) { btn.disabled = !mwBatch.length; btn.textContent = mwBatch.length ? 'Move ' + mwBatch.length + ' to WIP' : 'Move to WIP'; }
    if (!mwBatch.length) { box.innerHTML = '<div class="sub">Nothing added yet.</div>'; return; }
    box.innerHTML = mwBatch.map(function (b) {
      var wip = b.status === 'WIP', open = wip && mwOpen[b.skidId];
      return '<div class="queue-item" style="padding:8px 0"><div style="min-width:0">' +
        '<span class="ticket-id" style="font-size:15px">' + esc(b.ticket || '(no ticket)') + '</span> ' +
        '<span class="sub">' + esc(b.skidId) + ' &middot; ' + esc(b.qty || 0) + ' sheets' +
        (wip ? ' &middot; <span style="color:#b26a00;font-weight:600">another pass</span>' : '') + '</span>' +
        (wip ? '<div><button class="btn secondary" style="padding:6px 10px;font-size:13px;margin-top:6px" data-mwcoats="' + esc(b.skidId) + '">' +
          (open ? '▾' : '▸') + ' Coatings on it now' + (mwMarked(b.skidId).length ? ' (' + mwMarked(b.skidId).length + ' to remove)' : '') + '</button></div>' : '') +
        '</div>' +
        '<button class="btn danger" style="padding:8px 12px" data-mwrem="' + esc(b.skidId) + '">Remove</button></div>' +
        (open ? mwCoatingsHtml(b) : '');
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('[data-mwrem]'), function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-mwrem');
        mwBatch = mwBatch.filter(function (x) { return x.skidId !== id; });
        delete mwRemove[id]; delete mwOpen[id];   // its marked removals leave with it
        renderMwList();
        var i = document.getElementById('mwAddInput'); if (i) renderMwPicker(i.value);
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-mwcoats]'), function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-mwcoats');
        mwOpen[id] = !mwOpen[id];
        if (mwOpen[id] && !(mwCards[id] && (mwCards[id].card || mwCards[id].loading))) mwLoadCard(id); else renderMwList();
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-mwretry]'), function (b) {
      b.onclick = function () { mwLoadCard(b.getAttribute('data-mwretry')); };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-mwvoid]'), function (b) {
      b.onclick = function () { mwRemoveCoating(b.getAttribute('data-mwvoid'), b.getAttribute('data-pass')); };
    });
  }

  // Mark / unmark a coating to come off at Move to WIP. Nothing is saved here.
  function mwRemoveCoating(skidId, pass) {
    var m = mwRemove[skidId] = mwRemove[skidId] || {};
    if (m[String(pass)]) delete m[String(pass)]; else m[String(pass)] = true;
    if (!Object.keys(m).length) delete mwRemove[skidId];
    renderMwList();
  }

  function mwMoveAll(groupSel, subSel, itemSel) {
    var name = (document.getElementById('mwJobName').value || '').trim();
    // A coating still sitting in the picker counts, so it isn't lost (a copy: nothing is kept
    // until the move goes through).
    var coatings = mwCoatings.slice();
    if (groupSel.value && itemSel.value && !coatings.some(function (c) { return c.group === groupSel.value && c.sub === subSel.value && c.item === itemSel.value; })) {
      coatings.push({ group: groupSel.value, sub: subSel.value, item: itemSel.value });
    }
    if (!name) { toast('Enter the job / customer name'); document.getElementById('mwJobName').focus(); return; }
    if (!coatings.length) { toast('Pick what was done (add a coating)'); return; }
    if (!mwBatch.length) { toast('Add at least one ticket'); return; }
    var ids = mwBatch.map(function (b) { return b.skidId; });
    var n = ids.length, per = coatings.reduce(function (s, c) { return s + coatCost(c); }, 0);
    var wipN = mwBatch.filter(function (b) { return b.status === 'WIP'; }).length;
    var removals = {}, offN = 0, offNames = [];
    mwBatch.forEach(function (b) {
      var passes = mwMarked(b.skidId);
      if (!passes.length) return;
      removals[b.skidId] = passes.map(Number);
      offN += passes.length;
      var card = mwCards[b.skidId] && mwCards[b.skidId].card;
      passes.forEach(function (p) {
        var k = card && (card.coatings || []).filter(function (x) { return String(x.passNumber) === p; })[0];
        offNames.push((k ? k.item : 'coating') + ' from ' + (b.ticket || b.skidId));
      });
    });
    showConfirm('Move ' + n + ' ticket' + (n === 1 ? '' : 's') + ' to WIP?',
      'Job: ' + name + '. Each ticket gets ' + coatings.map(function (c) { return c.item; }).join(' + ') + ' (' + money(per) + ' per ticket) and goes straight to WIP with no review step.' +
        (wipN ? ' ' + wipN + ' already in WIP get these coatings on top.' : '') +
        (offN ? ' Also takes off ' + offN + ' coating' + (offN === 1 ? '' : 's') + ': ' + offNames.join(', ') + '.' : ''),
      function () {
        var btn = document.getElementById('mwMoveBtn');
        if (btn) { btn.disabled = true; btn.textContent = 'Moving…'; }
        runMutation('moveToWip', [name, '', coatings, ids, newOpId(), removals],
          function (res) {
            var moved = (res && res.moved) || [];
            var skipped = (res && res.skipped) || [];
            moved.forEach(function (m) { markCacheStatus(m.skidId, 'WIP'); });
            mwBatch = []; mwOpen = {}; mwCards = {}; mwRemove = {};
            mwCoatings = []; mwJobName = '';
            showInfo('Moved to WIP',
              moved.length + ' ticket' + (moved.length === 1 ? '' : 's') + ' moved to WIP' + (res && res.jobId ? ' (job ' + res.jobId + ')' : '') + '.' +
              (function () { var n = moved.reduce(function (k, m) { return k + ((m.removed || []).length); }, 0); return n ? ' ' + n + ' coating' + (n === 1 ? '' : 's') + ' taken off.' : ''; })() +
              (skipped.length ? ' ' + skipped.length + ' not moved: ' + skipped.map(function (x) { return (x.ticket || x.skidId) + ' (' + x.reason + ')'; }).join(', ') + '.' : ''),
              function () { renderMoveWip(); });
          },
          function (err) {
            showModal({ title: 'Could not move the tickets', confirmText: 'OK',
              message: err.message + ' — Tap Move to WIP again without changing anything: it finishes whatever didn\'t save, and never coats a ticket twice.' });
            renderMwList();
          });
      }, 'Move to WIP');
  }

  // ---------------- Global "Search for a Ticket" (across every department) ----------------
  // "All" covers the live inventory (Current / WIP / Pending). Skids that have gone through
  // production (Used / In Production) are their own ever-growing history, so they load only
  // when the operator taps "Used in production" — keeping the everyday search fast as the
  // Used pile grows over the years.
  var searchFilter = 'all';        // all | current | wip | pending
  var usedCache = null;            // null = not fetched yet; [] or [...] once loaded
  var searchUsedOpen = false;

  function openSearch() {
    state.view = 'search'; state.skid = null;
    enterDetailView(); setDept('Search');
    searchFilter = 'all';
    renderSearch();
  }

  function renderSearch() {
    state.view = 'search';
    var view = document.getElementById('view');
    var tok = nextViewToken();
    var chips = [['all', 'All'], ['current', 'Current'], ['wip', 'WIP'], ['pending', 'Pending']].map(function (c) {
      return '<button data-sfilter="' + c[0] + '"' + (searchFilter === c[0] ? ' class="active"' : '') + '>' + esc(c[1]) + '</button>';
    }).join('');
    view.innerHTML =
      '<div class="searchrow">' + searchBarHtml('globalSearch') + '</div>' +
      '<div class="tabbar" id="searchChips">' + chips + '</div>' +
      '<div class="sub" style="margin-bottom:8px">Live steel — Current, WIP and Pending.</div>' +
      '<div id="searchActiveList"><div class="loading">Loading tickets&hellip;</div></div>' +
      '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">' +
        '<button class="btn secondary" id="loadUsedBtn" style="width:100%">' +
          (searchUsedOpen ? '📦 Used in production' : '📦 Used in production — tap to load') + '</button>' +
        '<div class="sub" style="margin-top:6px">Skids consumed or on a machine now. Loaded on demand — this list grows over time.</div>' +
      '</div>' +
      '<div id="searchUsedList"></div>';

    var searchInput = document.getElementById('globalSearch');
    searchInput.oninput = function () { renderSearchActive(); if (searchUsedOpen) renderSearchUsed(); };
    searchInput.focus();   // ready for a scan without tapping the box first
    Array.prototype.forEach.call(document.querySelectorAll('#searchChips button'), function (btn) {
      btn.onclick = function () {
        searchFilter = btn.getAttribute('data-sfilter');
        Array.prototype.forEach.call(document.querySelectorAll('#searchChips button'), function (b) {
          b.classList.toggle('active', b.getAttribute('data-sfilter') === searchFilter);
        });
        renderSearchActive();
      };
    });
    document.getElementById('loadUsedBtn').onclick = function () {
      searchUsedOpen = true;
      var btn = document.getElementById('loadUsedBtn');
      btn.textContent = '📦 Used in production';
      if (usedCache === null) {
        document.getElementById('searchUsedList').innerHTML = '<div class="loading">Loading used skids&hellip;</div>';
        google.script.run.withSuccessHandler(function (used) {
          usedCache = used || [];
          if (tok === viewToken) renderSearchUsed();
        }).withFailureHandler(function (err) {
          if (tok !== viewToken) return;
          document.getElementById('searchUsedList').innerHTML = '<div class="card empty">Error loading used skids: ' + esc(err.message) + '</div>';
        }).getUsedTickets();
      } else {
        renderSearchUsed();
      }
    };

    ensureAllCache(function () { if (tok === viewToken) renderSearchActive(); });
    if (allCache.length) renderSearchActive();
    if (searchUsedOpen && usedCache !== null) renderSearchUsed();
  }

  function searchTermMatch(t, term) {
    if (!term) return true;
    return String(t.ticket).toLowerCase().indexOf(term) !== -1 ||
           String(t.skidId).toLowerCase().indexOf(term) !== -1;
  }

  function renderSearchActive() {
    var container = document.getElementById('searchActiveList');
    if (!container) return;
    var si = document.getElementById('globalSearch');
    var term = (si ? si.value : '').trim().toLowerCase();
    var rows = allCache.filter(function (t) {
      if (t.status !== 'Current' && t.status !== 'WIP' && t.status !== 'Pending') return false;
      if (searchFilter === 'current' && t.status !== 'Current') return false;
      if (searchFilter === 'wip' && t.status !== 'WIP') return false;
      if (searchFilter === 'pending' && t.status !== 'Pending') return false;
      return searchTermMatch(t, term);
    });
    if (!rows.length) {
      var checking = recheckOnMiss(term, renderSearchActive);
      container.innerHTML = '<div class="card empty">' + (term ? 'No live tickets match "' + esc(si.value) + '".' + (checking ? CHECKING_HTML : '') : 'No live tickets.') + '</div>';
      return;
    }
    var html = '<div class="card">';
    rows.forEach(function (t) { html += ticketRowHtml(t); });
    html += '</div>';
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll('.queue-item'), function (el) {
      el.onclick = function () { openCardFromSearch(el.getAttribute('data-skid')); };
    });
  }

  function renderSearchUsed() {
    var container = document.getElementById('searchUsedList');
    if (!container || usedCache === null) return;
    var si = document.getElementById('globalSearch');
    var term = (si ? si.value : '').trim().toLowerCase();
    var rows = usedCache.filter(function (t) { return searchTermMatch(t, term); });
    if (!rows.length) {
      container.innerHTML = '<div class="card empty" style="margin-top:10px">' +
        (term ? 'No used skids match "' + esc(si.value) + '".' : 'No used skids yet.') + '</div>';
      return;
    }
    var html = '<div class="card" style="margin-top:10px">';
    rows.forEach(function (t) { html += ticketRowHtml(t); });
    html += '</div>';
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll('.queue-item'), function (el) {
      el.onclick = function () { openCardFromSearch(el.getAttribute('data-skid')); };
    });
  }

  // ---------------- Reports (completed work by department, by day or range) ----------------
  var reportDept = 'all';
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  function openReports() {
    if (!FULL_APP) { renderLanding(); return; }
    state.view = 'reports';
    nextViewToken();
    showTabbar(false); showBack(true); setDept('Reports');
    renderReports();
  }

  var reportTab = 'reports';   // 'reports' | 'trace'
  function reportTabsHtml() {
    return '<div class="tabbar" style="margin-bottom:10px">' + [['reports', '📊 Reports'], ['trace', '🔍 Begin trace']].map(function (t) {
      return '<button data-rtab="' + t[0] + '"' + (reportTab === t[0] ? ' class="active"' : '') + '>' + t[1] + '</button>'; }).join('') + '</div>';
  }
  function wireReportTabs(view) {
    Array.prototype.forEach.call(view.querySelectorAll('[data-rtab]'), function (b) {
      b.onclick = function () { reportTab = b.getAttribute('data-rtab'); renderReports(); };
    });
  }
  function renderReports() {
    state.view = 'reports';
    var view = document.getElementById('view');
    if (reportTab === 'trace') { renderTrace(view); return; }
    var today = todayStr();
    view.innerHTML = reportTabsHtml() +
      '<div class="card"><h3 style="margin-top:0">Reports</h3>' +
        '<div class="sub" style="margin-bottom:10px">See what each department completed for a day or a date range. Tap a row for its full trace: the mill and supplier, every coating with its chem code, the job / customer, and where the steel went. For a product trace, pick All time and type the ticket, load #, mill, customer or chem code in the trace box.</div>' +
        selectField('reportDeptSel', 'Department', [{ value: 'all', text: 'All departments' }, { value: 'litho', text: 'Litho' }, { value: 'lines', text: 'Metal Lines' }, { value: 'press', text: 'Press' }, { value: 'slitter', text: 'Slitter' }, { value: 'scrolls', text: 'Scrolls' }, { value: 'direct', text: 'Used in Production (direct)' }, { value: 'count', text: 'Count' }], reportDept) +
        '<div class="row">' +
          '<div class="field"><label>From</label><input type="date" id="reportFrom" value="' + esc(today) + '"></div>' +
          '<div class="field"><label>To</label><input type="date" id="reportTo" value="' + esc(today) + '"></div>' +
        '</div>' +
        '<div class="row" style="gap:8px;margin-bottom:10px">' +
          '<button class="btn secondary" id="reportToday" style="flex:1">Today</button>' +
          '<button class="btn secondary" id="reportWeek" style="flex:1">This week (Mon–Fri)</button>' +
          '<button class="btn secondary" id="reportAll" style="flex:1">All time</button>' +
        '</div>' +
        '<button class="btn" id="runReportBtn" style="width:100%">Generate report</button>' +
      '</div>' +
      '<div id="reportResults"></div>';
    wireReportTabs(view);

    var from = document.getElementById('reportFrom');
    var to = document.getElementById('reportTo');
    document.getElementById('reportToday').onclick = function () { from.value = todayStr(); to.value = todayStr(); };
    document.getElementById('reportWeek').onclick = function () {
      // Generalized work week: Monday through Friday of the current week (Sun counts as that week).
      var d = new Date();
      var mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      var fri = new Date(mon); fri.setDate(mon.getDate() + 4);
      from.value = ymd(mon); to.value = ymd(fri);
    };
    document.getElementById('reportAll').onclick = function () { from.value = '2000-01-01'; to.value = todayStr(); };
    document.getElementById('runReportBtn').onclick = function () {
      var dept = document.getElementById('reportDeptSel').value || 'all';
      var f = from.value, t = to.value || from.value;
      if (!f) { toast('Pick a date'); return; }
      if (t < f) { toast('"To" is before "From"'); return; }

  // ---- Begin trace: a product made on a day -> the steel of its size used the days around it ----
  // Step 1 the date the product was made, step 2 its size (diameter, from the tickets' End Use),

  // receiver. Tap a row for its full trace (coatings, job, PO …).
  var trc = { date: '', dia: '', near: null, dayCount: 0, days: 1, sizes: null, data: null, open: {}, busy: false };
  function trcFmtDay(d) {
    var p = String(d).split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);

  }
  function renderTrace(view) {

          var btn = function (val, label, n, sub) {

              '<b>' + esc(label) + '</b> <span class="sub">' + n + '</span>' + (sub ? '<div class="sub" style="font-size:11px">' + esc(sub) + '</div>' : '') + '</button>';
          };
          return '<div class="row" style="gap:6px;flex-wrap:wrap;align-items:stretch">' + trc.sizes.map(function (z) {
              return btn(z.key, z.label, z.count, z.endUses.map(function (e) { return e.endUse; }).join(', '));
            }).join('') + btn('ALL', 'All steel used that day', trc.dayCount || 0, 'every end use') + '</div>';
        })();
    view.innerHTML = reportTabsHtml() +
      '<div class="card"><h3 style="margin-top:0">Begin trace — used in production</h3>' +
        '<div class="sub" style="margin-bottom:10px">Pick the day the product was made, then bodies or ends of its diameter (bodies of every height run on the same line, so 603 Bodies covers 603X700 and 603X812). You get that steel used the day before, that day and the day after, with each ticket’s supplier, mill #, receiver, who it was for and whether it was coated.</div>' +
        '<div class="field"><label>1. Date the product was made</label><input type="date" id="trcDate" value="' + esc(trc.date) + '"></div>' +
        '<div class="field" style="margin-bottom:4px"><label>2. What was made — bodies or ends, by diameter (only what was used that day)</label></div>' + sizesHtml +
        '<div class="row" style="gap:8px;align-items:flex-end;margin-top:10px;flex-wrap:wrap">' +
          '<div class="field" style="margin:0;min-width:170px"><label>Days each side</label><select id="trcDays">' + [1, 2, 3, 5].map(function (n) {
            return '<option value="' + n + '"' + (trc.days === n ? ' selected' : '') + '>' + n + ' day' + (n === 1 ? '' : 's') + ' before and after</option>'; }).join('') + '</select></div>' +
        '</div>' +
      '</div><div id="trcResults"></div>';
    wireReportTabs(view);
    var di = document.getElementById('trcDate');
    di.onchange = function () { if (!di.value || di.value === trc.date) return; trcSetDate(di.value); };
    document.getElementById('trcDays').onchange = function () { trc.days = +this.value || 1; if (trc.data) trcRun(); };
    Array.prototype.forEach.call(view.querySelectorAll('[data-trcdia]'), function (b) {
      b.onclick = function () { trc.dia = b.getAttribute('data-trcdia'); trcRun(); };

    Array.prototype.forEach.call(view.querySelectorAll('[data-trcjump]'), function (b) {
      b.onclick = function () { trcSetDate(b.getAttribute('data-trcjump')); };

    if (!trc.sizes) {
      var forDate = trc.date;
      google.script.run.withSuccessHandler(function (r) {
        if (forDate !== trc.date) return;   // the date was changed again meanwhile
        trc.sizes = (r && r.sizes) || []; trc.dayCount = (r && r.dayCount) || 0; trc.near = { prevDay: r && r.prevDay, nextDay: r && r.nextDay };
        // Keep what was picked before if it was also used on this day.
        var still = trc.dia && (trc.dia === 'ALL' || trc.sizes.some(function (z) { return z.key === trc.dia; }));
        if (still) { trcRun(); return; }
        trc.dia = '';
        if (reportTab === 'trace' && state.view === 'reports') renderTrace(document.getElementById('view'));
      }).withFailureHandler(function (err) { var el = document.getElementById('trcResults'); if (el) el.innerHTML = '<div class="card empty">Could not load: ' + esc(err.message) + '</div>'; })

  // A new day: its own End Uses, and the old results go.

  function trcRun() {

    google.script.run.withSuccessHandler(function (r) {
      if (want !== trc.date + '|' + trc.dia + '|' + trc.days) return;   // a newer pick is on its way
      trc.data = r; trc.sizes = r.sizes || trc.sizes; trc.dayCount = r.dayCount || trc.dayCount; trc.near = { prevDay: r.prevDay, nextDay: r.nextDay };
      if (reportTab === 'trace' && state.view === 'reports') renderTrace(document.getElementById('view'));
    }).withFailureHandler(function (err) {

  }
  function trcTickets(day) { return day.tickets || []; }
  // Who the steel was for: the litho job's customer, else the ticket's Comments (JF PRIME, WALKER …).
  function trcFor(t) { return t.customer || t.comments || ''; }
  // Coated or plain: its coatings when the app logged them, else the litho cost on the ticket.
  function trcCoated(t) {
    if ((t.coatings || []).length) return coatsShort(t.coatings);
    return Number(t.litho) > 0 ? 'Coated ($' + Number(t.litho).toFixed(2) + ' litho)' : 'Plain';
  }
  function renderTraceResults() {
    var el = document.getElementById('trcResults');

      '<div class="row" style="gap:8px;margin-top:8px"><button class="btn secondary" id="trcCsv" style="padding:6px 12px;font-size:13px">Download CSV</button></div></div>';
    d.dayList.forEach(function (day, di) {
      var list = trcTickets(day);
      var off = day.offset || 1;
      var title = day.rel === 'on' ? 'Trace day' : (off === 1 ? (day.rel === 'before' ? 'Day before' : 'Day after') : off + ' days ' + day.rel);
      html += '<div class="card"' + (day.rel === 'on' ? ' style="border:2px solid var(--accent)"' : '') + '><h3 style="margin-top:0;font-size:15px">' + title + ' — ' + esc(trcFmtDay(day.date)) +
        ' <span class="sub" style="font-weight:400">&middot; ' + list.length + ' ticket' + (list.length === 1 ? '' : 's') + '</span></h3>';
      if (!list.length) { html += '<div class="sub">Nothing for this day.</div></div>'; return; }
      html += '<div style="overflow-x:auto"><table style="margin-top:6px"><thead><tr>' + ['Ticket #', 'Supplier', 'Mill #', 'Receiver', 'End Use', 'For', 'Coated', 'PO', 'Sheets'].map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
        list.map(function (t, ti) {
          var id = di + '-' + ti, open = trc.open[id];
          var rcv = t.receiver ? rcvNameLink(t.receiver, t.receiverName, t.receiverLink, 'font-weight:600') + (t.receiverFrom ? ' <span class="sub">(from ' + esc(t.receiverFrom) + ')</span>' : '') : '<span class="sub">none</span>';
          var note = (t.daysCount > 1 ? 'used on ' + t.daysCount + ' days' : '') + (t.stillOpen ? (t.daysCount > 1 ? ', ' : '') + 'partly used — still ' + t.status : '');
          return '<tr data-trcrow="' + id + '" style="cursor:pointer"><td style="white-space:nowrap">' + (open ? '▾ ' : '▸ ') + histTicketLink(t) + (note ? '<div class="sub">' + esc(note) + '</div>' : '') + '</td>' +
            '<td>' + dash(t.supplier) + '</td><td>' + dash(t.mill) + '</td><td>' + rcv + '</td><td>' + dash(t.endUse) + '</td><td>' + dash(trcFor(t)) + '</td><td>' + esc(trcCoated(t)) + '</td><td>' + dash(t.po) + '</td><td>' + dash(t.qty) + '</td></tr>' +
            (open ? '<tr class="trace-detail"><td colspan="9" style="background:var(--bg)">' + traceDetailHtml(t) +
              (t.usedDays && t.usedDays.length > 1 ? '<div class="sub">Used on: ' + esc(t.usedDays.join(', ')) + '</div>' : '') + '</td></tr>' : '');
        }).join('') + '</tbody></table></div></div>';

    Array.prototype.forEach.call(el.querySelectorAll('[data-trcrow]'), function (tr) {

  function trcCsv() {
    var d = trc.data; if (!d) return;
    var q = function (v) { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [['Product made', 'Traced', 'Day', 'Date used', 'Ticket', 'Skid ID', 'Supplier', 'Mill', 'Receiver', 'PO', 'End Use', 'For', 'Coated', 'Sheets', 'Weight', 'Status', 'All days used'].join(',')];
    d.dayList.forEach(function (day) {
      trcTickets(day).forEach(function (t) {
        lines.push([d.date, d.label || d.diameter, day.rel, day.date, t.ticket, t.skidId, t.supplier, t.mill, t.receiverName || t.receiver || '', t.po, t.endUse, trcFor(t), trcCoated(t), t.qty, t.weight, t.status,
          (t.usedDays || []).join(' ')].map(q).join(','));

    });
    try {
      var blob = new Blob([lines.join('\r\n')], { type: 'text/csv' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'trace-' + d.date + '-' + String(d.diameter || 'none').replace(/\W+/g, '') + '.csv';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (e) { toast('Could not make the file: ' + e.message); }

  // The last report, kept so the trace box can filter it and the CSV can be built without asking again.
  var reportData = null, reportFilter = '', reportOpen = {};
  function renderReportResults(r) {

        '<button class="btn secondary" id="reportCsvBtn">Download CSV</button>' +

  function reportRowText(x) { return JSON.stringify(x).toLowerCase(); }
  function reportMatches(x) {

  function renderReportSections() {

  function histTicketLink(x) {

  // Full trace for one skid: source steel, what was done, job / customer, where it went.
  function traceDetailHtml(x, noHistoryBtn) {

      (x.bw !== '' && x.bw != null) && ('BW ' + esc(x.bw) + (x.testedBw !== '' && x.testedBw != null ? ' (tested ' + esc(x.testedBw) + ')' : '')),

    }).join('') + '</ol>' : '<span class="sub">none</span>';

  // Render one department section. Each row opens to its full trace (see traceDetailHtml).
