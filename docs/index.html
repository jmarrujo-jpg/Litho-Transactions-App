  // Every row the trace box is showing, with all its trace fields, as a CSV file.
  function downloadReportCsv() {
    if (!reportData) return;
    var cols = ['Section', 'Date', 'Ticket', 'Skid ID', 'Job / Customer', 'Job ID', 'Mill', 'Supplier', 'PO', 'Receiver', 'End Use', 'BW', 'Tested BW', 'Type', 'Temper',
      'Width', 'Length', 'Sheets', 'Weight', 'Coatings', 'Chem Codes', 'Coated On', 'Coated By', 'Litho', 'Cost', 'Status', 'Used On', 'Machine', 'By',
      'Load #', 'Output', 'Cut From'];
    var q = function (v) { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [cols.join(',')];
    (reportData.sections || []).forEach(function (sec) {
      if (sec.key === 'count') return;
      (sec.rows || []).filter(reportMatches).forEach(function (x) {
        var srcs = x.sources || [];
        var coats = (x.coatings || []).concat.apply(x.coatings || [], srcs.map(function (t) { return t.coatings || []; }));
        var pick = function (k) { return x[k] != null && x[k] !== '' ? x[k] : srcs.map(function (t) { return t[k] || ''; }).filter(Boolean).join(' + '); };
        lines.push([sec.label, x.date, x.ticket || '', x.skidId || '', pick('customer'), pick('jobId'), pick('mill'), pick('supplier'), pick('po'), pick('receiverName'), pick('endUse'),
          pick('bw'), pick('testedBw'), pick('type'), pick('temper'), x.width, x.length, x.sheets != null ? x.sheets : x.qty, x.weight,
          coats.map(function (c) { return c.item + (c.date ? ' ' + c.date : '') + (c.by ? ' ' + c.by : ''); }).join('; '),
          coats.map(function (c) { return c.chemCode || ''; }).filter(Boolean).join('; '),
          x.coatedOn, x.coatedBy, x.litho, x.cost, x.status, x.usedOn, x.machine, x.by, x.loadNo, x.output != null ? x.output + ' ' + (x.unit || '') : '', x.from
        ].map(q).join(','));
      });
    });
    var name = 'report-' + reportData.start + (reportData.end !== reportData.start ? '_to_' + reportData.end : '') + '.csv';
    try {
      var blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (e) { toast('Could not make the file: ' + e.message); }
  }

  // ---------------- Ticket history panel (Database + Reports) ----------------
  // Opens over whatever screen you're on (so Close returns you exactly where you were). Tapping a
  // parent / piece / family member opens that skid's history; ← steps back through them.
  var histStack = [], histData = null;
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest && e.target.closest('[data-hist]');
    if (!b) return;
    e.preventDefault();
    openSkidHistory(b.getAttribute('data-hist'));
  });
  function openSkidHistory(skidId, fromBack) {
    if (!skidId) return;
    if (!fromBack) histStack.push(skidId);
    var root = histRootEl();
    root.innerHTML = histHeaderHtml('Loading…') + '<div class="card"><div class="loading">Loading history&hellip;</div></div>';
    wireHistHeader();
    google.script.run.withSuccessHandler(function (h) {
      if (histStack[histStack.length - 1] !== skidId) return;   // they moved on
      histData = h;
      renderSkidHistory(h);
    }).withFailureHandler(function (err) {
      if (histStack[histStack.length - 1] !== skidId) return;
      root.innerHTML = histHeaderHtml(skidId) + '<div class="card empty">Could not load the history: ' + esc(err.message) + '</div>';
      wireHistHeader();
    }).getSkidHistory(skidId);
  }
  function histRootEl() {
    var root = document.getElementById('histRoot');
    if (!root) {
      root = document.createElement('div');
      root.id = 'histRoot';
      root.style.cssText = 'position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 40px';
      document.body.appendChild(root);
    }
    document.body.style.overflow = 'hidden';
    return root;
  }
  function closeSkidHistory() {
    histStack = []; histData = null;

    document.body.style.overflow = '';
  }
  function histHeaderHtml(title) {
    return '<div class="row" style="align-items:center;gap:8px;margin-bottom:10px">' +
      (histStack.length > 1 ? '<button class="btn secondary" id="histBack">&larr; Back</button>' : '') +
      '<h3 style="margin:0;flex:1">' + esc(title) + '</h3>' +
      '<button class="btn secondary" id="histCsv"' + (histData ? '' : ' disabled') + '>Download CSV</button>' +
      '<button class="btn" id="histClose">Close</button></div>';
  }
  function wireHistHeader() {
    var c = document.getElementById('histClose'); if (c) c.onclick = closeSkidHistory;
    var b = document.getElementById('histBack');
    if (b) b.onclick = function () { histStack.pop(); histData = null; openSkidHistory(histStack[histStack.length - 1], true); };
    var d = document.getElementById('histCsv'); if (d) d.onclick = downloadHistoryCsv;
  }
  function histSkidLink(r, extra) {
    return '<button class="btn secondary" style="padding:6px 10px;font-size:13px;margin:0 6px 6px 0" data-hist="' + esc(r.skidId) + '">' +
      esc(r.ticket || r.skidId) + ' <span class="sub">' + esc([r.skidId !== r.ticket ? r.skidId : '', r.status, extra].filter(Boolean).join(' · ')) + '</span></button>';
  }
  function renderSkidHistory(h) {
    var root = document.getElementById('histRoot');
    if (!root) return;
    var k = h.skid || {};
    var html = histHeaderHtml('Ticket ' + (k.ticket || k.skidId) + ' — history');
    html += '<div class="card">' +
      '<div class="row" style="align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">' +
        '<span class="ticket-id" style="font-size:20px">' + esc(k.ticket || '(no ticket)') + '</span>' +
        '<span class="sub">' + esc(k.skidId) + '</span>' +
        '<span class="badge ' + (k.status === 'WIP' ? 'wip' : '') + '">' + esc(k.status || '') + '</span>' +
        '<span class="sub">litho ' + money(k.litho) + (k.row !== '' && k.row != null ? ' &middot; row ' + esc(k.row) : '') + '</span>' +
      '</div>' + traceDetailHtml(k, true) + '</div>';
    var links = '';
    if (h.parent) links += '<div style="margin-bottom:6px"><span class="sub">Split / cut from:</span><br>' + histSkidLink(h.parent) + '</div>';
    if ((h.children || []).length) links += '<div style="margin-bottom:6px"><span class="sub">Pieces made from it:</span><br>' + h.children.map(function (c) { return histSkidLink(c, (c.qty !== '' ? c.qty + ' sheets' : '')); }).join('') + '</div>';
    if ((h.loads || []).length) links += '<div style="margin-bottom:6px"><span class="sub">' + esc(h.loads[0].kind === 'Scroll' ? 'Scroll' : 'Slitter') + ' loads cut from it:</span><br>' + h.loads.map(function (l) {
      return l.skidId ? histSkidLink({ skidId: l.skidId, ticket: 'LOAD ' + l.loadNo }, l.used + ' used · ' + l.date) : '<span>LOAD ' + esc(l.loadNo) + '</span> ';
    }).join('') + '</div>';
    var fam = ((h.family || {}).members || []).filter(function (m) { return m.skidId !== k.skidId; });
    if (fam.length) links += '<div><span class="sub">Same original ticket (' + esc(h.family.base) + '):</span><br>' + fam.map(function (m) { return histSkidLink(m); }).join('') + '</div>';
    if (links) html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Where it came from and what was made from it</h3>' + links + '</div>';
    var ev = h.events || [];
    html += '<div class="card"><h3 style="margin-top:0;font-size:15px">Timeline <span class="sub" style="font-weight:400">&middot; newest first &middot; ' + ev.length + '</span></h3>' +
      (ev.length ? '<div style="overflow-x:auto"><table><thead><tr><th>When</th><th>What</th><th>Details</th><th>By</th></tr></thead><tbody>' + ev.map(function (e) {
        var det = [e.chemCode && 'chem ' + esc(e.chemCode), (e.group || e.sub) && esc([e.group, e.sub].filter(Boolean).join(' ')),
          e.cost ? (e.cost < 0 ? '−' + money(-e.cost) : money(e.cost)) : '', (e.running !== '' && e.running != null && e.kind !== 'event') ? 'total ' + money(e.running) : '',
          (e.jobName || e.jobId) && esc([e.jobName, e.jobId && e.jobId !== e.jobName ? e.jobId : ''].filter(Boolean).join(' ')),
          e.notes && esc(e.notes)].filter(Boolean).join(' &middot; ');
        var style = e.voided ? ' style="text-decoration:line-through;opacity:.6"' : '';
        return '<tr><td style="white-space:nowrap">' + esc(e.when || e.date || '') + '</td>' +
          '<td' + style + '><strong' + (e.kind === 'void' ? ' style="color:#b3261e"' : '') + '>' + esc(e.what) + '</strong>' + (e.voided ? ' <span class="sub">(removed later)</span>' : '') + '</td>' +
          '<td class="sub">' + (det || '—') + '</td><td>' + esc(e.by || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="sub">Nothing logged for this ticket yet.</div>') + '</div>';
    root.innerHTML = html;
    root.scrollTop = 0;
    wireHistHeader();
  }
  function downloadHistoryCsv() {
    if (!histData) return;
    var k = histData.skid || {};
    var q = function (v) { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [['When', 'What', 'Chem Code', 'Size / Group', '#OUT', 'Cost', 'Running Total', 'By', 'Job ID', 'Job / Customer', 'Notes', 'Removed later'].join(',')];
    (histData.events || []).forEach(function (e) {
      lines.push([e.when || e.date, e.what, e.chemCode, e.group, e.sub, e.cost || '', e.kind === 'event' ? '' : e.running, e.by, e.jobId, e.jobName, e.notes, e.voided ? 'yes' : ''].map(q).join(','));
    });
    try {

      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (e) { toast('Could not make the file: ' + e.message); }
  }

  // ---------------- Steel Count (guided two-stage physical count) ----------------
  // A count session walks the floor in two stages: Stage 1 checks every Current pallet, then the
  // ones not found are moved to WIP; Stage 2 checks every WIP pallet, then the ones still not found
  // are marked Missing (kept in the system + on a restorable Missing list). Session state lives on
  // the server (Count Sessions tab) so a count can span days and resume on any device. "Found this
  // session" = a skid's Counted At date is on/after the session's start date.
  var countSort = 'bw';
  var countCache = [];
  var countGroups = [];
  var countSession = null;   // { sessionId, startedOn, startedBy, stage } or null when no count is running
  var countMode = 'walk';    // walk | reviewPromote | reviewMissing | summary | missing
  var countReviewSel = {};   // skidId -> bool selection on the review screens
  var countPromoted = {};    // skidId -> true for pallets promoted Current->WIP this session (Stage 2 badge)
  var countSummary = null;   // { foundCurrent, promoted, foundWip, missing, startedOn } shown after finishing

  function cmpNumeric(a, b) {
    var na = Number(a), nb = Number(b);
    var aNum = !isNaN(na) && String(a).trim() !== '';
    var bNum = !isNaN(nb) && String(b).trim() !== '';
    if (aNum && bNum) return na - nb;
    if (aNum) return -1;
    if (bNum) return 1;
    return String(a || '').localeCompare(String(b || ''), undefined, { numeric: true });
  }
  function cmpTicket(a, b) { return String(a || '').localeCompare(String(b || ''), undefined, { numeric: true }); }
  function setActiveBtn(ids, activeId) {
    ids.forEach(function (id) { var b = document.getElementById(id); if (b) b.classList.toggle('active', id === activeId); });
  }

  // Which status the current walk is counting, and whether a skid was found in this session.
  function countWalkStatus() { return (countSession && countSession.stage === 'WIP') ? 'WIP' : 'Current'; }
  function countIsFound(t) { return !!(countSession && t.countedOn && t.countedOn >= countSession.startedOn); }
  function countSetStatus(id, status) {
    var t = countCache.filter(function (x) { return x.skidId === id; })[0];
    if (t) t.status = status;
  }

  function openSteelCount() {
    state.view = 'count'; nextViewToken();
    showTabbar(false); showBack(true); setDept('Steel Count');
    countCache = []; countSession = null; countMode = 'walk'; countPromoted = {}; countSummary = null;
    document.getElementById('view').innerHTML = '<div class="card"><div class="loading">Loading count&hellip;</div></div>';
    refreshCount();
  }

  // Load the active session (if any) + all tickets, then render whatever mode we're in.
  function refreshCount(after) {
    var tok = viewToken;
    function loadTickets() {
      google.script.run.withSuccessHandler(function (all) {
        if (tok !== viewToken) return;
        countCache = all || [];
        if (after) after(); else renderCount();
      }).withFailureHandler(function (err) {
        if (tok !== viewToken) return;
        document.getElementById('view').innerHTML = '<div class="card empty">Error loading steel: ' + esc(err.message) + '</div>';
      }).getAllTickets();
    }
    google.script.run.withSuccessHandler(function (sess) {
      if (tok !== viewToken) return;
      countSession = sess || null;
      loadTickets();
    }).withFailureHandler(function () {
      // Worker without getActiveCount (not yet redeployed): degrade gracefully to no session.
      if (tok !== viewToken) return;
      countSession = null; loadTickets();
    }).getActiveCount();
  }

  function renderCount() {
    state.view = 'count';
    if (countMode === 'missing') return renderCountMissing();
    if (countMode === 'history') return renderCountHistory();
    if (countMode === 'summary') return renderCountSummary();
    if (countMode === 'reviewPromote' || countMode === 'reviewMissing') return renderCountReview();
    if (!countSession) return renderCountStart();
    return renderCountWalk();
  }

  // ----- Start / resume screen -----
  function renderCountStart() {
    var missing = countCache.filter(function (t) { return (t.status || '') === 'Missing'; });
    var view = document.getElementById('view');
    view.innerHTML =
      '<div class="card"><h3 style="margin-top:0">Steel Count</h3>' +
        '<div class="sub" style="margin-bottom:10px">A count runs in two stages. First, walk the floor and check off every <strong>Current</strong> pallet. Any you can\'t find are moved to <strong>WIP</strong>, then you walk again. Whatever still isn\'t found goes on the <strong>Missing</strong> list.</div>' +
        operatorFieldHtml('countOperator', 'Who\'s counting?') +
        '<button class="btn" id="countStartBtn" style="width:100%;margin-top:10px;padding:16px;font-size:17px">Start count</button>' +
      '</div>' +
      '<div class="card"><div class="row" style="align-items:center;gap:10px">' +
        '<div style="flex:1"><strong>Missing list</strong><div class="sub">' + missing.length + ' pallet(s) not found in past counts</div></div>' +
        '<button class="btn secondary" id="countViewMissing" style="padding:10px 14px">View</button>' +
      '</div></div>' +
      '<div class="card"><div class="row" style="align-items:center;gap:10px">' +
        '<div style="flex:1"><strong>Past counts</strong><div class="sub">See saved counts and their tallies</div></div>' +
        '<button class="btn secondary" id="countViewHistory" style="padding:10px 14px">History</button>' +
      '</div>' +
        '<button class="btn secondary" id="countClearBtn" style="width:100%;margin-top:10px">Clear all checkmarks now</button>' +
        '<div class="sub" style="margin-top:6px">Finishing a count clears these automatically — use this only to reset a count you abandoned.</div>' +
      '</div>';
    document.getElementById('countStartBtn').onclick = function () {
      var op = ((document.getElementById('countOperator') || {}).value || lastOperator || '').trim();
      if (op) lastOperator = op;
      var btn = document.getElementById('countStartBtn'); btn.disabled = true; btn.textContent = 'Starting…';
      runMutation('startCount', [op, newOpId()], function (sess) {
        countSession = sess; countMode = 'walk'; countPromoted = {}; countSummary = null;
        renderCount();
      }, function (err) {
        showModal({ title: 'Could not start count', message: err.message, confirmText: 'OK' });
        btn.disabled = false; btn.textContent = 'Start count';
      });
    };
    document.getElementById('countViewMissing').onclick = function () { countMode = 'missing'; renderCount(); };
    document.getElementById('countViewHistory').onclick = function () { countMode = 'history'; renderCount(); };
    document.getElementById('countClearBtn').onclick = function () {
      showConfirm('Clear all checkmarks', 'This blanks every checkmark across all steel so the next count starts fresh. Continue?', function () {
        runMutation('clearAllCounts', [lastOperator, newOpId()], function (r) {
          countCache.forEach(function (t) { t.countedOn = ''; });
          toast('Cleared ' + ((r && r.cleared) || 0) + ' checkmark(s)');
        }, function (err) { showModal({ title: 'Could not clear', message: err.message, confirmText: 'OK' }); });
      }, 'Clear', 'danger');
    };
  }

  // ----- The walk (Stage 1 = Current, Stage 2 = WIP) -----
  function countRows() {
    var term = ((document.getElementById('countSearch') || {}).value || '').trim().toLowerCase();
    var st = countWalkStatus();
    return countCache.filter(function (t) {
      if ((t.status || 'Current') !== st) return false;
      if (term) {
        var hit = String(t.ticket).toLowerCase().indexOf(term) !== -1 ||
                  String(t.skidId).toLowerCase().indexOf(term) !== -1;
        if (!hit) return false;
      }
      return true;
    });
  }
  function updateCountProgress() {
    var rows = countRows();
    var counted = rows.filter(countIsFound).length;
    var prog = document.getElementById('countProgress');
    if (prog) prog.textContent = counted + ' of ' + rows.length + ' found';
  }
  function countSortedGroups() {
    var rows = countRows().slice();
    rows.sort(function (a, b) {
      if (countSort === 'bw') { var c = cmpNumeric(a.bw, b.bw); return c || cmpTicket(a.ticket, b.ticket); }
      var d = cmpNumeric(a.row, b.row); return d || cmpTicket(a.ticket, b.ticket);
    });
    var groups = [], byKey = {};
    rows.forEach(function (t) {
      var key = countSort === 'bw' ? ('BW ' + (t.bw || '—')) : ('Location ' + (t.row || '—'));
      if (!byKey[key]) { byKey[key] = { key: key, items: [] }; groups.push(byKey[key]); }
      byKey[key].items.push(t);
    });
    return groups;
  }

  function renderCountWalk() {
    var view = document.getElementById('view');
    var stage = countWalkStatus();
    var stageLabel = stage === 'WIP' ? 'Stage 2 of 2 — WIP count' : 'Stage 1 of 2 — Current count';
    var help = stage === 'WIP'
      ? 'Check off every WIP pallet you find. Highlighted pallets were just moved from Current — hunt for those. When done, tap Finish to mark whatever is left as Missing.'
      : 'Check off every Current pallet you find. When done, tap Finish to move the not-found ones to WIP.';
    view.innerHTML =
      '<div class="card"><div class="row" style="align-items:center;gap:8px">' +
          '<h3 style="margin:0;flex:1">Steel Count</h3>' +
          '<span class="badge ' + (stage === 'WIP' ? 'wip' : 'notstarted') + '">' + esc(stageLabel) + '</span>' +
        '</div>' +
        '<div class="sub" style="margin:6px 0 8px">' + esc(help) + '</div>' +
        '<div class="tabbar">' +
          '<button id="sortBw">By BW &rarr; Ticket</button><button id="sortLoc">By Location &rarr; Ticket</button>' +
        '</div>' +
        '<div class="row" style="align-items:center;margin-top:10px">' +
          '<div class="sub" id="countProgress" style="flex:1"></div>' +
          '<button class="btn secondary" id="countPrintBtn" style="padding:8px 12px;font-size:13px">🖨&nbsp; Print list</button>' +
        '</div>' +
      '</div>' +
      '<div id="countSearchBar" style="position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)">' +
        searchBarHtml('countSearch') +
      '</div>' +
      '<div id="countList"></div>' +
      '<div class="card" style="position:sticky;bottom:0;z-index:5">' +
        '<button class="btn ' + (stage === 'WIP' ? 'danger' : '') + '" id="countFinishBtn" style="width:100%;padding:14px;font-size:16px">' +
          (stage === 'WIP' ? 'Finish WIP count →' : 'Finish Current count →') +
        '</button>' +
        '<div class="sub" style="text-align:center;margin-top:6px">Count started ' + esc(countSession.startedOn) + (countSession.startedBy ? ' by ' + esc(countSession.startedBy) : '') + '</div>' +
      '</div>';
    setActiveBtn(['sortBw', 'sortLoc'], countSort === 'loc' ? 'sortLoc' : 'sortBw');
    document.getElementById('sortBw').onclick = function () { countSort = 'bw'; setActiveBtn(['sortBw', 'sortLoc'], 'sortBw'); renderCountList(); };
    document.getElementById('sortLoc').onclick = function () { countSort = 'loc'; setActiveBtn(['sortBw', 'sortLoc'], 'sortLoc'); renderCountList(); };
    document.getElementById('countSearch').oninput = function () { renderCountList(); };
    document.getElementById('countPrintBtn').onclick = printCount;
    document.getElementById('countFinishBtn').onclick = finishCountStage;
    renderCountList();
  }

  function renderCountList() {
    var el = document.getElementById('countList');
    if (!el) return;
    updateCountProgress();
    countGroups = countSortedGroups();
    if (!countGroups.length) { el.innerHTML = '<div class="card empty">No ' + esc(countWalkStatus()) + ' steel to count.</div>'; return; }
    var byLoc = countSort === 'loc'; // check-all only in location mode
    var inWip = countWalkStatus() === 'WIP';
    var html = '<div class="card">';
    countGroups.forEach(function (g, gi) {
      var allDone = g.items.every(countIsFound);
      html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px">' +
        '<span style="font-weight:700;color:var(--accent)">' + esc(g.key) + ' <span class="sub" style="font-weight:400">(' + g.items.length + ')</span></span>' +
        (byLoc ? '<button class="btn secondary" style="padding:5px 10px;font-size:12px" data-checkgroup="' + gi + '">' + (allDone ? 'Uncheck all' : 'Check all') + '</button>' : '') +
      '</div>';
      g.items.forEach(function (t) {
        var checked = countIsFound(t);
        var promoted = inWip && countPromoted[t.skidId];
        html += '<div class="queue-item" style="padding:6px 0' + (promoted ? ';background:var(--warnbg,rgba(255,196,0,.14));border-radius:8px;padding-left:8px;padding-right:8px' : '') + '">' +
          '<label style="display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;flex:1">' +
            '<input type="checkbox" class="countChk" data-skid="' + esc(t.skidId) + '" style="width:22px;height:22px;flex:0 0 auto"' + (checked ? ' checked' : '') + '>' +
            '<span style="min-width:0"><span class="bwtag">BW ' + esc(t.bw || '?') + '</span>' +
              (promoted ? '<span class="badge wip" style="margin-right:6px">from Current</span>' : '') +
              '<span class="ticket-id" style="font-size:15px">' + esc(t.ticket || '(no ticket)') + '</span>' +
              '<div class="sub">Loc ' + esc(t.row || '—') + ' &middot; ' + esc(t.qty || 0) + ' sheets</div></span>' +
          '</label>' +
          '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-countedit="' + esc(t.skidId) + '">Edit</button>' +
        '</div>' +
        '<div id="countEdit_' + esc(t.skidId) + '" style="display:none;padding:0 0 10px"></div>';
      });
    });
    html += '</div>';
    el.innerHTML = html;
    wireCountList();
  }

  // Check-offs are saved in batches instead of one request per tap: taps are collected and sent
  // together once there's a COUNT_FLUSH_MS pause (or COUNT_FLUSH_MAX are waiting), and right away
  // before Finish, or when the iPad locks / the tab is hidden. A 300-pallet count used to be 300
  // requests; now it's a few dozen. Setting Counted At is repeatable, so a retried batch is safe.
  var COUNT_FLUSH_MS = 4000, COUNT_FLUSH_MAX = 25;
  var countQueue = {}, countFlushTimer = null;   // skidId -> { want, was } (was = the saved state)
  function countQueued() { return Object.keys(countQueue).length; }
  function queueCountCheck(sk, checked) {
    var q = countQueue[sk];
    if (q && q.was === checked) delete countQueue[sk];   // tapped back to how it's saved: nothing to send
    else countQueue[sk] = { want: checked, was: q ? q.was : !checked };   // the latest tap wins
    clearTimeout(countFlushTimer);
    if (!countQueued()) return;
    if (countQueued() >= COUNT_FLUSH_MAX) flushCountQueue();
    else countFlushTimer = setTimeout(function () { flushCountQueue(); }, COUNT_FLUSH_MS);
  }
  function flushCountQueue(done) {
    clearTimeout(countFlushTimer); countFlushTimer = null;
    var ids = Object.keys(countQueue);
    var batches = [true, false].map(function (want) {
      return { want: want, ids: ids.filter(function (sk) { return countQueue[sk].want === want; }) };
    }).filter(function (b) { return b.ids.length; });
    countQueue = {};
    var left = batches.length;
    if (!left) { if (done) done(); return; }
    function one() { if (--left === 0 && done) done(); }
    batches.forEach(function (b) {
      runMutation('setSkidsCounted', [b.ids, b.want, lastOperator, newOpId()], one, function (err) {
        toast('Count not saved (' + b.ids.length + ' pallet' + (b.ids.length === 1 ? '' : 's') + '): ' + err.message);
        b.ids.forEach(function (sk) {   // undo them on screen so the list matches what's saved
          var t = countCache.filter(function (x) { return x.skidId === sk; })[0];
          if (t) t.countedOn = b.want ? '' : todayStr();
          var box = document.querySelector('.countChk[data-skid="' + sk.replace(/"/g, '') + '"]');
          if (box) box.checked = !b.want;
        });
        if (document.getElementById('countProgress')) updateCountProgress();
        one();
      });
    });
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden && countQueued()) flushCountQueue(); });
  window.addEventListener('pagehide', function () { if (countQueued()) flushCountQueue(); });

  function wireCountList() {
    Array.prototype.forEach.call(document.querySelectorAll('.countChk'), function (chk) {
      chk.onchange = function () {
        var sk = chk.getAttribute('data-skid');
        var checked = chk.checked;
        var t = countCache.filter(function (x) { return x.skidId === sk; })[0];
        if (t) t.countedOn = checked ? todayStr() : ''; // optimistic
        updateCountProgress();
        queueCountCheck(sk, checked);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-countedit]'), function (btn) {
      btn.onclick = function () { openCountEdit(btn.getAttribute('data-countedit')); };
    });
    // Check / uncheck a whole location group in one bulk call (avoids a burst of Sheets reads).
    Array.prototype.forEach.call(document.querySelectorAll('[data-checkgroup]'), function (btn) {
      btn.onclick = function () {
        var g = countGroups[Number(btn.getAttribute('data-checkgroup'))];
        if (!g) return;
        var op = lastOperator;
        var want = !g.items.every(countIsFound); // all found -> uncheck all
        var stamp = want ? todayStr() : '';
        var ids = [];
        g.items.forEach(function (t) {
          if (countIsFound(t) === want) return; // already in desired state
          t.countedOn = stamp;
          ids.push(t.skidId);
          delete countQueue[t.skidId];   // this bulk save supersedes a waiting tap
        });
        renderCountList();
        if (ids.length) runMutation('setSkidsCounted', [ids, want, op, newOpId()], function () {},
          function (err) { toast('Count not saved: ' + err.message); });
      };
    });
  }

  function openCountEdit(sk) {
    var t = countCache.filter(function (x) { return x.skidId === sk; })[0];
    var form = document.getElementById('countEdit_' + sk);
    if (!form || !t) return;
    if (form.style.display === 'block') { form.style.display = 'none'; form.innerHTML = ''; return; }
    form.style.display = 'block';
    form.innerHTML =
      '<div class="row">' +
        '<div class="field"><label>Location</label><input id="ceLoc_' + esc(sk) + '" value="' + esc(t.row || '') + '"></div>' +
        '<div class="field"><label>Sheets (qty)</label><input type="number" inputmode="numeric" id="ceQty_' + esc(sk) + '" min="0" value="' + esc(t.qty || 0) + '"></div>' +
      '</div>' +
      '<button class="btn success" id="ceSave_' + esc(sk) + '">Save</button> ' +
      '<button class="btn secondary" id="ceCancel_' + esc(sk) + '">Cancel</button>';
    document.getElementById('ceCancel_' + sk).onclick = function () { form.style.display = 'none'; form.innerHTML = ''; };
    document.getElementById('ceSave_' + sk).onclick = function () {
      var loc = document.getElementById('ceLoc_' + sk).value;
      var qty = document.getElementById('ceQty_' + sk).value;
      var op = lastOperator;
      if (qty !== '' && (isNaN(Number(qty)) || Number(qty) < 0)) { toast('Sheets must be 0 or more'); return; }
      var fields = { Row: loc };
      if (qty !== '') fields['QTY/LOAD'] = Number(qty);
      var btn = document.getElementById('ceSave_' + sk); btn.disabled = true; btn.textContent = 'Saving…';
      runMutation('updateTicketDetails', [sk, fields, op, newOpId()],
        function () {
          if (t) { t.row = loc; if (qty !== '') t.qty = Number(qty); }
          toast('Updated');
          renderCountList();
        },
        function (err) { showModal({ title: 'Could not save', message: err.message, confirmText: 'OK' }); btn.disabled = false; btn.textContent = 'Save'; });
    };
  }

  // ----- Finish a stage -> review the not-found pallets -----
  // Reload from the server first: another iPad may be counting other aisles, and this device's
  // list only knows about its own check-offs. Without the refresh, every pallet the other device
  // found would show here as "not found" (pre-selected to move/mark Missing).
  function finishCountStage() {
    var btn = document.getElementById('countFinishBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Checking latest count…'; }
    flushCountQueue(function () { refreshCount(finishCountStageNow); });   // save waiting check-offs first
  }
  function finishCountStageNow() {
    if (!countSession) { countMode = 'walk'; toast('This count was already finished on another device'); return renderCount(); }
    var st = countWalkStatus();
    var notFound = countCache.filter(function (t) { return (t.status || 'Current') === st && !countIsFound(t); });
    countReviewSel = {};
    notFound.forEach(function (t) { countReviewSel[t.skidId] = true; }); // pre-select all
    countMode = (st === 'WIP') ? 'reviewMissing' : 'reviewPromote';
    renderCount();
  }
  function countReviewItems() {
    var st = (countMode === 'reviewMissing') ? 'WIP' : 'Current';
    return countCache.filter(function (t) { return (t.status || 'Current') === st && !countIsFound(t); })
      .sort(function (a, b) { var c = cmpNumeric(a.bw, b.bw); return c || cmpTicket(a.ticket, b.ticket); });
  }
  function renderCountReview() {
    var toMissing = countMode === 'reviewMissing';
    var items = countReviewItems();
    var view = document.getElementById('view');
    var title = toMissing ? 'Not found in WIP' : 'Not found in Current';
    var lead = toMissing
      ? 'These WIP pallets weren\'t found anywhere. Un-check any you don\'t want to mark Missing, then confirm. Missing pallets stay in the system on the Missing list — you can restore one if it turns up.'
      : 'These Current pallets weren\'t found. They were likely moved to WIP without being recorded. Un-check any you don\'t want to move, then confirm.';
    var html =
      '<div class="card"><h3 style="margin-top:0">' + esc(title) + '</h3>' +
        '<div class="sub" style="margin-bottom:8px">' + esc(lead) + '</div>';
    if (!items.length) {
      html += '<div class="empty" style="padding:12px 0">Every pallet was found — nothing to ' + (toMissing ? 'mark Missing' : 'move') + '. 🎉</div>';
    } else {
      html += '<div class="row" style="gap:8px;margin-bottom:6px">' +
        '<button class="btn secondary" id="revAll" style="padding:5px 10px;font-size:12px">Select all</button>' +
        '<button class="btn secondary" id="revNone" style="padding:5px 10px;font-size:12px">Select none</button></div>';
      items.forEach(function (t) {
        html += '<div class="queue-item" style="padding:6px 0">' +
          '<label style="display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;flex:1">' +
            '<input type="checkbox" class="revChk" data-skid="' + esc(t.skidId) + '" style="width:22px;height:22px;flex:0 0 auto"' + (countReviewSel[t.skidId] ? ' checked' : '') + '>' +
            '<span style="min-width:0"><span class="bwtag">BW ' + esc(t.bw || '?') + '</span>' +
              '<span class="ticket-id" style="font-size:15px">' + esc(t.ticket || '(no ticket)') + '</span>' +
              '<div class="sub">Loc ' + esc(t.row || '—') + ' &middot; ' + esc(t.qty || 0) + ' sheets</div></span>' +
          '</label></div>';
      });
    }
    html += '</div>' +
      '<div class="card" style="display:flex;gap:8px;position:sticky;bottom:0;z-index:5">' +
        '<button class="btn secondary" id="revBack" style="flex:1;padding:12px">Back to walk</button>' +
        '<button class="btn ' + (toMissing ? 'danger' : 'success') + '" id="revConfirm" style="flex:2;padding:12px;font-size:16px">' +
          (toMissing ? 'Mark selected Missing' : 'Move selected to WIP') +
        '</button>' +
      '</div>';
    view.innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.revChk'), function (chk) {
      chk.onchange = function () { countReviewSel[chk.getAttribute('data-skid')] = chk.checked; };
    });
    var all = document.getElementById('revAll'); if (all) all.onclick = function () { items.forEach(function (t) { countReviewSel[t.skidId] = true; }); renderCount(); };
    var none = document.getElementById('revNone'); if (none) none.onclick = function () { items.forEach(function (t) { countReviewSel[t.skidId] = false; }); renderCount(); };
    document.getElementById('revBack').onclick = function () { countMode = 'walk'; renderCount(); };
    document.getElementById('revConfirm').onclick = function () { confirmCountReview(items, toMissing); };
  }

  function failReview(btn, toMissing, err) {
    if (btn) { btn.disabled = false; btn.textContent = toMissing ? 'Mark selected Missing' : 'Move selected to WIP'; }
    showModal({ title: 'Could not save', message: err.message, confirmText: 'OK' });
  }
  function confirmCountReview(items, toMissing) {
    var ids = items.filter(function (t) { return countReviewSel[t.skidId]; }).map(function (t) { return t.skidId; });
    var op = lastOperator || (countSession && countSession.startedBy) || '';
    var btn = document.getElementById('revConfirm'); if (btn) { btn.disabled = true; btn.textContent = 'Working…'; }
    if (toMissing) {
      // Stage 2 finish: mark selected Missing (if any), then close the session and show the summary.
      var doDone = function () {
        var summ = {
          foundCurrent: countCache.filter(function (t) { return (t.status || '') === 'Current' && countIsFound(t); }).length,
          promoted: Object.keys(countPromoted).length,
          foundWip: countCache.filter(function (t) { return (t.status || '') === 'WIP' && countIsFound(t); }).length,
          missing: ids.length,
          startedOn: countSession.startedOn,
        };
        // Save the tallies on the session record + clear every checkmark for the next count.
        var serverSumm = { currentFound: summ.foundCurrent, promoted: summ.promoted, wipFound: summ.foundWip, missing: summ.missing };
        runMutation('endCount', [countSession.sessionId, op, serverSumm, newOpId()], function () {
          countSummary = summ; countMode = 'summary'; countSession = null;
          countCache.forEach(function (t) { t.countedOn = ''; }); // checkmarks cleared server-side too
          refreshCount(renderCount); // reload cache so Missing statuses are reflected on the Missing list
        }, function (err) { failReview(btn, toMissing, err); });
      };
      if (ids.length) {
        runMutation('markSkidsMissing', [ids, op, newOpId()], function () {
          ids.forEach(function (id) { countSetStatus(id, 'Missing'); });
          doDone();
        }, function (err) { failReview(btn, toMissing, err); });
      } else { doDone(); }
    } else {
      // Stage 1 finish: promote selected Current -> WIP (if any), then advance to Stage 2.
      var advance = function () {
        runMutation('setCountStage', [countSession.sessionId, 'WIP', op, newOpId()], function (sess) {
          countSession = sess || countSession; countSession.stage = 'WIP';
          countMode = 'walk';
          renderCount();
        }, function (err) { failReview(btn, toMissing, err); });
      };
      if (ids.length) {
        runMutation('promoteUnfoundToWip', [ids, op, newOpId()], function () {
          ids.forEach(function (id) { countSetStatus(id, 'WIP'); countPromoted[id] = true; });
          advance();
        }, function (err) { failReview(btn, toMissing, err); });
      } else { advance(); }
    }
  }

  // ----- Count-complete summary -----
  function renderCountSummary() {
    var s = countSummary || { foundCurrent: 0, promoted: 0, foundWip: 0, missing: 0, startedOn: '' };
    function line(label, val) {
      return '<div class="row" style="justify-content:space-between;padding:4px 0"><span>' + label + '</span><strong>' + val + '</strong></div>';
    }
    var view = document.getElementById('view');
    view.innerHTML =
      '<div class="card"><h3 style="margin-top:0">Count complete ✅</h3>' +
        '<div class="sub" style="margin-bottom:10px">Count started ' + esc(s.startedOn || '') + '</div>' +
        line('Current pallets found', s.foundCurrent) +
        line('Moved Current → WIP', s.promoted) +
        line('WIP pallets found', s.foundWip) +
        line('Marked Missing', s.missing) +
        '<div class="sub" style="margin-top:10px">Saved to history. All checkmarks were cleared — ready for the next count.</div>' +
      '</div>' +
      '<div class="card" style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn secondary" id="sumMissing" style="flex:1;padding:12px;min-width:130px">Missing list</button>' +
        '<button class="btn secondary" id="sumHistory" style="flex:1;padding:12px;min-width:130px">History</button>' +
        '<button class="btn" id="sumDone" style="flex:1;padding:12px;min-width:130px">Done</button>' +
      '</div>';
    document.getElementById('sumMissing').onclick = function () { countMode = 'missing'; renderCount(); };
    document.getElementById('sumHistory').onclick = function () { countMode = 'history'; renderCount(); };
    document.getElementById('sumDone').onclick = function () { countSummary = null; openSteelCount(); };
  }

  // ----- Count history (saved past counts + their tallies) -----
  function renderCountHistory() {
    var view = document.getElementById('view');
    view.innerHTML = '<div class="card"><h3 style="margin-top:0">Past counts</h3>' +
      '<div id="countHistList"><div class="loading">Loading&hellip;</div></div></div>' +
      '<div class="card"><button class="btn secondary" id="histBack" style="width:100%;padding:12px">← Back</button></div>';
    document.getElementById('histBack').onclick = function () { countMode = countSummary ? 'summary' : 'walk'; renderCount(); };
    var tok = viewToken;
    google.script.run.withSuccessHandler(function (list) {
      if (tok !== viewToken) return;
      var el = document.getElementById('countHistList');
      if (!el) return;
      list = (list || []).filter(function (s) { return s.stage === 'Done'; });
      if (!list.length) { el.innerHTML = '<div class="empty" style="padding:10px 0">No finished counts yet.</div>'; return; }
      var html = '';
      list.forEach(function (s) {
        html += '<div class="queue-item" style="display:block;padding:10px 0">' +
          '<div><strong>' + esc(s.endedOn || s.startedOn || s.sessionId) + '</strong>' +
            (s.endedBy ? ' <span class="sub">by ' + esc(s.endedBy) + '</span>' : '') + '</div>' +
          '<div class="sub">Found ' + s.currentFound + ' Current &middot; moved ' + s.promoted + ' to WIP &middot; found ' +
            s.wipFound + ' WIP &middot; ' + s.missing + ' marked Missing</div>' +
          '<div class="sub">Started ' + esc(s.startedOn || '') + (s.startedBy ? ' by ' + esc(s.startedBy) : '') + ' &middot; ' + esc(s.sessionId) + '</div>' +
        '</div>';
      });
      el.innerHTML = html;
    }).withFailureHandler(function (err) {
      var el = document.getElementById('countHistList');
      if (el) el.innerHTML = '<div class="empty">Could not load history: ' + esc(err.message) + '</div>';
    }).getCountHistory();
  }

  // ----- Missing list (replaces the manual missing-tickets spreadsheet) -----
  function renderCountMissing() {
    var view = document.getElementById('view');
    var missing = countCache.filter(function (t) { return (t.status || '') === 'Missing'; })
      .sort(function (a, b) { var c = cmpNumeric(a.bw, b.bw); return c || cmpTicket(a.ticket, b.ticket); });
    var html =
      '<div class="card"><div class="row" style="align-items:center;gap:8px">' +
          '<h3 style="margin:0;flex:1">Missing list</h3>' +
          '<button class="btn secondary" id="missPrint" style="padding:8px 12px;font-size:13px">🖨&nbsp; Print</button>' +
        '</div>' +
        '<div class="sub" style="margin-top:6px">' + missing.length + ' pallet(s) not found. Restore one if it turns up — it returns to Current (raw) or WIP (coated).</div>' +
      '</div>';
    if (!missing.length) {
      html += '<div class="card empty">No missing pallets. 🎉</div>';
    } else {
      html += '<div class="card">';
      missing.forEach(function (t) {
        html += '<div class="queue-item" style="padding:8px 0">' +
          '<span style="min-width:0;flex:1"><span class="bwtag">BW ' + esc(t.bw || '?') + '</span>' +
            '<span class="ticket-id" style="font-size:15px">' + esc(t.ticket || '(no ticket)') + '</span>' +
            '<div class="sub">Loc ' + esc(t.row || '—') + ' &middot; ' + esc(t.qty || 0) + ' sheets &middot; missing ' + esc(t.missingOn || '') + (t.missingBy ? ' by ' + esc(t.missingBy) : '') + '</div></span>' +
          '<button class="btn secondary" style="padding:6px 10px;font-size:13px" data-restore="' + esc(t.skidId) + '">Restore</button>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '<div class="card"><button class="btn secondary" id="missBack" style="width:100%;padding:12px">← Back</button></div>';
    view.innerHTML = html;
    document.getElementById('missBack').onclick = function () { countMode = countSummary ? 'summary' : 'walk'; renderCount(); };
    var mp = document.getElementById('missPrint'); if (mp) mp.onclick = printMissing;
    Array.prototype.forEach.call(document.querySelectorAll('[data-restore]'), function (btn) {
      btn.onclick = function () {
        var sk = btn.getAttribute('data-restore');
        var t = countCache.filter(function (x) { return x.skidId === sk; })[0];
        restoreMissingSkid(sk, t);
      };
    });
  }
  function restoreMissingSkid(sk, t) {
    var coated = t && Number(t.litho) > 0;
    var dest = coated ? 'WIP' : 'Current';
    showConfirm('Restore pallet', 'Restore ' + (t && t.ticket ? t.ticket : sk) + ' to ' + dest + '? (' + (coated ? 'it has litho applied' : 'raw steel, no litho') + ')', function () {
      var op = lastOperator;
      runMutation('restoreMissing', [sk, dest, op, newOpId()], function () {
        countSetStatus(sk, dest);
        toast('Restored to ' + dest);
        renderCount();
      }, function (err) { showModal({ title: 'Could not restore', message: err.message, confirmText: 'OK' }); });
    }, 'Restore', 'success');
  }

  // ----- Print check sheets (mirrors the Container Supply paper WIP/Current check sheet) -----
  // Each Basis Weight gets a stable color from this palette (sorted smallest->largest), so the
  // sheet reads the same way the paper one does.
  var BW_PALETTE = [[198,224,180],[155,194,230],[255,217,102],[255,200,80],[146,208,80],[0,176,240],
                    [112,173,71],[255,160,80],[100,160,220],[218,130,130],[180,140,210],[80,200,160]];
  function bwPaletteMap(records) {
    var bws = [];
    records.forEach(function (r) { var v = parseFloat(r.bw); if (!isNaN(v) && bws.indexOf(v) === -1) bws.push(v); });
    bws.sort(function (a, b) { return a - b; });
    var map = {};
    bws.forEach(function (bw, i) { map[bw] = BW_PALETTE[i % BW_PALETTE.length]; });
    return map;
  }
  function csDateStr() {
    return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  function csHeader(title) {
    return '<div class="cs-date">' + esc(csDateStr()) + '</div>' +
      '<div class="cs-head"><div class="cs-co">Container Supply Company, Inc.</div>' +
      '<div class="cs-title">' + esc(title) + '</div></div><hr class="cs-rule">';
  }
  // Footer (title left, page number right) via CSS paged-media margin boxes; harmless where unsupported.
  function csFooterStyle(title) {
    return '<style>@page { @bottom-left { content: "' + title + '"; font-size: 7pt; color: #646464; }' +
      ' @bottom-right { content: "Page " counter(page); font-size: 7pt; color: #646464; } }</style>';
  }

  function printCount() {
    var stage = countWalkStatus();
    var title = (stage === 'WIP' ? 'WIP' : 'Current') + ' Steel Check Sheet';
    // Whole list for this stage (ignore the on-screen search), in the current sort order.
    var records = countCache.filter(function (t) { return (t.status || 'Current') === stage; });
    records.sort(function (a, b) {
      if (countSort === 'bw') { var c = cmpNumeric(a.bw, b.bw); return c || cmpTicket(a.ticket, b.ticket); }
      var d = cmpNumeric(a.row, b.row); return d || cmpTicket(a.ticket, b.ticket);
    });
    var cmap = bwPaletteMap(records);
    var SETS = 3, R = Math.ceil(records.length / SETS) || 1;    // fill column-major into 3 sets

    var head = '<tr>';
    for (var s = 0; s < SETS; s++) {
      var sep = s ? ' cs-sep' : '';
      head += '<th class="bw' + sep + '">BW</th><th class="tk">Ticket</th><th>&#10003;</th><th>Loc</th>';
    }
    head += '</tr>';

    var rowsHtml = '';
    for (var i = 0; i < R; i++) {
      rowsHtml += '<tr>';
      for (var col = 0; col < SETS; col++) {
        var rec = records[i + col * R];
        var sep2 = col ? ' cs-sep' : '';
        if (rec) {
          var c2 = cmap[parseFloat(rec.bw)];
          var bg = c2 ? 'background:rgb(' + c2[0] + ',' + c2[1] + ',' + c2[2] + ')' : '';
          var chk = countIsFound(rec) ? '&#10003;' : '';
          rowsHtml += '<td class="bw' + sep2 + '" style="' + bg + '">' + esc(rec.bw || '') + '</td>' +
            '<td class="tk">' + esc(rec.ticket || '') + '</td>' +
            '<td><span class="ckbox">' + chk + '</span></td>' +
            '<td>' + esc(rec.row || '') + '</td>';
        } else {
          rowsHtml += '<td class="bw' + sep2 + '"></td><td></td><td></td><td></td>';
        }
      }
      rowsHtml += '</tr>';
    }

    var table = records.length
      ? '<table><thead>' + head + '</thead><tbody>' + rowsHtml + '</tbody></table>'
      : '<div>No ' + esc(stage) + ' steel to print.</div>';
    document.getElementById('printArea').innerHTML = csFooterStyle(title) + csHeader(title) + table;
    window.print();
  }

  function printMissing() {
    var title = 'Missing Steel List';
    var missing = countCache.filter(function (t) { return (t.status || '') === 'Missing'; })
      .sort(function (a, b) { var c = cmpNumeric(a.bw, b.bw); return c || cmpTicket(a.ticket, b.ticket); });
    var cmap = bwPaletteMap(missing);
    var head = '<tr><th class="bw">BW</th><th class="tk">Ticket</th><th>Loc</th><th>Sheets</th><th>Missing Since</th></tr>';
    var rows = '';
    missing.forEach(function (t) {
      var c = cmap[parseFloat(t.bw)];
      var bg = c ? 'background:rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')' : '';
      rows += '<tr><td class="bw" style="' + bg + '">' + esc(t.bw || '') + '</td>' +
        '<td class="tk">' + esc(t.ticket || '') + '</td><td>' + esc(t.row || '') + '</td>' +
        '<td>' + esc(t.qty || 0) + '</td><td>' + esc(t.missingOn || '') + '</td></tr>';
    });
    var table = missing.length
      ? '<table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>'
      : '<div>No missing pallets.</div>';
    document.getElementById('printArea').innerHTML = csFooterStyle(title) + csHeader(title) + table;
    window.print();
  }

  // ---- Skid traveler ---------------------------------------------------------------------
  // A one-page printout of everything done to a skid: ticket + steel specs + every coating
  // applied with its date and operator, plus a scannable Data Matrix label encoding the same.
  // Replaces the hand-written sheet; scan the label with a 2D imager to pull the ticket +
  // full coating/date history back out. Uses the same #printArea/window.print() flow as the
  // check sheets, so it inherits the app's print styles.
  function travelerDate(ts) { var m = String(ts || '').match(/\d{4}-\d{2}-\d{2}/); return m ? m[0] : String(ts || ''); }

  // Join each active coating pass to its transaction row (same passNumber) to recover the date
  // and operator, since the coating objects themselves carry no timestamp.
  function travelerCoatings(card) {
    var byPass = {};
    (card.transactions || []).forEach(function (t) { if (t.passNumber >= 1 && t.group) byPass[t.passNumber] = t; });
    return (card.coatings || []).map(function (c) {
      var t = byPass[c.passNumber] || {};
      return { passNumber: c.passNumber, item: c.item, group: c.group, sub: c.sub, cost: c.cost,
        when: t.timestamp || '', operator: t.operator || '' };
    });
  }

  // The label is 6in wide x 4in tall (landscape media), so the page is defined as 6in x 4in and the
  // traveler fills it directly — no rotation. All styles are scoped to `.trav` and use !important
  // where needed to override the app's generic #printArea print rules — in particular the
  // nowrap/ellipsis on table cells, which otherwise truncates the coatings. Pure black only,
  // since the label printer is 1-bit B/W.
  function travelerStyle() {
    return '<style>@media print {' +
      '@page { size: 6in 4in; margin: 0.12in; }' +
      '#printArea .trav { width: 5.76in; padding-top: 0.15in; color:#000; font-family:Arial,Helvetica,sans-serif; }' +
      '#printArea .trav, #printArea .trav * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }' +
      '#printArea .trav .top { display:flex; align-items:flex-start; gap:10px; }' +
      '#printArea .trav .tlogo { flex:none; height:0.62in; width:auto; }' +
      '#printArea .trav .hd { flex:1; min-width:0; }' +
      '#printArea .trav .co { font-size:8pt; font-weight:bold; }' +
      '#printArea .trav h2 { font-size:17pt; margin:2px 0 0; line-height:1; }' +
      '#printArea .trav .skid { font-size:9pt; font-weight:bold; margin-top:1px; }' +
      '#printArea .trav .dm { flex:none; text-align:center; }' +
      '#printArea .trav .dm svg { width:0.95in; height:0.95in; display:block; }' +
      '#printArea .trav table.specs { border-collapse:collapse; margin:5px 0 2px; width:100%; }' +
      '#printArea .trav table.specs td { border:0 !important; padding:0 4px 2px 0 !important; font-size:8pt; white-space:normal !important; overflow:visible !important; text-overflow:clip !important; text-align:left !important; }' +
      '#printArea .trav table.specs td.v { font-weight:bold; padding-right:14px !important; }' +
      '#printArea .trav hr { border:0; border-top:1pt solid #000; margin:3px 0; }' +
      '#printArea .trav .h3 { font-size:9.5pt; font-weight:bold; margin:3px 0 2px; }' +
      '#printArea .trav table.coats { width:100%; border-collapse:collapse; table-layout:fixed !important; }' +
      '#printArea .trav table.coats th { background:#000 !important; color:#fff !important; font-size:7pt; padding:2px 3px !important; text-align:left !important; white-space:normal !important; }' +
      '#printArea .trav table.coats td { border:0.5pt solid #000 !important; font-size:7.5pt; padding:2px 4px !important; text-align:left !important; white-space:normal !important; overflow:visible !important; text-overflow:clip !important; word-break:break-word; }' +
      '#printArea .trav table.coats td.n { text-align:center !important; }' +
      '#printArea .trav table.coats td.d { white-space:nowrap !important; }' +
      '}</style>';
  }

  function printTraveler(card) {
    var steel = card.steel || {};
    var coats = travelerCoatings(card);

    // Data Matrix payload: ticket, then each coating "item YYYY-MM-DD", pipe-separated.
    var payload = String(card.ticket || card.skidId || '');
    coats.forEach(function (c) { payload += '|' + (c.item || '') + ' ' + travelerDate(c.when); });
    var dm = '';
    try { dm = dataMatrixSVG(payload, 4, 2); } catch (e) { dm = ''; }

    // Steel specs as label/value pairs, laid out two per row so everything fits the label.
    var specs = [
      ['Ticket', card.ticket], ['Skid ID', card.skidId], ['Status', card.status],
      ['Basis Wt', steel['BW']], ['Type', steel['TC']], ['Temper', steel['TM']],
      ['Length', steel['Length']], ['Width', steel['Width']], ['End Use', steel['End Use']],
      ['Job', steel['Job ID']]
    ].filter(function (s) { return s[1] !== '' && s[1] != null; });
    // Three pairs per row — the landscape label is wide but short, so pack specs horizontally.
    var specRows = '';
    for (var i = 0; i < specs.length; i += 3) {
      var cells = '';
      for (var j = 0; j < 3; j++) {
        var s = specs[i + j];
        cells += s ? '<td>' + esc(s[0]) + '</td><td class="v">' + esc(s[1]) + '</td>' : '<td></td><td></td>';
      }
      specRows += '<tr>' + cells + '</tr>';
    }

    var rows = coats.map(function (c, i) {
      return '<tr><td class="n">' + (i + 1) + '</td><td>' + esc(c.item || '') + '</td>' +
        '<td>' + esc(c.group || '') + (c.sub ? ' / ' + esc(c.sub) : '') + '</td>' +
        '<td class="d">' + esc(travelerDate(c.when)) + '</td><td>' + esc(c.operator || '') + '</td></tr>';
    }).join('');
    var table = coats.length
      ? '<table class="coats">' +
        '<colgroup><col style="width:6%"><col style="width:34%"><col style="width:26%"><col style="width:16%"><col style="width:18%"></colgroup>' +
        '<thead><tr><th>#</th><th>Coating</th><th>Group / Sub</th><th>Date</th><th>Operator</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>'
      : '<div style="font-size:8pt">No coatings recorded on this skid yet.</div>';

    // Reuse the CSC logo already embedded in the app header (no duplicated image data).
    var logoEl = document.querySelector('#appHeader .logo') || document.querySelector('.logo');
    var logo = (logoEl && logoEl.src) ? logoEl.src : '';

    var html = travelerStyle() +
      '<div class="trav">' +
        '<div class="top">' +
          (logo ? '<img class="tlogo" src="' + esc(logo) + '" alt="CSC">' : '') +
          '<div class="hd">' +
            '<div class="co">Container Supply CO.</div>' +
            '<h2>Ticket - ' + esc(card.ticket || '(none)') + '</h2>' +
            '<div class="skid">' + esc(card.skidId || '') + (card.status ? ' &middot; ' + esc(card.status) : '') + '</div>' +
          '</div>' +
          (dm ? '<div class="dm">' + dm + '</div>' : '') +
        '</div>' +
        '<table class="specs">' + specRows + '</table>' +
        '<hr>' +
        '<div class="h3">Coatings applied</div>' +
        table +
      '</div>';

    document.getElementById('printArea').innerHTML = html;
    window.print();
  }

  // Review Jobs is a button on the home screen (rendered by renderAll), wired to this.
  function openReview() {
    if (!managerOnly()) return;
    enterDetailView();
    renderReview();
  }

  var activeFilter = 'all';
  Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (btn) {
    btn.onclick = function () {
      activeFilter = btn.getAttribute('data-filter');
      setActiveFilter(activeFilter);
      var s = document.getElementById('mainSearch');
      renderAllRows(s ? s.value : '');
    };
  });

  function setActiveFilter(f) {
    Array.prototype.forEach.call(document.querySelectorAll('#tabbar button, #lithoFilters button'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-filter') === f);
    });
  }

  function enterDetailView() {
    nextViewToken(); // invalidate any in-flight list/detail response from the view we're leaving
    document.getElementById('tabbar').style.display = 'none';
    document.getElementById('backBtn').style.display = 'inline-block';
  }

  // ---------------- Combined ticket list (every status, from Steel Tickets) ----------------
  var allCache = [];
  var queueCache = []; // Current + WIP subset, for the job pickers (WIP = re-coat / another pass)

  // Fewer server calls: the ticket list (and the open-jobs bar) is reused for LIST_FRESH_MS
  // instead of being reloaded every time you go back to a list. It's reloaded sooner if this
  // device saves anything (lastSaveAt, set by runMutation), and a search that finds nothing
  // re-checks the server (recheckOnMiss), so a ticket added elsewhere is still found.
  var LIST_FRESH_MS = 3 * 60 * 1000;
  var lastSaveAt = 0;
  var ticketsLoadedAt = 0;   // when the request behind allCache was SENT
  function savedSinceTicketsLoaded() { return lastSaveAt > ticketsLoadedAt; }
  function ticketsFresh() { return allCache.length > 0 && !savedSinceTicketsLoaded() && Date.now() - ticketsLoadedAt < LIST_FRESH_MS; }
  function fetchTickets(onOk, onFail) {
    var sentAt = Date.now();
    google.script.run.withSuccessHandler(function (all) {
      setCaches(all); ticketsLoadedAt = sentAt;
      if (onOk) onOk(all);
    }).withFailureHandler(function (err) { if (onFail) onFail(err); }).getAllTickets();
  }

  function searchBarHtml(id) {
    return '<div class="searchwrap">' +
      '<svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>' +
      '<input id="' + id + '" placeholder="Search by ticket number&hellip;" autocomplete="off"></div>';
  }

  // Builds a labeled <select> field for a coating cascade. Options may be plain strings or
  // {value,text}/{item} objects; a leading "--" placeholder is always added. Sub/item/chem
  // selects are passed [] here and filled later by wireCoatingCascade.
  function selectField(id, label, options, selected) {
    var html = '<div class="field"><label>' + esc(label) + '</label><select id="' + esc(id) + '">' +
      '<option value="">--</option>';
    (options || []).forEach(function (o) {
      var val = (o && typeof o === 'object') ? (o.value != null ? o.value : o.item) : o;
      var text = (o && typeof o === 'object') ? (o.text != null ? o.text : (o.item != null ? o.item : val)) : o;
      var sel = (selected != null && selected !== '' && String(selected) === String(val)) ? ' selected' : '';
      html += '<option value="' + esc(val) + '"' + sel + '>' + esc(text) + '</option>';
    });
    return html + '</select></div>';
  }

  // A small labeled info box for the six steel specs shown on every ticket card.
  function metaBox(label, val) {
    return '<div><span>' + esc(label) + '</span>' + esc(val) + '</div>';
  }

  // Renders the SQF trace table from a skid's Transactions rows.
  // Full activity history for a skid: coatings AND lifecycle events (e.g. "USED IN PRODUCTION").
  // Sorted oldest-first by when it happened, so the story reads top to bottom and the used-in-
  // production line shows the date it was used. Detail = the coating group, or the event's note.
  function renderHistoryTable(rows) {
    if (!rows || !rows.length) return '<div class="sub">Nothing logged yet.</div>';
    var sorted = rows.slice().sort(function (a, b) { return String(a.timestamp || '').localeCompare(String(b.timestamp || '')); });
    var html = '<table><thead><tr><th>When</th><th>Item</th><th>Job</th><th>Detail</th><th>Cost</th><th>Operator</th><th>Running Total</th></tr></thead><tbody>';
    sorted.forEach(function (r) {
      var detail = r.group ? (esc(r.group) + (r.sub ? ' / ' + esc(r.sub) : '')) : (r.notes ? esc(r.notes) : (r.jobName ? esc(r.jobName) : ''));
      var job = r.jobId || r.jobName || '';
      html += '<tr><td class="sub" style="white-space:nowrap">' + esc(r.timestamp || '') + '</td><td>' + esc(r.item) +
        '</td><td class="sub" style="white-space:nowrap">' + esc(job) + '</td><td class="sub">' + detail + '</td><td>' + money(r.passTotal) + '</td><td>' + esc(r.operator) +
        '</td><td>' + money(r.runningTotal) + '</td></tr>';
    });
    return html + '</tbody></table>';
  }

  function setCaches(all) {
    if (!missCheck.busy) missCheck.term = null;   // fresh list: a later miss is worth re-checking again
    allCache = all || [];
    queueCache = allCache.filter(function (t) { return t.status === 'Current' || t.status === 'WIP'; });
  }

  // After a skid is added to a job it's no longer Current, so drop it from the picker source
  // immediately — otherwise it lingers as selectable until the background refresh lands.
  function dropFromQueueCache(skidId) {
    queueCache = queueCache.filter(function (q) { return q.skidId !== skidId; });
  }

  function badgeClassFor(status) {
    if (status === 'Current') return 'notstarted';
    if (status === 'Pending') return 'inprogress';
    if (status === 'WIP') return 'wip';
    if (status === 'In Production') return 'production';
    if (status === 'Used') return 'used';
    if (status === 'Cut') return 'wip';
    return 'notstarted';
  }

  // Loads the combined ticket list into allCache once, then runs cb. Used by the New Job /
  // production pickers which need every-status skids (queueCache is Current + WIP).
  // Fetch only when there's no list yet, or this device saved something since the list loaded.
  function ensureAllCache(cb) {
    if (allCache.length && !savedSinceTicketsLoaded()) { cb(); return; }
    fetchTickets(cb, function () { cb(); });
  }

  // Reflect a status change locally so a just-acted-on skid leaves the pickers immediately,
  // before the background getAllTickets refresh lands.
  function markCacheStatus(skidId, status) {
    allCache.forEach(function (t) { if (t.skidId === skidId) t.status = status; });
    queueCache = allCache.filter(function (t) { return t.status === 'Current' || t.status === 'WIP'; });
  }

  // The ticket list is loaded once and kept, so an iPad left open all shift doesn't see tickets
  // added on another device (or straight into the sheet). When a search/scan finds nothing, reload
  // the list once and run the lookup again. Waits for typing to pause (a scanner types the whole
  // code at once), and asks only once per search term so a real "no match" costs one request.
  var missCheck = { term: null, busy: false, timer: null };
  function recheckOnMiss(term, rerun, now) {
    term = String(term || '').trim().toLowerCase();
    if (!term || missCheck.busy || term === missCheck.term) return false;
    clearTimeout(missCheck.timer);
    missCheck.timer = setTimeout(function () {
      missCheck.busy = true; missCheck.term = term;
      fetchTickets(function () { missCheck.busy = false; rerun(); }, function () { missCheck.busy = false; rerun(); });
    }, now ? 0 : 700);
    return true;
  }
  var CHECKING_HTML = ' <span class="sub">Checking for newly added tickets&hellip;</span>';

  function renderAll() {
    var view = document.getElementById('view');
    var tok = nextViewToken();
    // Render the search + action buttons immediately so the search is usable right away; the
    // ticket list loads in the background (and shows instantly if we already have it cached).
    var chips = [['all', 'All'], ['current', 'Current Steel'], ['pending', 'Pending'], ['wip', 'WIP']].map(function (c) {
      return '<button data-filter="' + c[0] + '">' + esc(c[1]) + '</button>';
    }).join('');
    view.innerHTML =
      (lithoUser ? lithoGreetingHtml() : '') +
      '<div class="row" style="margin-bottom:12px">' +
        '<button class="btn" id="newJobBtn" style="flex:1;padding:24px;font-size:19px">+ New Job</button>' +
        '<button class="btn" id="reviewJobsBtn" style="flex:1;padding:24px;font-size:19px">Review Jobs</button>' +
      '</div>' +
      '<div class="searchrow">' +
        '<button class="btn secondary" id="addTicketBtn" style="flex:1">+ Add Ticket</button>' +
      '</div>' +
      '<div id="openJobsBar"></div>' +
      '<h3 style="margin:18px 0 8px;font-size:16px">Steel tickets</h3>' +
      '<div class="searchrow">' + searchBarHtml('mainSearch') + '</div>' +
      '<div class="tabbar" id="lithoFilters">' + chips + '</div>' +
      '<div id="allListContainer"><div class="loading">Loading tickets&hellip;</div></div>';
    wireLithoGreeting();
    Array.prototype.forEach.call(view.querySelectorAll('#lithoFilters button'), function (btn) {
      btn.onclick = function () {
        activeFilter = btn.getAttribute('data-filter');
        setActiveFilter(activeFilter);
        var s = document.getElementById('mainSearch');
        renderAllRows(s ? s.value : '');
      };
    });
    document.getElementById('newJobBtn').onclick = openCreateJob;
    document.getElementById('reviewJobsBtn').onclick = openReview;
    document.getElementById('addTicketBtn').onclick = function () { openAddTicket(''); };
    loadOpenJobsBar(tok);
    var searchInput = document.getElementById('mainSearch');
    searchInput.oninput = function () { renderAllRows(searchInput.value); };
    setActiveFilter(activeFilter);
    if (allCache.length) renderAllRows(searchInput.value || ''); // instant from cache
    if (ticketsFresh()) return;   // loaded a moment ago and nothing saved since: no need to ask again
    fetchTickets(function () {
      if (tok !== viewToken) return; // superseded by a later navigation
      var si = document.getElementById('mainSearch');
      renderAllRows(si ? si.value : '');
    }, function (err) {
      if (tok !== viewToken) return;
      var c = document.getElementById('allListContainer');
      if (c && !allCache.length) c.innerHTML = '<div class="card empty">Error loading tickets: ' + esc(err.message) + '</div>';
    });
  }

  // Open (unapproved) jobs shown as tap-to-resume tiles above the ticket list, so an unfinished
  // job survives a crash / walk-away — tapping one drops back into the add-tickets screen.
  var openJobsCache = null, openJobsAt = 0;
  function loadOpenJobsBar(tok, showEmpty) {
    if (openJobsCache && lastSaveAt < openJobsAt && Date.now() - openJobsAt < LIST_FRESH_MS) { renderOpenJobsBar(openJobsCache, showEmpty); return; }
    var sentAt = Date.now();
    google.script.run.withSuccessHandler(function (jobs) {
      openJobsCache = jobs || []; openJobsAt = sentAt;
      if (tok !== viewToken) return;
      renderOpenJobsBar(jobs, showEmpty);
    }).withFailureHandler(function () {
      var bar = document.getElementById('openJobsBar');
      if (bar) bar.innerHTML = '';   // non-critical: just hide the bar if it can't load
    }).getOpenJobs();
  }

  function renderOpenJobsBar(jobs, showEmpty) {
    var bar = document.getElementById('openJobsBar');
    if (!bar) return;
    if (!jobs || !jobs.length) { bar.innerHTML = showEmpty ? '<div class="card empty">No open jobs right now. Start one with New Job.</div>' : ''; return; }
    var rows = jobs.map(function (j) {
      return '<div class="queue-item" data-resume="' + esc(j.jobId) + '">' +
        '<div style="min-width:0">' +
          '<div class="ticket-id" style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(j.description || '(untitled job)') + '</div>' +
          '<div class="sub">' + esc(j.jobId) + ' &middot; ' + (j.ticketCount || 0) + ' ticket(s)</div>' +
          (j.coatings ? '<div class="sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(j.coatings) + '</div>' : '') +
        '</div>' +
        '<div class="sub" style="white-space:nowrap;color:var(--accent);font-weight:600">Resume &rsaquo;</div>' +
      '</div>';
    }).join('');
    bar.innerHTML =
      '<div class="card">' +
        '<h3 style="margin:0 0 4px;font-size:15px">Open jobs</h3>' +
        '<div class="sub" style="margin-bottom:10px">Tap one to resume adding tickets or coatings.</div>' +
        rows +
      '</div>';
    Array.prototype.forEach.call(bar.querySelectorAll('[data-resume]'), function (b) {
      b.onclick = function () { resumeJob(b.getAttribute('data-resume')); };
    });
  }

  // Resume an existing (unapproved) job into the same screen you see while creating a new job —
  // the add-tickets step, with the job's id, description and coating recipe already filled in.
  function resumeJob(jobId) {
    state.view = 'createJob';
    enterDetailView();
    var view = document.getElementById('view');
    var tok = viewToken;
    view.innerHTML = '<div class="loading">Loading job&hellip;</div>';
    google.script.run.withSuccessHandler(function (job) {
      if (tok !== viewToken) return;
      ensureRateData(function () {
        if (tok !== viewToken) return;
        // resumed: the person picking the job back up may not be who created it, so the add-ticket
        // screen asks for their name rather than logging their tickets under the creator's.
        currentJob = { jobId: job.jobId, description: job.description, coatings: job.coatings || [], operator: job.createdBy || '', notes: job.notes || '', resumed: true };
        state.jobId = job.jobId;
        // Seed the "added so far" list with the tickets already on the job (detail columns unknown here).
        jobAddedTickets = (job.tickets || []).map(function (t) { return { ticket: t.ticket, skidId: t.skidId, sheetsRun: '', estimatedWeightUsed: '', testedBw: t.testedBw || '' }; });
        renderCreateJobAddTickets();
      });
    }).withFailureHandler(function (err) {
      if (tok !== viewToken) return;
      view.innerHTML = '<div class="card empty">Error: ' + esc(err.message) + '</div>';
    }).getJobDetail(jobId);
  }

  function ticketRowHtml(t) {
    var right = t.status === 'Current' ? '' : '<span class="sub">Litho: ' + money(t.litho) + '</span>';
    var specs = '<div class="specs">' +
      '<span><b>BW</b> ' + esc(t.bw) + '</span>' +
      '<span><b>Type</b> ' + esc(t.type) + '</span>' +
      '<span><b>Temper</b> ' + esc(t.temper) + '</span>' +
      '<span><b>L</b> ' + esc(t.length) + '</span>' +
      '<span><b>W</b> ' + esc(t.width) + '</span>' +
      '<span><b>End Use</b> ' + esc(t.endUse) + '</span>' +
      '</div>';
    return '<div class="queue-item" data-skid="' + esc(t.skidId) + '">' +
      '<div style="min-width:0">' +
        '<div class="ticket-id">' + esc(t.ticket || '(no ticket)') + ' <span class="sub" style="font-weight:400">' + esc(t.skidId) + '</span></div>' + specs +
      '</div>' +
      '<div style="text-align:right;white-space:nowrap">' +
        '<span class="badge ' + badgeClassFor(t.status) + '">' + esc(t.status) + '</span><br>' + right +
      '</div>' +
    '</div>';
  }

  function renderAllRows(searchTerm) {
    var container = document.getElementById('allListContainer');
    if (!container) return;
    var term = (searchTerm || '').trim().toLowerCase();
    var rows = allCache.filter(function (t) {
      // The Litho list is the coating lifecycle only — once a skid is loaded into production
      // (In Production) or consumed (Used) it drops off this list; it lives in Production now.
      // Missing skids drop off too (they live in the count's Missing list); Cut pallets are metals
      // stock (they belong to the Slitter/Metals side), so they never appear in the Litho list.
      if (t.status === 'In Production' || t.status === 'Used' || t.status === 'Missing' || t.status === 'Cut') return false;
      if (term) {
        var hit = String(t.ticket).toLowerCase().indexOf(term) !== -1 ||
                  String(t.skidId).toLowerCase().indexOf(term) !== -1;
        if (!hit) return false;
        if (activeFilter === 'all') return true;
      }
      if (activeFilter === 'all') return true;
      if (activeFilter === 'current') return t.status === 'Current';
      if (activeFilter === 'pending') return t.status === 'Pending';
      if (activeFilter === 'wip') return t.status === 'WIP';
      return true;
    });

    if (!rows.length) {
      if (term) {
        var t = searchTerm.trim();
        var checking = recheckOnMiss(t, function () { var si = document.getElementById('mainSearch'); if (si) renderAllRows(si.value); });
        container.innerHTML = '<div class="card empty">No tickets match "' + esc(searchTerm) + '".' + (checking ? CHECKING_HTML : '') +
          '<div style="margin-top:14px"><button class="btn" id="manualAddBtn">Start ticket "' + esc(t) + '" manually</button>' +
          '<div class="sub" style="margin-top:8px">Use this only if the skid is on the floor but missing from Steel Tickets.</div></div></div>';
        var manualBtn = document.getElementById('manualAddBtn');
        manualBtn.onclick = function () { openAddTicket(t); };
      } else {
        container.innerHTML = '<div class="card empty">No tickets here yet.</div>';
      }
      return;
    }
    var html = '<div class="card">';
    rows.forEach(function (t) { html += ticketRowHtml(t); });
    html += '</div>';
    container.innerHTML = html;
    Array.prototype.forEach.call(container.querySelectorAll('.queue-item'), function (el) {
      el.onclick = function () { openCard(el.getAttribute('data-skid')); };
    });
  }

  // ---------------- Add a ticket (manual entry, with steel specs) ----------------
  function openAddTicket(prefillTicket) {
    state.view = 'addTicket';
    enterDetailView();
    renderAddTicket(prefillTicket || '');
  }

    view.innerHTML =

        '<div class="sub" style="margin-bottom:10px">Enter the ticket number (required). The ticket details below are optional.</div>' +
        '<div class="field"><label>Ticket number</label><input id="atTicket" value="' + esc(prefill) + '" autocomplete="off"></div>' +
      '</div>' +
      '<div class="card"><h3 style="margin-top:0;font-size:15px">Ticket details</h3>' +
        '<div class="sub" style="margin-bottom:10px">Fill in what you can from the steel ticket.</div>' +
        ticketFieldsHtml('at', {}) +
      '</div>' +
      '<div class="card">' + operatorFieldHtml('atOperator') +
        '<button class="btn success" id="saveAddTicketBtn">Add Ticket</button></div>';

    var ticketInput = document.getElementById('atTicket');
    document.getElementById('saveAddTicketBtn').onclick = function () {
      var operator = document.getElementById('atOperator').value.trim();
      var ticket = ticketInput.value.trim();

      if (!operator) { toast('Enter an operator name'); return; }

      runMutation('createManualTicket', [ticket, fields, operator, newOpId()],

          if (result && result.skidId) { toast('Ticket added'); openCard(result.skidId); }
